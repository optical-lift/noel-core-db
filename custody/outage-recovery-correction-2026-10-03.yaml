verifier_defects:
  - id: live_packet_transport_e2big
    prior_behavior: >-
      check-live-production-custody scripts placed the full live custody packet in the
      PACKET_JSON environment variable before starting Python.
    observed_failure: "/usr/bin/python3: Argument list too long"
    correction: >-
      Transport the packet through a temporary file and pass only the file path to Python.
    branch_status: corrected
  - id: nonblocking_live_audits
    prior_behavior: >-
      .github/workflows/custody.yml marked global, Atlas-lane, and WNPH-lane live checks
      continue-on-error: true, and scripts/check-custody-trigger.sh required that setting.
    consequence: >-
      A failed live audit could coexist with an overall successful custody workflow.
    correction: >-
      Remove continue-on-error from live checks and change the trigger contract to forbid it.
    branch_status: corrected
  - id: release_packet_rpc_signature_parser
    function: atlas.source_custody_release_packet_v1
    observed_failure: >-
      A dependent RPC-drift inspection path fails while parsing a timestamp with time zone
      function signature.
    status: unresolved_separate_defect
    recovery_behavior: >-
      Do not use this broken packet as closure evidence; calculate migration Git blob
      identity directly from retained schema_migrations statements when necessary.

branch_census:
  mechanically_preserved_count_from_outage_audit: 805
  semantic_adjudication_complete: false
  correction: >-
    Mechanical preservation of 805 branches does not prove that every surviving terminal
    tip received a semantic disposition. Current priority dispositions are recorded in a
    separate machine-readable branch-disposition receipt.

