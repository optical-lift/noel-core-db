  canonical_main_tree: 301c595bfffa9813c1d3530aa3485f3d389b6aa8
  corrective_branch: recovery/live-custody-tail-2026-10-03-v1

corrects:
  prior_completion_pr: 1393
  prior_completion_claim: outage_recovery_complete
  correction: >-
    The frozen outage recovery set was recovered, but the completion claim was broader
    than the evidence. Current production-source parity and exhaustive semantic branch
    adjudication were not proven at closure.

frozen_outage_set:
  conservative_window_count: 170
  already_in_final_2026_09_24_checkpoint: 8
  true_post_freeze_recovery_count: 162
  arithmetic_family_total: 162
  current_assessment: accounted_for_and_recovered
  reopen_original_162: false

live_source_custody:
  status: active_incomplete
  finding: >-
    Production advanced after the frozen census. Direct reads during this corrective pass
    found live post-completion migrations absent from canonical Noel main.
  moving_target_observed: true
  mutation_shape:
    appended_rows_observed: true
    same_version_name_or_content_change_observed: true
  consequence: >-
    No point-in-time tail snapshot may be labeled globally complete unless a fresh census
    immediately preceding closure is byte-compared to canonical source and the blocking
    live verifier passes on the exact candidate commit.
  production_mutation_authorized_by_this_recovery: false
  migration_rerun_authorized_by_this_recovery: false

concurrent_source_activity:
  family: titus_university_teacher_canon_lesson
  source_repository_checked: optical-lift/titus
  committed_exact_migration_source_found_during_pass: false
  note: >-
    Current Titus University work is modifying the shared production migration tail while
    this correction is running. Exact committed GitHub source for the newest migration
    names was not located during this pass; this remains an open custody item rather than
    permission to synthesize or release new database state.

verifier_defects:
  - id: live_packet_transport_e2big
    prior_behavior: >-
      check-live-production-custody scripts placed the full live custody packet in the
      PACKET_JSON environment variable before starting Python.
    observed_failure: "/usr/bin/python3: Argument list too long"
    correction: >-
      Transport the packet through a temporary file and pass only the file path to Python.
    branch_status: corrected
  - id: nonblocking_live_audits
    prior_behavior: >-
      .github/workflows/custody.yml marked global, Atlas-lane, and WNPH-lane live checks
      continue-on-error: true, and scripts/check-custody-trigger.sh required that setting.
    consequence: >-
      A failed live audit could coexist with an overall successful custody workflow.
    correction: >-
      Remove continue-on-error from live checks and change the trigger contract to forbid it.
    branch_status: corrected
  - id: release_packet_rpc_signature_parser
    function: atlas.source_custody_release_packet_v1
    observed_failure: >-
      A dependent RPC-drift inspection path fails while parsing a timestamp with time zone
      function signature.
    status: unresolved_separate_defect
    recovery_behavior: >-
      Do not use this broken packet as closure evidence; calculate migration Git blob
      identity directly from retained schema_migrations statements when necessary.

branch_census:
  mechanically_preserved_count_from_outage_audit: 805
  semantic_adjudication_complete: false
  stale_carriers_explicitly_adjudicated: 7
  correction: >-
    Mechanical preservation of 805 branches and explicit adjudication of seven stale
    carriers do not prove that every surviving terminal tip received a semantic disposition.

closure_requirements:
  - production_tail_stable_for_fresh_census_and_exact_candidate_check
  - every_live_post_fence_migration_has_exact_canonical_source_or_explicitly_sealed_historical_recovery
  - global_live_custody_verifier_exits_nonzero_on_any_rpc_transport_parse_or_byte_failure
  - exact_candidate_commit_receives_blocking_public_custody_ci
  - semantic_branch_disposition_scope_is_explicit_and_machine_readable
  - implementation_reality_generated_release_candidates_remain_governed_separately_until_authorized

forbidden_shortcuts:
  - do_not_rerun_production_migrations_to_make_git_match
  - do_not_rewrite_production_history_from_this_recovery
  - do_not_wholesale_merge_terminal_branches
  - do_not_treat_a_workflow_success_as_live_proof_when_a_live_step_did_not_execute_successfully
  - do_not_issue_a_replacement_completion_receipt_while_production_is_moving
