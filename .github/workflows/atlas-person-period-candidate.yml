name: Atlas period reader isolated SQL proof
on:
  pull_request:
    paths:
      - "candidates/atlas_person_period_source_history_v1/**"
      - "validation/atlas-person-period-v1/**"
      - ".github/workflows/atlas-person-period-candidate.yml"
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: synthetic-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: synthetic-only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile exact candidate and run synthetic tests
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f validation/atlas-person-period-v1/fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f candidates/atlas_person_period_source_history_v1/candidate.sql
          psql -X -v ON_ERROR_STOP=1 -f validation/atlas-person-period-v1/tests.sql
