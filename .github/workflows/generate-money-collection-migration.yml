name: Generate Money Collection Migration Identity

on:
  push:
    branches:
      - design/money-collection-kernel-v1

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: design/money-collection-kernel-v1

      - name: Install governed Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Generate canonical migration identity
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase migration new --help >/tmp/supabase-migration-new-help.txt
          if compgen -G 'supabase/migrations/*_atlas_money_collection_kernel_v1.sql' >/dev/null; then
            echo 'Canonical Money Collection migration already exists; nothing to generate.'
            exit 0
          fi
          supabase migration new atlas_money_collection_kernel_v1
          generated="$(ls -1t supabase/migrations/*_atlas_money_collection_kernel_v1.sql | head -n1)"
          test -n "$generated"
          echo "Generated $generated"

      - name: Commit generated migration identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- supabase/migrations)" ]]; then
            echo 'No generated migration to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations
          git commit -m 'Generate Money Collection migration identity with Supabase CLI'
          git push origin HEAD:design/money-collection-kernel-v1
