                  final_http_hits=re.findall(r'(?m)^U2_GOVERNOR_FINALIZE_HTTP_CLASS=(ok|bad_request|unauthorized|forbidden|not_found|conflict|server_failure|other_status)$',actor_text)
                  final_error_hits=re.findall(r'(?m)^U2_GOVERNOR_FINALIZE_ERROR_CLASS=(none|source_permission|source_constraint|source_conflict|source_argument|missing_function|missing_relation|missing_column|other_or_unspecified)$',actor_text)
                  final_guard_hits=re.findall(r'(?m)^U2_GOVERNOR_FINALIZE_SOURCE_GUARD=(accepted_receipt|worker_acceptance_precondition|current_source_precondition|native_original_writer_contract|allocation_plan_contract|current_root_precondition|exact_offer_identity_guard|offer_absent|missing_exact_offer|accepted_offer_missing|accepted_offer_identity_mismatch|accepted_offer_stale|native_standing_scope_denied|worker_subject_disclosure_denied|governor_adapter_source_denied|wrong_custody_branch|original_writer_custody_denied|sql_object_privilege_denied|sql_row_policy_denied|other_refusal)$',actor_text)
