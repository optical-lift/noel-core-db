                  final_error=final_error_hits[-1] if final_error_hits else 'not_reached'
                  final_guard=final_guard_hits[-1] if final_guard_hits else 'not_reached'
                  # Report finite actor categories only; private PG frames stay local.
                  frames=re.findall(r'(?m)^U2_GOVERNOR_FINALIZE_CALL_FRAME_EVIDENCE=(raise_frame_match|call_path_match|different_origin|unobservable|not_applicable)$',actor_text)
                  stages=re.findall(r'(?m)^U2_GOVERNOR_FINALIZE_CALL_SOURCE_STAGE=(u2b_finalizer|r02_adapter|r01_writer|canonical_original|native_allocation|native_governor|accepted_first_guard|inherited_or_other|unverified)$',actor_text)
