                  actual_error_hits=re.findall(r'(?m)^U4_ACTUAL_ERROR_CLASS=(source_permission|source_constraint|source_argument|source_conflict|missing_function|missing_relation|missing_column|none_or_other)$',actor_text)
                  actual_receipt_hits=re.findall(r'(?m)^U4_ACTUAL_RECEIPT_FIELD=(non_object|not_ok|work_item_mismatch|actual_contract_mismatch|not_completed|new_work_not_absent|clock_not_absent|result_id_not_uuid|accepted|not_checked)$',actor_text)
                  u4_http=(actual_http_hits[0] if len(actual_http_hits)==1 else
