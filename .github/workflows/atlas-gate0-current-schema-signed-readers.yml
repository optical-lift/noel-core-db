name: Atlas Gate 0 current-schema genuine signed alternate readers (TEST ONLY)
on:
  pull_request:
    paths:
      - '.github/workflows/atlas-gate0-current-schema-signed-readers.yml'
      - 'scripts/validate-atlas-access03-zone-retirement-signed-http.py'
      - 'tests/test_atlas_gate0_current_signed_source.py'
  issues:
    types: [opened, edited, reopened]
permissions:
  contents: read
  packages: read
jobs:
  source-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate test-only source
        run: |
          set -euo pipefail
          python3 tests/test_atlas_access03_trusted_signed_source.py
          python3 tests/test_atlas_gate0_current_signed_source.py
          python3 -m py_compile scripts/validate-atlas-access03-zone-retirement-signed-http.py
          bash -n scripts/validate-production-schema-clone.sh
  signed-current-schema-clone:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.state == 'open' &&
      github.event.issue.author_association == 'OWNER' &&
      github.actor == github.repository_owner &&
      github.event.issue.title == 'Atlas Gate 0: protected current-schema signed alternate reader test approval'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 55
    concurrency:
      group: atlas-gate0-current-schema-test-only
      cancel-in-progress: false
    steps:
      - name: Resolve exact owner-approved source SHA
        id: pin
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          hashes=re.findall(r"^source_sha:\s*([0-9a-f]{40})\s*$",os.environ.get("ISSUE_BODY",""),re.M)
          if len(hashes)!=1: raise SystemExit("One exact immutable source_sha required")
          with open(os.environ["GITHUB_OUTPUT"],"a") as out: out.write(f"source_sha={hashes[0]}\n")
          PY
      - name: Checkout canonical main and verify source custody
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify immutable approval and contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.pin.outputs.source_sha }}"
          bash scripts/check-custody.sh
          bash scripts/check-production-schema-validation-contract.sh
          bash scripts/check-production-release-contract.sh
          python3 tests/test_atlas_access03_trusted_signed_source.py
          python3 tests/test_atlas_gate0_current_signed_source.py
      - name: Install pinned CLI and registry
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/supabase/cli/releases/download/v2.116.0/supabase_linux_amd64.tar.gz -o "$RUNNER_TEMP/gate0-cli.tgz"
          tar -xzf "$RUNNER_TEMP/gate0-cli.tgz" -C "$RUNNER_TEMP" supabase
          sudo install -m 0755 "$RUNNER_TEMP/supabase" /usr/local/bin/supabase
          test "$(supabase --version | tail -n 1)" = 2.116.0
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
      - name: Snapshot Production schema and roles READ ONLY (no data)
        env:
          NOEL_CORE_DATABASE_URL: ${{ secrets.NOEL_CORE_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$NOEL_CORE_DATABASE_URL"
          supabase db dump --db-url "$NOEL_CORE_DATABASE_URL" --role-only --file "$RUNNER_TEMP/gate0-roles.sql"
          supabase db dump --db-url "$NOEL_CORE_DATABASE_URL" --file "$RUNNER_TEMP/gate0-schema.sql"
          test -s "$RUNNER_TEMP/gate0-roles.sql"
          test -s "$RUNNER_TEMP/gate0-schema.sql"
      - name: Assemble NO-OP test-only local migration and fictional DML
        id: scratch
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/gate0-current-scratch"
          mkdir -p "$scratch"
          (cd "$scratch" && supabase init --force && supabase migration new atlas_access03_zone_direct_reader_retirement_clone_only_v1)
          migration="$(find "$scratch/supabase/migrations" -type f -name '*_atlas_access03_zone_direct_reader_retirement_clone_only_v1.sql')"
          test -n "$migration"
          test "$(printf '%s\n' "$migration" | wc -l)" -eq 1
          # ACCESS-03A has already been applied to Production. Never replay it.
          # The scratch-only no-op runs ONLY on a disposable local clone.
          printf '%s\n' 'BEGIN;' 'SELECT 1 AS gate0_disposable_current_schema_only;' 'COMMIT;' > "$migration"
          fixture=validation/fixtures/20261112160559_atlas_access03_zone_direct_reader_retirement_v1.sql
          post=validation/migrations/20261112160559_atlas_access03_zone_direct_reader_retirement_v1.sql
          test -s "$fixture" && test -s "$post"
          echo "version=$(basename "$migration" | cut -d_ -f1)" >> "$GITHUB_OUTPUT"
          echo "migration=$migration" >> "$GITHUB_OUTPUT"
          echo "fixture=$fixture" >> "$GITHUB_OUTPUT"
          echo "postconditions=$post" >> "$GITHUB_OUTPUT"
      - name: Test independent signed local GoTrue users and alternate routes
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=25s 20m \
            bash scripts/validate-production-schema-clone.sh \
              --migration-version "${{ steps.scratch.outputs.version }}" \
              --release-lane atlas \
              --candidate-migration "${{ steps.scratch.outputs.migration }}" \
              --candidate-fixture "${{ steps.scratch.outputs.fixture }}" \
              --candidate-validation "${{ steps.scratch.outputs.postconditions }}" \
              --roles-dump "$RUNNER_TEMP/gate0-roles.sql" \
              --schema-dump "$RUNNER_TEMP/gate0-schema.sql" \
              --artifacts-dir "$RUNNER_TEMP/gate0-current-artifacts"
          test -s "$RUNNER_TEMP/gate0-current-artifacts/signed-access03-zone-retirement-summary.txt"
          grep -q '^PASS ACCESS03 signed ' "$RUNNER_TEMP/gate0-current-artifacts/signed-access03-zone-retirement-summary.txt"
      - name: Record bounded signed proof result
        if: always()
        run: |
          set -euo pipefail
          summary="$RUNNER_TEMP/gate0-current-artifacts/signed-access03-zone-retirement-summary.txt"
          log="$RUNNER_TEMP/gate0-current-artifacts/signed-access03-zone-retirement.log"
          if test -s "$summary" && grep -q '^PASS ACCESS03 signed ' "$summary"; then
            echo 'GATE0_CURRENT_SCHEMA_SIGNED_RESULT=PASS_TESTED_PATHS_ONLY' >> "$GITHUB_STEP_SUMMARY"
          elif test -s "$summary" && grep -q '^UNSAFE GATE0 SIGNED LOCAL DIRECT TABLE READ:' "$summary"; then
            echo 'GATE0_CURRENT_SCHEMA_SIGNED_RESULT=FAIL_UNSAFE_DIRECT_RLS' >> "$GITHUB_STEP_SUMMARY"
            grep '^UNSAFE GATE0 SIGNED LOCAL DIRECT TABLE READ:' "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'GATE0_CURRENT_SCHEMA_SIGNED_RESULT=FAILED_OR_NOT_REACHED' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -s "$log"; then
            grep -E '^(PASS GATE0|UNSAFE GATE0|GATE0 direct)' "$log" | tail -n 40 >> "$GITHUB_STEP_SUMMARY" || true
          fi
          echo 'Read-only live schema snapshot; all session/data/NO-OP writes on localhost ONLY. NOT live user acceptance.' >> "$GITHUB_STEP_SUMMARY"
