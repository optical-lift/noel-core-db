name: Generate Ledger Graph Migration Identity

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  generate:
    if: github.head_ref == 'ledger-graph-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Generate migration identity without Supabase connection
        run: |
          supabase migration new atlas_ledger_graph_v1
          generated="$(find supabase/migrations -maxdepth 1 -type f -name '*_atlas_ledger_graph_v1.sql' -printf '%f\n' | sort | tail -n1)"
          test -n "$generated"
          echo "generated=$generated"
          mkdir -p /tmp/ledger-graph-migration-identity
          cp "supabase/migrations/$generated" "/tmp/ledger-graph-migration-identity/$generated"
          printf '%s\n' "$generated" > /tmp/ledger-graph-migration-identity/GENERATED_IDENTITY.txt

      - name: Upload generated migration identity
        uses: actions/upload-artifact@v4
        with:
          name: ledger-graph-migration-identity
          path: /tmp/ledger-graph-migration-identity/
          if-no-files-found: error
          retention-days: 1
