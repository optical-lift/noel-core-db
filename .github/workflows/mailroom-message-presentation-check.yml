name: Communication Event presentation function check

on:
  pull_request:
    paths:
      - "supabase/functions/communication-event-presentation/**"
      - "supabase/functions/mailroom-message-presentation/**"
      - ".github/workflows/mailroom-message-presentation-check.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/communication-event-presentation/**"
      - "supabase/functions/mailroom-message-presentation/**"
      - ".github/workflows/mailroom-message-presentation-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check common Communication Event presentation
        run: deno check supabase/functions/communication-event-presentation/index.ts

      - name: Type-check retired Mailroom presentation tombstone
        run: deno check supabase/functions/mailroom-message-presentation/index.ts
