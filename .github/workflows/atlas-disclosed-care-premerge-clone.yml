name: Atlas disclosed continuing-care premerge signed clone
on:
  issues:
    types: [opened, edited, reopened]
  pull_request:
    paths:
      - ".github/workflows/atlas-disclosed-care-premerge-clone.yml"
permissions:
  contents: read
  packages: read
concurrency:
  group: atlas-disclosed-care-premerge-proof
  cancel-in-progress: false
jobs:
  source-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check source-only, owner-only, secrets-after-snapshot boundaries
        shell: bash
        run: |
          set -euo pipefail
          ruby -r yaml -e 'YAML.load_file(".github/workflows/atlas-disclosed-care-premerge-clone.yml")'
          python3 - <<'PY'
          from pathlib import Path
          src=Path(".github/workflows/atlas-disclosed-care-premerge-clone.yml").read_text()
          assert "github.event.issue.author_association == 'OWNER'" in src
          assert src.count("github.actor == github.repository_owner") >= 2
          assert "environment: production" in src
          assert src.index("name: Snapshot production roles and user schema") < src.index("name: Checkout exact private-safe candidate source")
          assert "supabase migration new atlas_care_single_done_signed_proof_v1" in src
          assert "signed-care-single-done-summary.txt" in src
          assert "supabase db dump --db-url" in src
          assert "candidate_sha:" in src
          assert src.count("$"+"{{") >= 16
          for fragments in (("supabase"," db push"), ("supabase"," db reset --linked"),
                            ("gh ","pr merge"), ("supabase migration"," repair")):
              prohibited="".join(fragments)
              assert prohibited not in src, prohibited
          print("PASS untrusted PR gets no credential; owner issue runs only read-only snapshot and local clone")
          PY

  validate:
    if: >-
      github.event.issue.state == 'open' &&
      github.event.issue.author_association == 'OWNER' &&
      github.actor == github.repository_owner &&
      github.event.issue.title == 'Atlas disclosed care: protected signed clone gate'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    steps:
      - name: Resolve exact owner-supplied immutable candidate
        id: request
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          matches=re.findall(r'^candidate_sha:\s*([0-9a-f]{40})\s*$',
                             os.environ.get('ISSUE_BODY',''),re.M)
          if len(matches)!=1:
              raise SystemExit('Exactly one candidate_sha: <40-hex> issue field required')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('candidate_sha='+matches[0]+'\n')
          PY

      - name: Checkout canonical validator from main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify existing custody/clone contracts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-custody.sh
          bash scripts/check-production-release-contract.sh
          bash scripts/check-production-schema-validation-contract.sh
      - name: Install pinned Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/supabase/cli/releases/download/v2.116.0/supabase_linux_amd64.tar.gz -o /tmp/supabase.tgz
          tar -xzf /tmp/supabase.tgz -C /tmp supabase
          sudo install -m 0755 /tmp/supabase /usr/local/bin/supabase
          test "$(supabase --version | tail -n1)" = '2.116.0'
      - name: Authenticate read-only container registry
        shell: bash
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin

      # The sole credential-bearing step. Candidate code is NOT checked out yet.
      # The Supabase CLI exports ROLES + SCHEMA only; no production row data.
      - name: Snapshot production roles and user schema READ ONLY
        shell: bash
        env:
          NOEL_CORE_DATABASE_URL: ${{ secrets.NOEL_CORE_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$NOEL_CORE_DATABASE_URL"
          supabase db dump --db-url "$NOEL_CORE_DATABASE_URL" \
            --role-only --file "$RUNNER_TEMP/disclosed-care-roles.sql"
          supabase db dump --db-url "$NOEL_CORE_DATABASE_URL" \
            --file "$RUNNER_TEMP/disclosed-care-user-schema.sql"
          test -s "$RUNNER_TEMP/disclosed-care-roles.sql"
          test -s "$RUNNER_TEMP/disclosed-care-user-schema.sql"

      # Only now checkout the owner-specified candidate SHA; no DB URL in env.
      - name: Checkout exact private-safe candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - name: Validate source paths and exact candidate contract
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_SHA"
          dir="candidate/candidates/atlas_care_disclosed_signed_clone_v1"
          for name in combined_clone_only.sql fictional_fixture.sql clone_postconditions.sql; do test -s "$dir/$name"; done
          test -s scripts/validate-atlas-care-single-done-signed-http.py
          python3 -m py_compile scripts/validate-atlas-care-single-done-signed-http.py
          bash -n scripts/validate-production-schema-clone.sh
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('candidate/candidates/atlas_care_disclosed_signed_clone_v1')
          sql=(p/'combined_clone_only.sql').read_text().strip()
          assert re.search(r'(?m)^BEGIN;',sql) and sql.endswith('COMMIT;')
          assert 'CLONE TEST ONLY' in sql and 'only_disposable' in sql
          assert 'connected_person_disclosed_standing_rhythms_self_api_v1' in sql
          fixture=(p/'fictional_fixture.sql').read_text()
          fixture=re.sub(r'/\*.*?\*/',' ',fixture,flags=re.S)
          fixture=re.sub(r'--[^\n]*',' ',fixture)
          statements=[s.strip() for s in fixture.split(';') if s.strip()]
          assert statements and all(re.match(r'(?i)^(INSERT|UPDATE)\s+',statement) for statement in statements)
          harness=Path('scripts/validate-production-schema-clone.sh').read_text()
          for s in ('signed_care_single_done_probe=true',
                    'validate-atlas-care-single-done-signed-http.py',
                    'signed-care-single-done-summary.txt'):
              assert s in harness,s
          PY
          sha256sum "$dir/combined_clone_only.sql" "$dir/fictional_fixture.sql" "$dir/clone_postconditions.sql"

      # This is ONLY an ephemeral CLI scratch filename used by the existing
      # clone harness. No canonical migration is created, merged or released.
      - name: Produce scratch file for existing version-named clone harness
        id: scratch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/disclosed-care-scratch"
          cd "$RUNNER_TEMP/disclosed-care-scratch"
          supabase init --force
          supabase migration new atlas_care_single_done_signed_proof_v1
          mapfile -t found < <(find supabase/migrations -maxdepth 1 -type f \
             -name '*_atlas_care_single_done_signed_proof_v1.sql')
          test "${#found[@]}" = 1
          file="$PWD/${found[0]}"
          cp "$GITHUB_WORKSPACE/candidate/candidates/atlas_care_disclosed_signed_clone_v1/combined_clone_only.sql" "$file"
          basename="$(basename "$file")"
          version="${basename%%_*}"
          [[ "$version" =~ ^[0-9]{14}$ ]]
          echo "scratch_file=$file" >> "$GITHUB_OUTPUT"
          echo "scratch_version=$version" >> "$GITHUB_OUTPUT"
      - name: Validate full disposable clone and real signed local GoTrue/REST
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/scripts/validate-production-schema-clone.sh" \
            --migration-version "${{ steps.scratch.outputs.scratch_version }}" \
            --release-lane atlas \
            --candidate-migration "${{ steps.scratch.outputs.scratch_file }}" \
            --candidate-fixture "$GITHUB_WORKSPACE/candidate/candidates/atlas_care_disclosed_signed_clone_v1/fictional_fixture.sql" \
            --candidate-validation "$GITHUB_WORKSPACE/candidate/candidates/atlas_care_disclosed_signed_clone_v1/clone_postconditions.sql" \
            --roles-dump "$RUNNER_TEMP/disclosed-care-roles.sql" \
            --schema-dump "$RUNNER_TEMP/disclosed-care-user-schema.sql" \
            --artifacts-dir "$RUNNER_TEMP/disclosed-care-clone-artifacts"
          test -s "$RUNNER_TEMP/disclosed-care-clone-artifacts/signed-care-single-done-summary.txt"
          grep -q '^PASS' "$RUNNER_TEMP/disclosed-care-clone-artifacts/signed-care-single-done-summary.txt"
      - name: Publish non-sensitive local clone summary
        if: always()
        shell: bash
        run: |
          if [[ -s "$RUNNER_TEMP/disclosed-care-clone-artifacts/summary.md" ]]; then
            cat "$RUNNER_TEMP/disclosed-care-clone-artifacts/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No completed clone summary. Inspect the failing step." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve clone diagnostics only, never schemas or credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-disclosed-care-premerge-clone-review
          path: ${{ runner.temp }}/disclosed-care-clone-artifacts
          if-no-files-found: ignore
          retention-days: 14

  report:
    name: Report result to source review issue
    needs: [validate]
    if: >-
      always() &&
      github.event.issue.state == 'open' &&
      github.event.issue.author_association == 'OWNER' &&
      github.actor == github.repository_owner &&
      github.event.issue.title == 'Atlas disclosed care: protected signed clone gate'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Publish result enum and run link, not private material
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT: ${{ needs.validate.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          case "$RESULT" in success|failure|cancelled|skipped) ;; *) exit 2 ;; esac
          gh issue comment "$ISSUE_NUMBER" --body \
            "Atlas disclosed standing care candidate full-schema and signed local GoTrue premerge proof: **$RESULT**. [View exact validation run]($RUN_URL). No source merge, generated migration, production release, Person grant or real Work mutation was created."
