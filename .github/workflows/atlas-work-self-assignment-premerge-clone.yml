          output=root/"signed-native-work-journal-failure-location.txt"
          root.mkdir(parents=True,exist_ok=True)
          lines=["SIGNED_NATIVE_WORK_JOURNAL_FAILURE_LOCATION_V1"]
          if log.is_file():
              raw=log.read_text(errors="replace")
              files={"validate_signed_native_work_journal.py","validate-atlas-work-prerequisite-signed-http.py","validate-atlas-c1-signed-http.py"}
              for name,line in re.findall(r'File "[^"\n]*/([A-Za-z0-9_.-]+)", line ([0-9]{1,5}), in ',raw):
