name: Atlas private Person Collections SQL candidate proof
on:
  pull_request:
    paths:
      - "candidates/atlas_person_health_collections_filing_v1/**"
      - "validation/atlas-person-collections-v1/**"
      - ".github/workflows/atlas-person-collections-candidate.yml"
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ephemeral-fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ephemeral-fixture-only
      PGDATABASE: postgres
    steps:
      - name: Checkout private-safe source candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile SQL and prove isolated owner-bound filing
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f validation/atlas-person-collections-v1/fixture-schema.sql
          psql -X -v ON_ERROR_STOP=1 -f candidates/atlas_person_health_collections_filing_v1/candidate.sql
          psql -X -v ON_ERROR_STOP=1 -f validation/atlas-person-collections-v1/test-file-move-and-privacy.sql
          echo "Only disposable Postgres/simulated identity passed. Production-schema clone and genuine signed HTTP sessions remain separate required gates."
