name: Validate Money Collection Migration

on:
  push:
    branches:
      - design/money-collection-kernel-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: design/money-collection-kernel-v1

      - name: Parse canonical migration with PostgreSQL parser
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet 'pglast>=7,<8'
          python3 -c "from pathlib import Path; from pglast import parse_sql; p=Path('supabase/migrations/20260901161304_atlas_money_collection_kernel_v1.sql'); s=p.read_text(encoding='utf-8'); parse_sql(s); print(f'PostgreSQL parser accepted {len(s.splitlines())} lines')"

      - name: Verify migration transaction and cutover invariants
        shell: bash
        run: |
          set -euo pipefail
          target='supabase/migrations/20260901161304_atlas_money_collection_kernel_v1.sql'
          [[ "$(grep -c '^BEGIN;$' "$target")" -eq 1 ]]
          [[ "$(grep -c '^COMMIT;$' "$target")" -eq 1 ]]
          [[ "$(grep -c '^ROLLBACK;$' "$target" || true)" -eq 0 ]]
          [[ "$(grep -c "'20260901161304_atlas_money_collection_kernel_v1'" "$target")" -eq 2 ]]
          grep -q '^lock table$' "$target"
          grep -q 'v_cutover_at timestamptz := clock_timestamp();' "$target"
          grep -q 'drop table atlas.community_registration_payments;' "$target"
          grep -q 'drop function atlas.money_source_coverage_state_core_v1(' "$target"

      - name: Verify repository and release contracts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-custody.sh
          bash scripts/check-migration-release-lane.sh 20260901161304 atlas
          bash scripts/check-production-release-contract.sh
