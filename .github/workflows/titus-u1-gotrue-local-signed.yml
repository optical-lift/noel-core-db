name: HELD Titus U1 genuine local GoTrue signed proof (fictional, no deploy)
on:
  push:
    branches:
      - candidate/shared-course-unification-clean-cutover-v1-20261107
    paths:
      - 'candidates/shared-teaching-course-clean-cutover-v1/titus_u1_local_gotrue_fixture.sql'
      - 'candidates/shared-teaching-course-clean-cutover-v1/titus_account_context_candidate.sql'
      - 'candidates/shared-teaching-course-clean-cutover-v1/titus_institution_account_admission_issuer_candidate.sql'
      - 'candidates/shared-teaching-course-clean-cutover-v1/titus_institution_account_self_service_candidate.sql'
      - 'scripts/test-titus-u1-gotrue-local-only.sh'
      - 'scripts/validate-titus-u1-gotrue-local-signed.py'
      - 'tests/test_titus_u1_local_signed_safety.py'
      - '.github/workflows/titus-u1-gotrue-local-signed.yml'
  pull_request:
    paths:
      - 'candidates/shared-teaching-course-clean-cutover-v1/titus_u1_local_gotrue_fixture.sql'
      - 'candidates/shared-teaching-course-clean-cutover-v1/titus_account_context_candidate.sql'
      - 'candidates/shared-teaching-course-clean-cutover-v1/titus_institution_account_admission_issuer_candidate.sql'
      - 'candidates/shared-teaching-course-clean-cutover-v1/titus_institution_account_self_service_candidate.sql'
      - 'scripts/test-titus-u1-gotrue-local-only.sh'
      - 'scripts/validate-titus-u1-gotrue-local-signed.py'
      - 'tests/test_titus_u1_local_signed_safety.py'
      - '.github/workflows/titus-u1-gotrue-local-signed.yml'

permissions:
  contents: read

concurrency:
  group: titus-u1-signed-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-gotrue:
    if: github.repository == 'optical-lift/noel-core-db'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check exact signed-local source and denial contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n scripts/test-titus-u1-gotrue-local-only.sh
          python3 -m py_compile scripts/validate-titus-u1-gotrue-local-signed.py
          python3 -m unittest discover -s tests -p 'test_titus_u1_local_signed_safety.py' -v
      - name: Install pinned Supabase CLI v2 (no hosted access)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/supabase/cli/releases/download/v2.116.0/supabase_linux_amd64.tar.gz -o "$RUNNER_TEMP/titus-u1-cli.tgz"
          tar -xzf "$RUNNER_TEMP/titus-u1-cli.tgz" -C "$RUNNER_TEMP" supabase
          sudo install -m 0755 "$RUNNER_TEMP/supabase" /usr/local/bin/supabase
          test "$(supabase --version | tail -n 1)" = 2.116.0
      - name: Genuine local GoTrue/PostgREST U1 owner invite and self-withdraw
        shell: bash
        env:
          # This job intentionally receives NO Supabase project URL, API
          # secrets, production environment, schema dump or owner approval.
          SUPABASE_NON_INTERACTIVE: 'true'
        run: |
          set -euo pipefail
          bash scripts/test-titus-u1-gotrue-local-only.sh
