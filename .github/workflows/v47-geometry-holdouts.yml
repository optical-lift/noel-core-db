name: V47 frozen posterior geometry and holdouts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v47-geometry-holdouts.yml'

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen numerical runtime
        run: python -m pip install --disable-pip-version-check numpy scipy scikit-learn

      - name: Acquire GitHub OIDC identity
        shell: bash
        run: |
          set -euo pipefail
          RESP=$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=v46-noel")
          TOKEN=$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$RESP")
          echo "V47_OIDC_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Fetch frozen anonymous development corpus
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer ${V47_OIDC_TOKEN}" \
            "https://zirqkouammpwxlqfbsvf.supabase.co/functions/v1/v46-github-oidc-export" \
            -o v46-development.csv

      - name: Verify corpus custody checksum
        run: |
          python - <<'PY'
          import csv, hashlib
          alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_~'
          rows=[]; tokens=0
          with open('v46-development.csv', newline='', encoding='utf-8') as f:
              for r in csv.DictReader(f):
                  states=[int(x) for x in r['state_sequence'].split(',')]
                  n=int(r['n_tokens']); assert len(states)==n
                  enc=''.join(alphabet[s-1] for s in states)
                  rows.append(f"{r['book']}|{r['block_index']}|{n}|{enc}")
                  tokens += n
          payload='\n'.join(rows); digest=hashlib.md5(payload.encode()).hexdigest()
          assert len(rows)==110, len(rows)
          assert tokens==158503, tokens
          assert digest=='bd96b60afa631d02dc7031e0a398a9dc', digest
          print({'blocks':len(rows),'tokens':tokens,'payload_md5':digest})
          PY

      - name: Download frozen K12 seed46 parameters
        uses: actions/download-artifact@v4
        with:
          name: v46-k12-seed46
          path: frozen/seed46
          github-token: ${{ github.token }}
          repository: optical-lift/noel-core-db
          run-id: 34230388044

      - name: Download frozen K12 seed460 parameters
        uses: actions/download-artifact@v4
        with:
          name: v46-k12-seed460
          path: frozen/seed460
          github-token: ${{ github.token }}
          repository: optical-lift/noel-core-db
          run-id: 34230388044

      - name: Download frozen K12 seed4600 parameters
        uses: actions/download-artifact@v4
        with:
          name: v46-k12-seed4600
          path: frozen/seed4600
          github-token: ${{ github.token }}
          repository: optical-lift/noel-core-db
          run-id: 34230388044

      - name: Compute target-blind geometry and holdouts
        run: |
          python validation/v47-geometry-holdouts.py v46-development.csv \
            --p46 frozen/seed46/k12_seed46.npz \
            --p460 frozen/seed460/k12_seed460.npz \
            --p4600 frozen/seed4600/k12_seed4600.npz \
            --out v47_geometry

      - uses: actions/upload-artifact@v4
        with:
          name: v47-geometry-holdouts
          path: v47_geometry/
          retention-days: 30
