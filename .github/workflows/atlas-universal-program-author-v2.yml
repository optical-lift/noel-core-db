name: Atlas universal authored Program v2 isolated SQL
on:
  pull_request:
    paths:
      - "candidates/atlas-universal-program-author-v2/**"
      - "validation/atlas-universal-program-author-v2/**"
      - ".github/workflows/atlas-universal-program-author-v2.yml"
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        postgres_major: ['16','17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres_major }}-alpine
        env:
          POSTGRES_PASSWORD: synthetic-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: synthetic-only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify v1 and v2 share one Program authority under fictional Principals
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f validation/atlas-personal-training-author-v1/fixture-schema.sql
          psql -X -v ON_ERROR_STOP=1 -f candidates/atlas-personal-training-author-v1/candidate.sql
          psql -X -v ON_ERROR_STOP=1 -f candidates/atlas-universal-program-author-v2/candidate.sql
          psql -X -v ON_ERROR_STOP=1 -f candidates/atlas-personal-training-author-v1/postconditions.sql
          psql -X -v ON_ERROR_STOP=1 -f candidates/atlas-universal-program-author-v2/postconditions.sql
          psql -X -v ON_ERROR_STOP=1 -f validation/atlas-personal-training-author-v1/test-author-lifecycle.sql
          psql -X -v ON_ERROR_STOP=1 -f validation/atlas-universal-program-author-v2/test-author-v2.sql
