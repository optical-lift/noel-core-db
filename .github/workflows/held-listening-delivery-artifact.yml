name: HELD listening delivery artifact isolated proof
on:
  pull_request:
    paths:
      - "candidates/shared-listening-delivery-artifact-v1/**"
      - "validation/shared-listening-delivery-artifact-v1/**"
      - ".github/workflows/held-listening-delivery-artifact.yml"
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ephemeral-fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ephemeral-fixture-only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply held candidate to fictional source subset and prove denials
        run: |
          set -euo pipefail
          cmp -s candidates/shared-listening-delivery-artifact-v1/canonical_native_private_listening_admission_v1.sql <(cat \
            candidates/shared-listening-delivery-artifact-v1/generated_production_completion_candidate.sql \
            candidates/shared-listening-delivery-artifact-v1/manuscript_original_registration_candidate.sql \
            candidates/shared-listening-delivery-artifact-v1/generated_listening_storage_candidate.sql)
          python3 validation/shared-listening-delivery-artifact-v1/verify_canonical_migration_partition.py
          psql -X -v ON_ERROR_STOP=1 -f validation/shared-listening-delivery-artifact-v1/fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f candidates/shared-listening-delivery-artifact-v1/candidate.sql
          psql -X -v ON_ERROR_STOP=1 -f candidates/shared-listening-delivery-artifact-v1/postconditions.sql
          psql -X -v ON_ERROR_STOP=1 -f validation/shared-listening-delivery-artifact-v1/test.sql
          psql -X -v ON_ERROR_STOP=1 -f candidates/shared-listening-delivery-artifact-v1/canonical_native_private_listening_postconditions_v1.sql
          # Reuse canonical source helper from this same held package;
          # static import/compile only, not a credential-bearing signed test.
          python3 -m py_compile candidates/shared-listening-delivery-artifact-v1/verify_private_mp3_profile_signed.py
          # The same isolated PG17 container proves the incremental fixed
          # private MP3 delivery profile; no extra validation system.
          psql -X -v ON_ERROR_STOP=1 -f validation/shared-listening-delivery-artifact-v1/private_mp3_profile_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f candidates/shared-listening-delivery-artifact-v1/private_mp3_delivery_profile_candidate.sql
          psql -X -v ON_ERROR_STOP=1 -f validation/shared-listening-delivery-artifact-v1/private_mp3_profile_tests.sql
          psql -X -v ON_ERROR_STOP=1 -f candidates/shared-listening-delivery-artifact-v1/private_mp3_delivery_profile_postconditions.sql
          echo "Synthetic isolated PostgreSQL only; no production clone, real signed Auth, media, publication or release."
