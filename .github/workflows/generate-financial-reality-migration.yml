name: Generate Financial Reality Migration

on:
  push:
    branches:
      - design/financial-reality-kernel-v1

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: design/financial-reality-kernel-v1

      - name: Install governed Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Generate canonical migration identity
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase migration new --help >/tmp/supabase-migration-new-help.txt
          if compgen -G 'supabase/migrations/*_atlas_financial_reality_kernel_v1.sql' >/dev/null; then
            echo 'Canonical Financial Reality migration already exists; nothing to generate.'
            exit 0
          fi
          supabase migration new atlas_financial_reality_kernel_v1
          generated="$(ls -1t supabase/migrations/*_atlas_financial_reality_kernel_v1.sql | head -n1)"
          test -n "$generated"
          echo "$generated" > /tmp/financial-reality-migration-path
          basename "$generated" | cut -d_ -f1 > /tmp/financial-reality-migration-version
          echo "Generated $generated"

      - name: Assemble reviewed Financial Reality sources
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s /tmp/financial-reality-migration-path ]; then
            echo 'No new migration identity was generated.'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path

          target = Path(Path('/tmp/financial-reality-migration-path').read_text().strip())
          version = Path('/tmp/financial-reality-migration-version').read_text().strip()
          provenance = f'{version}_atlas_financial_reality_kernel_v1'

          base = Path('architecture/atlas-financial-reality-kernel-v1.sql').read_text(encoding='utf-8')
          if not base.startswith('BEGIN;'):
              raise SystemExit('Financial Reality proof must begin with BEGIN;')
          if '\nROLLBACK;' not in base:
              raise SystemExit('Financial Reality proof must end with ROLLBACK;')
          base_body = base[len('BEGIN;'):].rsplit('\nROLLBACK;', 1)[0].strip()

          sources = [
              ('Financial Reality base authority', base_body),
              ('Append-only idempotency correction', Path('architecture/atlas-financial-reality-kernel-v1-idempotency-correction.sql').read_text(encoding='utf-8').strip()),
              ('Organization connected-source command membrane', Path('architecture/atlas-organization-connected-source-commands-v1.sql').read_text(encoding='utf-8').strip()),
              ('Vault-backed connected-source secret custody', Path('architecture/atlas-connected-source-secret-custody-v1.sql').read_text(encoding='utf-8').strip()),
              ('Provider delivery/replay custody', Path('architecture/atlas-financial-source-delivery-custody-v1.sql').read_text(encoding='utf-8').strip()),
          ]

          header = f'''BEGIN;\n\n-- Atlas Financial Reality Kernel v1.\n-- Canonical migration identity generated by Supabase CLI v2.116.0.\n-- Release provenance: {provenance}\n--\n-- Provider-neutral financial evidence/reconciliation authority. Stripe, banks,\n-- accounting systems, invoices, receipts, and future sources remain witnesses;\n-- no provider becomes universal economic or accounting truth.\n'''
          chunks = [header]
          for title, sql in sources:
              chunks.append(f'\n-- === {title} ===\n{sql}\n')
          chunks.append('\nCOMMIT;\n')
          target.write_text('\n'.join(chunks), encoding='utf-8')
          print(f'Assembled {target} ({len(target.read_text().splitlines())} lines)')
          PY

      - name: Parse and verify canonical migration
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s /tmp/financial-reality-migration-path ]; then
            exit 0
          fi
          target="$(cat /tmp/financial-reality-migration-path)"
          version="$(cat /tmp/financial-reality-migration-version)"
          python3 -m pip install --disable-pip-version-check --quiet 'pglast>=7,<8'
          python3 - "$target" <<'PY'
          import sys
          from pathlib import Path
          from pglast import parse_sql
          p = Path(sys.argv[1])
          sql = p.read_text(encoding='utf-8')
          parse_sql(sql)
          if sql.count('\nBEGIN;') + sql.startswith('BEGIN;') != 1:
              raise SystemExit('Expected exactly one migration BEGIN')
          if sql.count('\nCOMMIT;') != 1:
              raise SystemExit('Expected exactly one migration COMMIT')
          if 'ROLLBACK;' in sql:
              raise SystemExit('Canonical migration must not contain ROLLBACK')
          print(f'PostgreSQL parser accepted {len(sql.splitlines())} canonical migration lines')
          PY
          bash scripts/check-custody.sh
          bash scripts/check-migration-release-lane.sh "$version" atlas
          bash scripts/check-production-release-contract.sh

      - name: Commit canonical migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- supabase/migrations; then
            echo 'No generated migration to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations
          git commit -m 'Generate Financial Reality canonical migration'
          git push origin HEAD:design/financial-reality-kernel-v1
