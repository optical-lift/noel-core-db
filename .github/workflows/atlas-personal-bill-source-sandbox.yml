name: Atlas personal bill source custody sandbox (no production writes)
on:
  push:
    branches:
      - work/atlas-personal-bill-source-read-20261013
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas_fixture
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: atlas_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: atlas_fixture
      PGPASSWORD: fixture_only
      PGDATABASE: atlas_fixture
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Create two synthetic Principals and six source types
        run: psql -v ON_ERROR_STOP=1 -f validation/atlas_personal_bill_source_read_fixture.sql
      - name: Install scoped bill observation read without live database
        run: psql -v ON_ERROR_STOP=1 -f candidates/atlas_personal_bill_source_observation_read_v1.sql
      - name: Assert personal scope and no raw-body leak
        run: psql -v ON_ERROR_STOP=1 -f validation/atlas_personal_bill_source_read_proof.sql
