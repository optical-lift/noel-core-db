name: HELD UNI-OPS historical stale token HTTP409 proposal (source only)
on:
  pull_request:
    paths:
      - 'candidates/atlas_uniops_historical_stale_transport_v2/**'
      - 'candidates/atlas_uniops_historical_stale_transport_v3/**'
      - 'tests/test_uniops_history_stale_409_source_only.py'
      - 'tests/test_uniops_history_stale_409_v3_source_only.py'
      - 'tests/append_uniops_history_http409_disposable_held.py'
      - 'tests/test_uniops_history_http409_overlay_source_only.py'
      - '.github/workflows/held-uniops-historical-stale-409-source-only.yml'
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout proposed candidate sources only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch exact frozen governor source without executing SQL
        shell: bash
        run: |
          set -euo pipefail
          git init -q frozen-governor-source
          git -C frozen-governor-source remote add origin https://github.com/optical-lift/noel-core-db.git
          git -C frozen-governor-source -c credential.helper= fetch -q --depth=1 --no-tags origin ddfb0bf5374798301fe076a61d2b944dfb52ff63
          test "$(git -C frozen-governor-source rev-parse FETCH_HEAD)" = ddfb0bf5374798301fe076a61d2b944dfb52ff63
          git -C frozen-governor-source -c advice.detachedHead=false checkout --quiet --detach ddfb0bf5374798301fe076a61d2b944dfb52ff63
          test "$(git -C frozen-governor-source hash-object candidates/atlas_universal_work_lifecycle_v1/20_native_historical_retirement_candidate.sql)" = 93f7b9cf0bad5eb536ffa90d3973aabfe75542d9
      - name: Prove exact one-branch candidate delta and negative refusals
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/test_uniops_history_stale_409_source_only.py
          python3 tests/test_uniops_history_stale_409_source_only.py \
            --frozen frozen-governor-source/candidates/atlas_universal_work_lifecycle_v1/20_native_historical_retirement_candidate.sql \
            --candidate candidates/atlas_uniops_historical_stale_transport_v2/candidate.sql
          test "$(git hash-object candidates/atlas_uniops_historical_stale_transport_v2/candidate.sql)" = da3ddafc8f479327df02fbe16e418eb0b094072d
          test "$(git hash-object candidates/atlas_uniops_historical_stale_transport_v3/candidate.sql)" = 0318ac92492d34adcd1475255304cc21dca449e6
          python3 -m py_compile tests/test_uniops_history_stale_409_v3_source_only.py
          python3 tests/test_uniops_history_stale_409_v3_source_only.py
          python3 -m py_compile tests/append_uniops_history_http409_disposable_held.py tests/test_uniops_history_http409_overlay_source_only.py
          python3 tests/test_uniops_history_http409_overlay_source_only.py
          echo 'PASS held HTTP 409 candidate SOURCE REVIEW ONLY; NO DATABASE, SIGNED ACTOR OR RELEASE'
