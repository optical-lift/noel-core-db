name: HELD UNI-OPS owner-gated governor historical cancellation signed disposable clone
on:
  issues:
    types: [edited, reopened]
  pull_request:
    paths:
      - '.github/workflows/held-uni-ops-historical-cancellation-signed-clone.yml'
permissions:
  contents: read
  packages: read
  issues: read
concurrency:
  group: held-uniops-historical-governor-signed-only
  cancel-in-progress: false
jobs:
  source-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Validate this exact immutable test revision without DB credentials
      # before any expensive owner-triggered protected schema snapshot.
      - name: Checkout immutable U4 no-network source for CI contract
        uses: actions/checkout@v4
        with:
          ref: 075919564dc340ad86be8e969a2ad2d02ec19a15
          path: u4-source-contract
          persist-credentials: false
      - name: Verify exact U4 helper blobs and no-network unit tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C u4-source-contract rev-parse HEAD)" = 075919564dc340ad86be8e969a2ad2d02ec19a15
          test "$(git -C u4-source-contract hash-object tests/validate-uniops-option-a-u2-accepted-first-signed.py)" = 09eeee925ebfa2cb64b1dea336688ba8076ef44d
          test "$(git -C u4-source-contract hash-object tests/uniops_u2_qualified_actual_followon_held.py)" = 2e180aa2363201e75ca0d717eeeddd5a708193ab
          test "$(git -C u4-source-contract hash-object tests/test_uniops_u2_qualified_actual_followon_held.py)" = 5a9a2fe1e7f4eaa047396627baefd24a76c0398a
          python3 -m py_compile u4-source-contract/tests/validate-uniops-option-a-u2-accepted-first-signed.py u4-source-contract/tests/uniops_u2_qualified_actual_followon_held.py u4-source-contract/tests/test_uniops_u2_qualified_actual_followon_held.py
          python3 -m unittest discover -s u4-source-contract/tests -p 'test_uniops_u2_qualified_actual_followon_held.py' -v
      - name: Compile and audit exact disposable-only signed fixture and runner contract
        shell: bash
        run: |
          set -euo pipefail
          ruby -r yaml -e 'YAML.load_file(".github/workflows/held-uni-ops-historical-cancellation-signed-clone.yml")'
          python3 -m py_compile tests/validate-uniops-option-a-u2-accepted-first-signed.py tests/uniops_u2_namefree_guard_owner.py tests/test_uniops_u2_namefree_guard_owner.py tests/uniops_u2_local_stack_evidence.py tests/test_uniops_u2_local_stack_evidence.py tests/prepare_reviewed_uniops_u2c_context_scratch.py tests/test_prepare_reviewed_uniops_u2c_context_scratch.py tests/install-uniops-u2-first-original-signed-hook.py
          python3 -m unittest discover -s tests -p 'test_uniops_u2_namefree_guard_owner.py' -v
          python3 -m unittest discover -s tests -p 'test_uniops_u2_local_stack_evidence.py' -v
          python3 -m unittest discover -s tests -p 'test_prepare_reviewed_uniops_u2c_context_scratch.py' -v
          # Bind both new test-only files exactly before executing no-network matrix.
          test "$(git hash-object tests/uniops-option-a-first-mowing-signed-fixture.sql)" = a4073038eaf38ce399f4fe7d3d85ce97259ed784
          test "$(git hash-object tests/test_uniops_u4_mowing_rule_fixture_held.py)" = 3811bc84e86918ceef5c12d074d78b5e88d8a999
          python3 -m unittest discover -s tests -p 'test_uniops_u4_mowing_rule_fixture_held.py' -v
          python3 - <<'PY'
          from pathlib import Path
          workflow=Path(".github/workflows/held-uni-ops-historical-cancellation-signed-clone.yml").read_text()
          p=Path("tests/validate-uniops-option-a-u2-accepted-first-signed.py").read_text()
          fixture=Path("tests/uniops-option-a-first-mowing-signed-fixture.sql").read_text()
          hook=Path("tests/install-uniops-u2-first-original-signed-hook.py").read_text()
          protected=workflow.split("  validate-protected:\n",1)[1]
          assert protected.count("github.actor == github.repository_owner")==1
          assert "github.event.issue.title == 'UNI-OPS historical governor cancellation protected signed gate'" in workflow
          assert "source_choice':'a_full_current_completion_plus_history'" in workflow
          assert "signed_contract':'u1b_u2_mowing_accepted_first_v1'" in workflow
          assert "NOEL_CORE_DATABASE_URL" in workflow and "supabase db dump" in workflow
          assert not any(needle in protected for needle in ("supabase db push","apply_migration","CREATE ROLE "))
          for tok in ("c1.sign_in", "auth.sessions", "governor_set_subject_disclosure_self_api_v1",
                      "propose_native_ledger_standing_scope_owner_self_api_v1",
                      "respond_native_ledger_standing_scope_self_api_v1",
                      "adopt_governed_farm_rulebook_scope_self_api_v1",
                      "offer_next_governed_prework_candidate_self_api_v1",
                      "respond_governed_prework_candidate_self_api_v1",
                      "finalize_accepted_governed_prework_self_api_v1",
                      "originalWorkCreatedNow", "nextOriginalNotPrecreated", "U2_SOURCE_SELECTION",
                      "U2_GOVERNOR_FINALIZE_HTTP_CLASS", "U2_GOVERNOR_FINALIZE_SOURCE_GUARD",
                      "work_execution_results", "work_result_acceptances",
                      "U2_WORKER_RESPONSE_GUARD"):
              assert tok in p,tok
          assert "SET uniops.disposable_signed" in fixture
          assert "CREATE TABLE" not in fixture
          assert "INSERT INTO atlas.governed_prework_candidate_offers_v1" not in fixture
          assert "INSERT INTO atlas.work_items" not in fixture
          assert "U2_GOVERNOR_FINALIZE_SOURCE_FAMILY" in p
          assert "U2_GOVERNOR_FINALIZE_GUARD_ORDINAL" in p
          assert "U2_GOVERNOR_FINALIZE_CALL_FRAME_EVIDENCE" in p
          assert "U2_GOVERNOR_FINALIZE_CALL_SOURCE_STAGE" in p
          assert "tests/uniops_u2_namefree_guard_owner.py" in workflow
          assert "tests/test_uniops_u2_namefree_guard_owner.py" in workflow
          assert "source_review" in workflow and "u2c_context_guard_two_blobs_v1" in workflow
          assert "prepare_reviewed_uniops_u2c_context_scratch.py" in workflow
          assert "signed_accepted_first_probe" in hook
          assert "39f526cd8671f0aadbaab61c66dfc4971ef52131" in hook
          assert "U4_SIGNED_ACTUAL_RESULT_DONE=PASS" in workflow
          assert "github.event.issue.title == 'UNI-OPS historical governor cancellation protected signed gate'" in workflow
          assert "u4_test_sha" in workflow and "test_goal" in workflow
          assert 'ref: 075919564dc340ad86be8e969a2ad2d02ec19a15' in workflow
          assert "--u4-actual-followon" in workflow
          assert protected.count("NOEL_CORE_DATABASE_URL:") == 1
          assert "No production feature source SQL / permission / migration" in workflow
          print("PASS source-only true-signed U2 bounded runner/fixture contract; NOT runtime acceptance")
          PY
      - name: Prove separately gated historical owner and immutable test-only source (no secrets)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object tests/prepare_uniops_historical_retirement_signed_followon_held.py)" = 6ff245eb3c2c3ce007b0a0a59e1d382d7ae0d519
          test "$(git hash-object tests/uniops_historical_retirement_signed_bridge_held.py)" = f1a4eadb4d0199e8b4d9c1f17738675c281e249d
          python3 -m unittest discover -s tests -p 'test_prepare_uniops_historical_retirement_signed_followon_held.py' -v
          python3 -m unittest discover -s tests -p 'test_uniops_historical_retirement_signed_bridge_held.py' -v
          python3 - <<'PY'
          from pathlib import Path
          src=Path(".github/workflows/held-uni-ops-historical-cancellation-signed-clone.yml").read_text()
          protected=src.split("  validate-protected:\n",1)[1]
          assert protected.count("github.actor == github.repository_owner")==1
          assert "github.event.issue.number == 2664" in protected
          assert "contains(github.event.issue.body, 'run_authorization: owner_approved_history_one_run_v1')" in protected
          assert "'run_authorization':'owner_approved_history_one_run_v1'" in protected
          assert "'history_source_sha':'ddfb0bf5374798301fe076a61d2b944dfb52ff63'" in protected
          assert "grep -q '^UNI_OPS_SIGNED_HISTORY_CANCEL=PASS$'" in protected
          assert "NOEL_CORE_DATABASE_URL:" in protected
          assert not any(b in protected for b in ("supabase db push","apply_migration","supabase migration up"))
          print("PASS source-only signed historical owner issue guard; protected test NOT RUN")
          PY
  validate-protected:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.state == 'open' &&
      github.event.issue.author_association == 'OWNER' &&
      github.actor == github.repository_owner &&
      github.event.issue.title == 'UNI-OPS historical governor cancellation protected signed gate' &&
      github.event.issue.number == 2664 &&
      contains(github.event.issue.body, 'run_authorization: owner_approved_history_one_run_v1')
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 55
    steps:
      - name: Authorize exact held test scope, never release
        shell: bash
        env:
          OWNER_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          pairs={}
          expected={
              'diagnostic_scope':'uni_ops_a_history_signed_disposable_v1',
              'source_choice':'a_full_current_completion_plus_history',
              'signed_contract':'u1b_u2_mowing_accepted_first_v1',
              'source_review':'u2c_context_guard_two_blobs_v1',
              'production_target':'zirqkouammpwxlqfbsvf',
              'harness_head':'5d28e2584736b8dd9cab928a34a6d5dc39ba38c1',
              'u4_test_sha':'075919564dc340ad86be8e969a2ad2d02ec19a15',
              'test_goal':'signed_u2_result_done_v1',
              'history_source_sha':'ddfb0bf5374798301fe076a61d2b944dfb52ff63',
              'history_goal':'signed_governor_historical_cancel_v1',
              'run_authorization':'owner_approved_history_one_run_v1'}
          for line in os.environ.get('OWNER_BODY','').splitlines():
              match=re.fullmatch(r'([a-z0-9_]+):\s*([a-z0-9_]+)\s*',line)
              if match and match[1] in expected:
                  if match[1] in pairs:raise SystemExit("Duplicate owner source selector")
                  pairs[match[1]]=match[2]
          if pairs!=expected:raise SystemExit("Unrecognized immutable owner test selection")
          print("PASS owner separately authorized U4 and governor historical cancellation in disposable clone only")
          PY
      - name: Checkout existing main custody and zero-cost signed schema clone harness
        uses: actions/checkout@v4
        with:
          ref: main
          path: canonical
          persist-credentials: false
      - name: Verify trusted Noel migration custody
        shell: bash
        working-directory: canonical
        run: |
          set -euo pipefail
          bash scripts/check-custody.sh
          bash scripts/check-production-release-contract.sh
          bash scripts/check-production-schema-validation-contract.sh
          bash -n scripts/validate-production-schema-clone.sh
          python3 - <<'PY'
          import json
          d=json.load(open('custody/production-baseline-v1.json'))
          assert d['inheritedHistory']['migrationCount']==2022
          assert d['inheritedHistory']['throughVersion']=='20260825203448'
          print("PASS frozen inherited migration baseline; no history replays")
          PY
      - name: Install SHA256-pinned existing Supabase CLI 2.116.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/supabase-2.116.0.tar.gz"
          curl -fLsS --proto '=https' --tlsv1.2 --max-time 240 \
            https://github.com/supabase/cli/releases/download/v2.116.0/supabase_2.116.0_linux_amd64.tar.gz \
            -o "$archive"
          echo "5b3031cb297d51b25be4c284e4c852254460ec722ec221d3b81b07d55acfd158  $archive" | sha256sum -c --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" supabase
          sudo install -m 0755 "$RUNNER_TEMP/supabase" /usr/local/bin/supabase
          test "$(supabase --version | tail -1)" = 2.116.0
          command -v psql
          docker info >/dev/null
      - name: Authorize read-only GHCR image pulls
        shell: bash
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin >/dev/null
      - name: READ-ONLY snapshot exact production schema and roles, no data
        shell: bash
        env:
          NOEL_CORE_DATABASE_URL: ${{ secrets.NOEL_CORE_DATABASE_URL }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$NOEL_CORE_DATABASE_URL" || {
            echo 'BLOCKED existing protected read-only schema credential unavailable'
            exit 1
          }
          supabase db dump --db-url "$NOEL_CORE_DATABASE_URL" \
            --role-only --file "$RUNNER_TEMP/uniops-snapshot-roles.sql" >/dev/null
          supabase db dump --db-url "$NOEL_CORE_DATABASE_URL" \
            --file "$RUNNER_TEMP/uniops-snapshot-schema.sql" >/dev/null
          test -s "$RUNNER_TEMP/uniops-snapshot-roles.sql"
          test -s "$RUNNER_TEMP/uniops-snapshot-schema.sql"
          echo 'PASS existing production schema-only read; no table rows or mutations'
      - name: Pin six separate held revisions and one exact Noel assembler
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          pin_root="$(mktemp -d "$RUNNER_TEMP/uniops-full-clone.XXXXXXXX")"
          echo "UNI_OPS_PIN_ROOT=$pin_root" >> "$GITHUB_ENV"
          # One independent shallow repository per immutable source commit.
          # Sharing .git/shallow across sequential fetches can fail with
          # "shallow file has changed since we read it" (run #42445200175).
          # No widening of source pins, network credentials or feature code.
          while read -r label sha; do
            test -n "$label" && [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            [[ "$label" =~ ^(lifecycle|r02|u1a|u1b|u2|u2c|u2c_review|harness|c1fixture)$ ]]
            root="$pin_root/$label"
            test ! -e "$root"
            git init -q "$root"
            git -C "$root" remote add origin https://github.com/optical-lift/noel-core-db.git
            git -C "$root" -c credential.helper= fetch -q --depth=1 --no-tags origin "$sha"
            test "$(git -C "$root" rev-parse FETCH_HEAD)" = "$sha"
            git -C "$root" -c advice.detachedHead=false checkout --quiet --detach "$sha"
            test "$(git -C "$root" rev-parse HEAD)" = "$sha"
          done <<'PINNED'
          lifecycle ddfb0bf5374798301fe076a61d2b944dfb52ff63
          r02 d48cd444fd261fd5f8c91655b789e50730c1b9f7
          u1a f9c372d3487ea6af4d29a4ee3b22579b9d94c5ae
          u1b 18be5996faaa0f7a0def1d07c262f53b39e73605
          u2 2be045d7fa51b83416a57c76b1a5508e815b8445
          u2c 1fd28856ff8d3fd99997fc0ae1fcf8714407a407
          u2c_review aa117383d693d33dbfe12bdc46fd6c7ae64a7911
          harness 5d28e2584736b8dd9cab928a34a6d5dc39ba38c1
          c1fixture 9af4ab9b203877f048af09e23bac58bf86cd58fe
          PINNED
          path="candidates/atlas_uni_ops_c_u2c_single_rulebook_cutover_v1/tests/prepare_pinned_accepted_first_scratch.py"
          test "$(git -C "$pin_root/harness" hash-object "$path")" = f3a2de3a345d63cb51feba6f848ccb9a4ab74bb0
          test "$(git -C canonical hash-object scripts/prepare-uni-ops-a-full-history-clone-only.py)" = 286a5ca2a3f779053da88d8ec7a77d32c8eedc6e
          test "$(git -C "$pin_root/u2c_review" hash-object candidates/atlas_uni_ops_c_u2c_single_rulebook_cutover_v1/02_native_original_writer_acceptance_guard_held.sql)" = e07cacd0c5035f05a4017de651cd615a97b2f0f6
          test "$(git -C "$pin_root/u2c_review" hash-object candidates/atlas_uni_ops_c_u2c_single_rulebook_cutover_v1/04_postconditions_held.sql)" = 6ac485dc5d11038d8d0d8df5536174791418f046
          test "$(git -C canonical hash-object tests/prepare_reviewed_uniops_u2c_context_scratch.py)" = 928182c76ab70b8d8a8fab9d685838c4593487ab
          python3 -m py_compile canonical/scripts/prepare-uni-ops-a-full-history-clone-only.py canonical/tests/prepare_reviewed_uniops_u2c_context_scratch.py
          test "$(git -C "$pin_root/c1fixture" hash-object validation/fixtures/20261028235811_atlas_care_single_done_signed_proof_v1.sql)" = e877d93323ddc67d8778be8bea1dfa34319cc85c
          echo 'PASS exact pinned source revisions, fictional C1 baseline and option A test-only assembler'
      - name: Assemble exactly 18 original-and-historical SQL stages, scratch only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          script="canonical/scripts/prepare-uni-ops-a-full-history-clone-only.py"
          scratch="$RUNNER_TEMP/UNI_OPS_A_FULL_HISTORY_${GITHUB_RUN_ID}_TEST_ONLY.sql"
          python3 "$script" \
            --harness "$UNI_OPS_PIN_ROOT/harness" \
            --lifecycle "$UNI_OPS_PIN_ROOT/lifecycle" \
            --r02 "$UNI_OPS_PIN_ROOT/r02" \
            --u1a "$UNI_OPS_PIN_ROOT/u1a" \
            --u1b "$UNI_OPS_PIN_ROOT/u1b" \
            --u2 "$UNI_OPS_PIN_ROOT/u2" \
            --u2c "$UNI_OPS_PIN_ROOT/u2c" \
            --output "$scratch" > "$RUNNER_TEMP/uniops-manifest.json"
          python3 - "$RUNNER_TEMP/uniops-manifest.json" "$scratch" <<'PY'
          import hashlib,json,sys
          d=json.load(open(sys.argv[1]))
          assert d['kind']=='UNI_OPS_A_FULL_HISTORY_DISPOSABLE_ONLY' and d['success'] is True
          assert d['stage_count']==18 and len(d['stages'])==18
          assert len({x['stage'] for x in d['stages']})==18
          assert sum(x['stage'].startswith('history-') for x in d['stages'])==7
          assert all(x['ref'] and x['blob'] and x['sha256'] for x in d['stages'])
          assert hashlib.sha256(open(sys.argv[2],'rb').read()).hexdigest()==d['scratch_file_sha256']
          print('PASS 11 immutable originals plus seven exact historical #2368 sources; disposable only')
          PY
          # The exact old 18-stage source stays immutable. Produce an
          # independent scratch copy with ONLY the two reviewed U2C source
          # blobs. Neither protected production schema nor source checkout
          # is changed; all source receipts remain byte-bound in the manifest.
          reviewed="$RUNNER_TEMP/UNI_OPS_U2C_CONTEXT_${GITHUB_RUN_ID}_TEST_ONLY.sql"
          python3 canonical/tests/prepare_reviewed_uniops_u2c_context_scratch.py \
            --original "$scratch" \
            --original-manifest "$RUNNER_TEMP/uniops-manifest.json" \
            --review-checkout "$UNI_OPS_PIN_ROOT/u2c_review" \
            --output "$reviewed" \
            --output-manifest "$RUNNER_TEMP/uniops-u2c-review-manifest.json"
          python3 - "$RUNNER_TEMP/uniops-manifest.json" "$RUNNER_TEMP/uniops-u2c-review-manifest.json" "$reviewed" <<'PY'
          import hashlib,json,sys
          baseline=json.load(open(sys.argv[1]))
          amended=json.load(open(sys.argv[2]))
          assert amended['kind']=='UNI_OPS_U2C_CONTEXT_REVIEW_DISPOSABLE_ONLY'
          assert amended['stage_count']==18 and len(amended['stages'])==18
          changed=[(old,new) for old,new in zip(baseline['stages'],amended['stages'])
                   if old!=new]
          assert len(changed)==2
          assert {new['stage'] for _,new in changed}=={
            'u2c-accepted-only-original-guard','u2c-schema-and-acl-postconditions'}
          assert all(old['checkout']=='u2c' and new['checkout']=='u2c_review'
                     for old,new in changed)
          assert all(old['stage']==new['stage']
                     for old,new in zip(baseline['stages'],amended['stages']))
          assert sum(x['stage'].startswith('history-') for x in amended['stages'])==7
          assert hashlib.sha256(open(sys.argv[3],'rb').read()).hexdigest()==amended['scratch_file_sha256']
          print('PASS 16 frozen source stages and exactly two independently pinned U2C context-review stages; scratch only')
          PY
          # Keep the exact 18 native/history stages unchanged in the reviewed manifest.
          # Add one separately pinned public SIGNED transport only to the disposable
          # local migration after the 18-stage source hash has been verified.
          # This source is ALREADY tracked in the same immutable R02 checkout.
          transport="$UNI_OPS_PIN_ROOT/r02/candidates/atlas_universal_continuing_original_work_v1/12_care_signed_http_rpc_candidate.sql"
          test "$(git -C "$UNI_OPS_PIN_ROOT/r02" hash-object candidates/atlas_universal_continuing_original_work_v1/12_care_signed_http_rpc_candidate.sql)" = 3e09b66e54c15e100110c2b50f43dc9c7593e51a
          python3 - "$reviewed" "$RUNNER_TEMP/uniops-u2c-review-manifest.json" "$transport" \
            "$RUNNER_TEMP/20261107211000_atlas_uni_ops_a_history_DISPOSABLE_ONLY.sql" <<'PY'
          import hashlib,json,pathlib,sys
          reviewed,manifest_path,source_path,out=(pathlib.Path(p) for p in sys.argv[1:])
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          before=reviewed.read_bytes()
          assert manifest['kind']=='UNI_OPS_U2C_CONTEXT_REVIEW_DISPOSABLE_ONLY'
          assert manifest['stage_count']==18 and len(manifest['stages'])==18
          assert hashlib.sha256(before).hexdigest()==manifest['scratch_file_sha256']
          assert before.count(b'-- BEGIN PINNED STAGE ')==18
          assert before.count(b'-- END PINNED STAGE ')==18
          assert b'public.record_continuing_care_actual_self_api_v1' not in before
          assert out.parent==pathlib.Path(__import__('os').environ['RUNNER_TEMP'])
          assert out.name=='20261107211000_atlas_uni_ops_a_history_DISPOSABLE_ONLY.sql'
          assert not out.exists() and not out.is_symlink()
          source=source_path.read_bytes()
          blob=hashlib.sha1(b'blob '+str(len(source)).encode()+b'\0'+source).hexdigest()
          assert blob=='3e09b66e54c15e100110c2b50f43dc9c7593e51a'
          for invariant in (
              b'CREATE OR REPLACE FUNCTION public.record_continuing_care_actual_self_api_v1(',
              b'SECURITY DEFINER SET search_path TO',
              b'IF auth.uid() IS NULL OR atlas.current_person_id_v1() IS NULL',
              b'RETURN atlas.record_continuing_care_actual_self_api_v1(',
              b'FROM PUBLIC,anon,authenticated,service_role;',
              b'TO authenticated;',
              b"pg_notify('pgrst','reload schema')",
              b'REVOKE ALL ON FUNCTION atlas.record_continuing_care_actual_self_api_v1(',
          ):
              assert invariant in source, 'Missing guarded source bridge invariant'
          signature='public.record_continuing_care_actual_self_api_v1(uuid,uuid,text,text,integer,text,date)'
          preflight=(
              '\nDO $u4_public_preflight$ BEGIN\n'
              " IF to_regprocedure('"+signature+"') IS NOT NULL THEN\n"
              "  RAISE EXCEPTION 'Preexisting public care Actual source requires separate review';\n"
              ' END IF;\nEND;$u4_public_preflight$;\n'
          ).encode()
          post=(
              '\nDO $u4_public_postconditions$ BEGIN\n'
              " IF to_regprocedure('"+signature+"') IS NULL\n"
              " OR NOT has_function_privilege('authenticated',to_regprocedure('"+signature+"'),'EXECUTE')\n"
              " OR has_function_privilege('anon',to_regprocedure('"+signature+"'),'EXECUTE')\n"
