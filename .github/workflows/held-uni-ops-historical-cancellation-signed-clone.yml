              print('UNI_OPS_SIGNED_U2_SUBPHASE='+subphase)
              print('UNI_OPS_SIGNED_U2_SOURCE_SELECTION='+selection)
              print('UNI_OPS_SIGNED_U2_WORKER_SOURCE_PREFLIGHT='+preflight)
              print('UNI_OPS_SIGNED_U2_WORKER_ACCEPT_HTTP_CLASS='+http_class)
              print('UNI_OPS_SIGNED_U2_WORKER_ACCEPT_ERROR_CLASS='+accept_class)
              print('UNI_OPS_SIGNED_U2_WORKER_IDENTITY_FIXTURE='+identity_check)
              print('UNI_OPS_SIGNED_U2_WORKER_INBOX_RESULT='+inbox_result)
              print('UNI_OPS_SIGNED_U2_WORKER_INBOX_HTTP_CLASS='+inbox_http_class)
              print('UNI_OPS_SIGNED_U2_WORKER_INBOX_ERROR_CLASS='+inbox_error_class)
              print('UNI_OPS_SIGNED_U2_WORKER_RESPONSE_GUARD='+worker_guard)
              print('UNI_OPS_SIGNED_U2_GOVERNOR_FINALIZE_HTTP_CLASS='+final_http)
              print('UNI_OPS_SIGNED_U2_GOVERNOR_FINALIZE_ERROR_CLASS='+final_error)
              print('UNI_OPS_SIGNED_U2_GOVERNOR_FINALIZE_SOURCE_GUARD='+final_guard)
              print('UNI_OPS_SIGNED_U2_GOVERNOR_FINALIZE_SOURCE_FAMILY='+final_family)
              print('UNI_OPS_SIGNED_U2_GOVERNOR_FINALIZE_GUARD_ORDINAL='+final_ordinal)
              print('UNI_OPS_SIGNED_U2_GOVERNOR_FINALIZE_CALL_FRAME_EVIDENCE='+call_frame)
              print('UNI_OPS_SIGNED_U2_GOVERNOR_FINALIZE_CALL_SOURCE_STAGE='+call_stage)
              print('UNI_OPS_SIGNED_U2_PASS_CHECKPOINTS='+str(checks))
              print('UNI_OPS_SIGNED_U2_FAILURE_CLASS='+failure_class)
              print('UNI_OPS_U4_SIGNED_PROBE_ENTERED='+u4_probe)
              print('UNI_OPS_U4_SIGNED_FAILURE_GATE='+u4_gate)
              print('UNI_OPS_U4_ACTUAL_HTTP_CLASS='+u4_http)
              print('UNI_OPS_U4_ACTUAL_ERROR_CLASS='+u4_error)
              print('UNI_OPS_U4_ACTUAL_RECEIPT_FIELD='+u4_receipt)
          # Report only fixed aggregate categories; private function names,
          # SQL, identity, relation names and raw lint messages stay local.
          delta=root/'schema-lint-delta.json'
          if not delta.is_file():
              print('UNI_OPS_LINT_DELTA_STATUS=report_absent')
          else:
              try:
                  payload=json.loads(delta.read_text(errors='replace'))
                  findings=payload['introduced']
                  count=payload['introduced_count']
                  if not isinstance(findings,list) or not isinstance(count,int) or count!=len(findings):
                      raise ValueError('invalid counts')
                  groups={}
                  classes={'42883':'missing_function','42703':'missing_column',
                           '42P01':'missing_relation','3F000':'missing_schema',
                           '42601':'syntax','42501':'privilege','42702':'ambiguous_column',
                           '23514':'check_constraint'}
                  for entry in findings:
                      issue=entry.get('issue',{}) if isinstance(entry,dict) else {}
                      code=str(issue.get('sqlState','')) if isinstance(issue,dict) else ''
                      label=classes.get(code,'other_or_unspecified')
                      groups[label]=groups.get(label,0)+1
                  # Resolve a lint function to a public pinned-source ordinal only.
                  # The original private function name and SQL remain unprinted.
                  allowed_stages=set(('lifecycle-shadow','lifecycle-single-transition',
                      'history-record-and-rls','history-governor-readback',
                      'history-review-postconditions','history-public-transport',
                      'history-retirement-bridge','history-retirement-preflight',
                      'history-retirement-postconditions',
                      'r01-r02-composed-native','u1a-exact-foundry-rulebook',
                      'u1b-native-scope-history','u2a-preoriginal-offer',
                      'u2b-signed-root-finalize','u2c-single-authority-arbiter',
                      'u2c-accepted-only-original-guard',
                      'u2c-close-old-standing-bypasses',
                      'u2c-schema-and-acl-postconditions'))
                  ownership={}
                  if sql.is_file():
                      current=None
                      ordinal=0
                      for line in sql.read_text(errors='replace').splitlines():
                          if line.startswith('-- BEGIN PINNED STAGE '):
                              tokens=line.split()
                              current=tokens[4] if len(tokens)==6 and tokens[4] in allowed_stages else None
                              ordinal=0
                              continue
                          if line.startswith('-- END PINNED STAGE '):
                              current=None
                              continue
                          if current:
                              match=re.search(r'(?i)\bCREATE\s+(?:OR\s+REPLACE\s+)?FUNCTION\s+([a-z_][a-z0-9_]*\.[a-z_][a-z0-9_]*)\s*\(',line)
                              if match:
                                  ordinal+=1
                                  ownership[match[1].lower()]=(current,ordinal)
                  locations=set()
                  for item in findings:
                      name=str(item.get('function','')).split('(',1)[0].strip().lower() if isinstance(item,dict) else ''
                      label,ordinal=ownership.get(name,('outside_or_unmatched',0))
                      locations.add(label+':'+str(ordinal))
                  print('UNI_OPS_LINT_SOURCE_LOCATIONS='+(','.join(sorted(locations)) if locations else 'none'))
                  print('UNI_OPS_LINT_DELTA_STATUS='+('introduced_errors' if count else 'no_new_errors'))
                  print('UNI_OPS_LINT_INTRODUCED_COUNT='+str(count))
                  print('UNI_OPS_LINT_ERROR_CLASSES='+
                        (','.join(k+':'+str(groups[k]) for k in sorted(groups)) if groups else 'none'))
              except (OSError,ValueError,KeyError,TypeError,AttributeError):
                  print('UNI_OPS_LINT_DELTA_STATUS=unreadable_report')
          signed=root/'uniops-u2-signed-summary.txt'
          print('UNI_OPS_SIGNED_U2_ACCEPTED_FIRST='+('PASS' if signed.is_file() and signed.read_text(errors='replace').startswith('PASS genuine separate signed local') else 'NOT_VERIFIED'))
          u4_mark='NOT_VERIFIED'
          if signed.is_file():
              if 'U4_SIGNED_ACTUAL_RESULT_DONE=PASS' in signed.read_text(encoding='utf-8',errors='replace').splitlines():
                  u4_mark='PASS'
          print('UNI_OPS_U4_SIGNED_ACTUAL_RESULT_DONE='+u4_mark)
          history_mark='NOT_VERIFIED'
          if signed.is_file() and u4_mark=='PASS':
              labels=[line for line in signed.read_text(encoding='utf-8',errors='replace').splitlines()
                      if line=='UNI_OPS_SIGNED_HISTORY_CANCEL=PASS']
              if len(labels)==1: history_mark='PASS'
          print('UNI_OPS_SIGNED_HISTORY_CANCEL='+history_mark)
          print('UNI_OPS_SIGNED_FULL_U1A_OVERLAP=NOT_RUN')
          print('UNI_OPS_SIGNED_POST_RESULT_6A=NOT_RUN')
          print('UNI_OPS_PRODUCTION_MUTATION=NONE')
          print('UNI_OPS_PAID_BRANCH=NONE')
          PY
      - name: Delete private test-only schema, role snapshot, source and logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- "$RUNNER_TEMP/uniops-snapshot-schema.sql" "$RUNNER_TEMP/uniops-snapshot-roles.sql"
          rm -f -- "$RUNNER_TEMP/uniops-private-clone.log" "$RUNNER_TEMP/uniops-manifest.json"
          rm -f -- "$RUNNER_TEMP/validate-uniops-historical-signed-local-only.py"
          rm -f -- "$RUNNER_TEMP/20261107211000_atlas_uni_ops_a_history_DISPOSABLE_ONLY.sql"
          rm -f -- "$RUNNER_TEMP/UNI_OPS_A_FULL_HISTORY_${GITHUB_RUN_ID}_TEST_ONLY.sql"
          case "${UNI_OPS_PIN_ROOT:-}" in
            "$RUNNER_TEMP"/uniops-full-clone.*) rm -rf -- "$UNI_OPS_PIN_ROOT" ;;
          esac
          if [[ -d "$RUNNER_TEMP/uniops-private-diagnostics" && ! -L "$RUNNER_TEMP/uniops-private-diagnostics" ]]; then
            rm -rf -- "$RUNNER_TEMP/uniops-private-diagnostics"
          fi
          echo 'PASS no schema dump, role dump or diagnostic artifact retained/uploaded'
