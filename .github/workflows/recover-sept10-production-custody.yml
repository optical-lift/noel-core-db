name: Recover Sept 10 Production Custody Source

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/recover-sept10-production-custody.yml

permissions:
  contents: write

concurrency:
  group: recover-sept10-production-custody-source
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: production
    env:
      NOEL_CORE_DATABASE_URL: ${{ secrets.NOEL_CORE_DATABASE_URL }}
      REPAIR_BRANCH: custody-repair-sept10-production-source-v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Confirm read-only recovery prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NOEL_CORE_DATABASE_URL:-}" || { echo "::error::NOEL_CORE_DATABASE_URL is missing"; exit 1; }
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          command -v xxd >/dev/null 2>&1 || { echo "::error::xxd is required"; exit 1; }

      - name: Recover exact Sept 10 Atlas migration bytes
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          rows="$(mktemp)"
          trap 'rm -f "$rows"' EXIT

          psql "$NOEL_CORE_DATABASE_URL" -X -A -t -F $'\t' -v ON_ERROR_STOP=1 -c "
            with migration_rows as (
              select version,
                     name,
                     array_to_string(statements, E'\\n') as body
              from supabase_migrations.schema_migrations
              where version >= '20260910000000'
                and version <  '20260911000000'
                and name like 'atlas\\_%' escape '\\'
            )
            select version,
                   name,
                   encode(convert_to(body,'UTF8'),'hex') as body_hex,
                   encode(
                     extensions.digest(
                       convert_to('blob ' || octet_length(convert_to(body,'UTF8'))::text,'UTF8')
                       || decode('00','hex')
                       || convert_to(body,'UTF8'),
                       'sha1'
                     ),
                     'hex'
                   ) as expected_blob
            from migration_rows
            order by version;
          " > "$rows"

          test -s "$rows" || { echo "::error::No Sept. 10 Atlas production migrations were returned"; exit 1; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$REPAIR_BRANCH"

          changed=0
          checked=0
          while IFS=$'\t' read -r version name body_hex expected_blob; do
            [ -n "$version" ] || continue
            checked=$((checked+1))
            target="supabase/migrations/${version}_${name}.sql"
            tmp="$(mktemp)"
            printf '%s' "$body_hex" | xxd -r -p > "$tmp"
            actual="$(git hash-object "$tmp")"
            if [ "$actual" != "$expected_blob" ]; then
              echo "::error::Production-byte reconstruction mismatch for ${version}_${name}: expected=${expected_blob} actual=${actual}"
              rm -f "$tmp"
              exit 1
            fi
            current=""
            if [ -f "$target" ]; then current="$(git hash-object "$target")"; fi
            if [ "$current" != "$expected_blob" ]; then
              mkdir -p "$(dirname "$target")"
              cp "$tmp" "$target"
              changed=$((changed+1))
            fi
            rm -f "$tmp"
          done < "$rows"

          [ "$checked" -gt 0 ] || { echo "::error::No custody rows checked"; exit 1; }

          while IFS=$'\t' read -r version name body_hex expected_blob; do
            [ -n "$version" ] || continue
            target="supabase/migrations/${version}_${name}.sql"
            [ -f "$target" ] || { echo "::error::Recovered source missing: ${version}_${name}"; exit 1; }
            actual="$(git hash-object "$target")"
            [ "$actual" = "$expected_blob" ] || { echo "::error::Recovered blob mismatch: ${version}_${name} expected=${expected_blob} actual=${actual}"; exit 1; }
          done < "$rows"

          if [ "$changed" -eq 0 ]; then
            echo "All Sept. 10 Atlas production migration sources already match exactly; no repair branch required."
            exit 0
          fi

          git add supabase/migrations
          git commit -m "Restore exact Sept 10 Atlas production migration sources"
          git push origin "HEAD:refs/heads/${REPAIR_BRANCH}"
          echo "Recovered ${changed} of ${checked} Sept. 10 Atlas migration sources onto ${REPAIR_BRANCH}."
