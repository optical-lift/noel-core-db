name: Materialize Continuity Migration Once

on:
  push:
    branches:
      - atlas/communication-ledger-proof-v1

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proof branch
        uses: actions/checkout@v4
        with:
          ref: atlas/communication-ledger-proof-v1
          fetch-depth: 1

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Materialize canonical migration identity
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G 'supabase/migrations/*_atlas_communication_ledger_v1.sql' > /dev/null; then
            echo 'Continuity migration already materialized.'
            exit 0
          fi
          npx --yes supabase@2.116.0 migration new atlas_communication_ledger_v1
          migration_file="$(ls -1 supabase/migrations/*_atlas_communication_ledger_v1.sql)"
          cat architecture/atlas-communication-ledger-v1.sql > "$migration_file"
          echo "Materialized $migration_file"

      - name: Commit generated migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- supabase/migrations; then
            echo 'No migration change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations
          git commit -m 'Materialize Atlas Communication Ledger migration'
          git push origin HEAD:atlas/communication-ledger-proof-v1
