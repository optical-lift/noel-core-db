name: Production Schema Clone Validation

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  packages: read

concurrency:
  group: noel-core-production-schema-clone-validation
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event.issue.state == 'open' &&
      github.event.issue.author_association == 'OWNER' &&
      startsWith(github.event.issue.title, 'Production schema validation request:')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    # Use pinned Supabase CLI's image-registry fallback when a registry throttles.
    # Read-only GHCR authentication remains in the protected workflow.
    steps:
      - name: Resolve governed validation request
        id: request
        shell: bash
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REQUEST_ACTOR: ${{ github.actor }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          title = os.environ.get('ISSUE_TITLE', '')
          body = os.environ.get('ISSUE_BODY', '')
          fields = {}
          for raw in body.splitlines():
              match = re.fullmatch(r'([a-z_]+):\s*([^\s]+)\s*', raw)
              if match:
                  key, value = match.groups()
                  if key in fields and fields[key] != value:
                      raise SystemExit(f'duplicate conflicting field: {key}')
                  fields[key] = value

          # One immutable, held Shared Course working-loop package. This is
          # a disposable clone request, never a production migration identity.
          if title == 'Production schema validation request: Shared held private Course working loop':
              expected = {'diagnostic_scope':'shared_private_course_working_loop_clone_only_v1',
                          'release_lane':'shared','production_target':'zirqkouammpwxlqfbsvf',
                          'candidate_sha':'0fd98326892e9ed4cf22c15e572882fe97d3e383'}
              if fields != expected or os.environ['REQUEST_ACTOR'] != os.environ['REPO_OWNER']:
                  raise SystemExit('Exact owner-held private Course validation authorization required')
              with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
                  handle.write('migration_version=held-private-course-working-loop\nrelease_lane=shared\n')
                  handle.write('candidate_sha='+expected['candidate_sha']+'\n')
              raise SystemExit(0)

          # Exact held Household package only. This branch is a disposable
          # validation request, NOT a migration identity or release request.
          if title == 'Production schema validation request: Atlas held Household Work':
              expected = {'diagnostic_scope':'atlas_household_work_subject_pair_repair_clone_only_v1',
                          'release_lane':'atlas','production_target':'zirqkouammpwxlqfbsvf',
                          'candidate_sha':'fdbd73772b4760c9a97d743571705cfe29822a2f'}
              if fields != expected or os.environ['REQUEST_ACTOR'] != os.environ['REPO_OWNER']:
                  raise SystemExit('Exact owner-held Household validation authorization required')
              with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
                  handle.write('migration_version=held-household-work\nrelease_lane=atlas\n')
                  handle.write('candidate_sha='+expected['candidate_sha']+'\n')
              raise SystemExit(0)

          # Exact held Laundry lifecycle package only. This branch is a disposable
          # validation request, NOT a migration identity or release request.
          if title == 'Production schema validation request: Atlas held Laundry lifecycle':
              expected = {'diagnostic_scope':'atlas_household_laundry_lifecycle_clone_only_v1',
                          'release_lane':'atlas','production_target':'zirqkouammpwxlqfbsvf',
                          'candidate_sha':'d865a4e510e26fdd9a154466ad9deb0af71a243f'}
              if fields != expected or os.environ['REQUEST_ACTOR'] != os.environ['REPO_OWNER']:
                  raise SystemExit('Exact owner-held Laundry lifecycle validation authorization required')
              with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
                  handle.write('migration_version=held-laundry-lifecycle\nrelease_lane=atlas\n')
                  handle.write('candidate_sha='+expected['candidate_sha']+'\n')
              raise SystemExit(0)

          # Exact held Laundry renewal initial package only. This branch is a disposable
          # validation request, NOT a migration identity or release request.
          if title == 'Production schema validation request: Atlas held Laundry renewal initial':
              expected = {'diagnostic_scope':'atlas_household_laundry_renewal_initial_clone_only_v1',
                          'release_lane':'atlas','production_target':'zirqkouammpwxlqfbsvf',
                          'candidate_sha':'862e54018648341d1d4ddd8b55c559984b3f8f7c'}
              if fields != expected or os.environ['REQUEST_ACTOR'] != os.environ['REPO_OWNER']:
                  raise SystemExit('Exact owner-held Laundry renewal initial validation authorization required')
              with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
                  handle.write('migration_version=held-laundry-renewal-initial\nrelease_lane=atlas\n')
                  handle.write('candidate_sha='+expected['candidate_sha']+'\n')
              raise SystemExit(0)

          # Exact held clean Need renewal initial package only. This branch is a disposable
          # validation request, NOT a migration identity or release request.
          if title == 'Production schema validation request: Atlas held clean Need renewal initial':
              expected = {'diagnostic_scope':'atlas_household_need_renewal_clean_initial_clone_only_v1',
                          'release_lane':'atlas','production_target':'zirqkouammpwxlqfbsvf',
                          'candidate_sha':'b5a64691e1e5f96741bde81469f636b8356198b4'}
              if fields != expected or os.environ['REQUEST_ACTOR'] != os.environ['REPO_OWNER']:
                  raise SystemExit('Exact owner-held clean Need renewal initial validation authorization required')
              with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
                  handle.write('migration_version=held-clean-renewal-initial\nrelease_lane=atlas\n')
                  handle.write('candidate_sha='+expected['candidate_sha']+'\n')
              raise SystemExit(0)

          # Exact held Laundry renewal due package only. This branch is a disposable
          # validation request, NOT a migration identity or release request.
          if title == 'Production schema validation request: Atlas held Laundry renewal due':
              expected = {'diagnostic_scope':'atlas_household_laundry_renewal_due_clone_only_v1',
                          'release_lane':'atlas','production_target':'zirqkouammpwxlqfbsvf',
                          'candidate_sha':'e3290c01631f9d28d16fbecd3085c904eaab5a6c'}
              if fields != expected or os.environ['REQUEST_ACTOR'] != os.environ['REPO_OWNER']:
                  raise SystemExit('Exact owner-held Laundry renewal due validation authorization required')
              with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
                  handle.write('migration_version=held-laundry-renewal-due\nrelease_lane=atlas\n')
                  handle.write('candidate_sha='+expected['candidate_sha']+'\n')
              raise SystemExit(0)

          # Exact held clean Need renewal due package only. This branch is a disposable
          # validation request, NOT a migration identity or release request.
          if title == 'Production schema validation request: Atlas held clean Need renewal due':
              expected = {'diagnostic_scope':'atlas_household_need_renewal_clean_due_clone_only_v1',
                          'release_lane':'atlas','production_target':'zirqkouammpwxlqfbsvf',
                          'candidate_sha':'b5a64691e1e5f96741bde81469f636b8356198b4'}
              if fields != expected or os.environ['REQUEST_ACTOR'] != os.environ['REPO_OWNER']:
                  raise SystemExit('Exact owner-held clean Need renewal due validation authorization required')
              with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
                  handle.write('migration_version=held-clean-renewal-due\nrelease_lane=atlas\n')
                  handle.write('candidate_sha='+expected['candidate_sha']+'\n')
              raise SystemExit(0)

          # Exact held private listening artifact lineage, no release identity.
          if title == 'Production schema validation request: Shared held listening artifact':
              expected = {'diagnostic_scope':'shared_listening_delivery_artifact_clone_only_v1',
                          'release_lane':'shared','production_target':'zirqkouammpwxlqfbsvf',
                          'candidate_sha':'77e7b87f0f1889622da2199cd10b3980367058e6'}
              if fields != expected or os.environ['REQUEST_ACTOR'] != os.environ['REPO_OWNER']:
                  raise SystemExit('Exact owner-held listening artifact validation authorization required')
              with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
                  handle.write('migration_version=held-listening-artifact\nrelease_lane=shared\n')
                  handle.write('candidate_sha='+expected['candidate_sha']+'\n')
              raise SystemExit(0)

          # Exact owner-reviewed generated listening staging proof only.
          if title == 'Production schema validation request: Shared held generated listening storage':
              expected = {'diagnostic_scope':'shared_generated_listening_storage_signed_clone_only_v1',
                          'release_lane':'shared','production_target':'zirqkouammpwxlqfbsvf',
                          'candidate_sha':'ae885ef9f2b9779b2c64584e0e72e68cb5db7662'}
              if fields != expected or os.environ['REQUEST_ACTOR'] != os.environ['REPO_OWNER']:
                  raise SystemExit('Exact owner-held generated listening validation authorization required')
              with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
                  handle.write('migration_version=held-generated-listening-storage\nrelease_lane=shared\n')
                  handle.write('candidate_sha='+expected['candidate_sha']+'\n')
              raise SystemExit(0)

          # Exact held compact composer; no release identity.
          if title == 'Production schema validation request: Atlas held compact composer':
              expected = {'diagnostic_scope':'atlas_compact_composer_creation_clone_only_v1',
                          'release_lane':'atlas','production_target':'zirqkouammpwxlqfbsvf',
                          'candidate_sha':'9987e46ecba21430bd70116a8d0a82074d5ebd7b'}
              if fields != expected or os.environ['REQUEST_ACTOR'] != os.environ['REPO_OWNER']:
                  raise SystemExit('Exact owner-held compact composer validation authorization required')
              with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
                  handle.write('migration_version=held-compact-composer-creation\nrelease_lane=atlas\n')
                  handle.write('candidate_sha='+expected['candidate_sha']+'\n')
              raise SystemExit(0)

          # Exact held optional date; no release identity.
          if title == 'Production schema validation request: Atlas held optional date':
              expected = {'diagnostic_scope':'atlas_personal_optional_date_clone_only_v1',
                          'release_lane':'atlas','production_target':'zirqkouammpwxlqfbsvf',
                          'candidate_sha':'70424420bfac82959755c8d8914a4794554e61cb'}
              if fields != expected or os.environ['REQUEST_ACTOR'] != os.environ['REPO_OWNER']:
                  raise SystemExit('Exact owner-held optional date validation authorization required')
              with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
                  handle.write('migration_version=held-personal-optional-date\nrelease_lane=atlas\n')
                  handle.write('candidate_sha='+expected['candidate_sha']+'\n')
              raise SystemExit(0)

          # Exact held initial details; no release identity.
          if title == 'Production schema validation request: Atlas held initial details':
              expected = {'diagnostic_scope':'atlas_task_initial_details_clone_only_v1',
                          'release_lane':'atlas','production_target':'zirqkouammpwxlqfbsvf',
                          'candidate_sha':'563e24c5b9b42094d8f94a599c6d46de53e566d4'}
              if fields != expected or os.environ['REQUEST_ACTOR'] != os.environ['REPO_OWNER']:
                  raise SystemExit('Exact owner-held initial details validation authorization required')
              with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
                  handle.write('migration_version=held-task-initial-details\nrelease_lane=atlas\n')
                  handle.write('candidate_sha='+expected['candidate_sha']+'\n')
              raise SystemExit(0)

          # Exact 2026 unfinished retirement; owner-only disposable clone, no release.
          if title == 'Production schema validation request: Atlas held obsolete 2026 unfinished retirement':
              expected = {'diagnostic_scope':'atlas_obsolete_2026_unfinished_retirement_clone_only_v1',
                          'release_lane':'atlas','production_target':'zirqkouammpwxlqfbsvf',
                          'candidate_sha':'63177eba4deeca018ebe0f0140d63924826f538f'}
              if fields != expected or os.environ['REQUEST_ACTOR'] != os.environ['REPO_OWNER']:
                  raise SystemExit('Exact owner-held obsolete 2026 unfinished retirement proof required')
              with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
                  handle.write('migration_version=held-obsolete-unfinished-retirement\nrelease_lane=atlas\n')
                  handle.write('candidate_sha='+expected['candidate_sha']+'\n')
              raise SystemExit(0)

          # Five existing live Work/worker-day consumers, exact held source only.
          if title == 'Production schema validation request: Atlas held five live queue consumer decoupling':
              expected = {'diagnostic_scope':'atlas_legacy_queue_live_consumer_decoupling_clone_only_v1',
                          'release_lane':'atlas','production_target':'zirqkouammpwxlqfbsvf',
                          'candidate_sha':'eeded0cd1d3d26977c2f499af5288b59858195d2'}
              if fields != expected or os.environ['REQUEST_ACTOR'] != os.environ['REPO_OWNER']:
                  raise SystemExit('Exact owner-held five live queue consumer validation authorization required')
              with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
                  handle.write('migration_version=held-queue-consumer-decoupling\nrelease_lane=atlas\n')
                  handle.write('candidate_sha='+expected['candidate_sha']+'\n')
              raise SystemExit(0)

          # One immutable held queue-progression retirement, disposable clone only.
          # It does not authorize harvest cutover or physical queue/table removal.
          if title == 'Production schema validation request: Atlas held queue progression trigger retirement':
              expected = {'diagnostic_scope':'atlas_historical_queue_progression_trigger_retirement_clone_only_v1',
                          'release_lane':'atlas','production_target':'zirqkouammpwxlqfbsvf',
                          'candidate_sha':'849fb0eb5123545ddc10fb67e4c0bd9efe798c0e'}
              if fields != expected or os.environ['REQUEST_ACTOR'] != os.environ['REPO_OWNER']:
                  raise SystemExit('Exact owner-held progression trigger retirement validation authorization required')
              with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
                  handle.write('migration_version=held-queue-progression-retirement\nrelease_lane=atlas\n')
                  handle.write('candidate_sha='+expected['candidate_sha']+'\n')
              raise SystemExit(0)

          # Exact one-function retirement, local disposable proof only.
          if title == 'Production schema validation request: Atlas held orphan queue backfill retirement':
              expected = {'diagnostic_scope':'atlas_legacy_queue_orphan_backfill_retirement_clone_only_v1',
                          'release_lane':'atlas','production_target':'zirqkouammpwxlqfbsvf',
                          'candidate_sha':'833cbd7dbe2674fb747bc055878344b94be12c2b'}
              if fields != expected or os.environ['REQUEST_ACTOR'] != os.environ['REPO_OWNER']:
                  raise SystemExit('Exact owner-held orphan backfill validation authorization required')
              with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
                  handle.write('migration_version=held-orphan-queue-backfill-retirement\nrelease_lane=atlas\n')
                  handle.write('candidate_sha='+expected['candidate_sha']+'\n')
              raise SystemExit(0)

          required = ('migration_version', 'release_lane', 'production_target', 'candidate_sha')
          missing = [key for key in required if key not in fields]
          if missing:
              raise SystemExit('missing required validation field(s): ' + ', '.join(missing))

          version = fields['migration_version']
          lane = fields['release_lane']
          target = fields['production_target']
          candidate_sha = fields['candidate_sha'].lower()

          if not re.fullmatch(r'\d{14}', version):
              raise SystemExit('migration_version must be exactly 14 digits')
          if lane not in {'atlas', 'wnph', 'titus', 'noel', 'shared'}:
              raise SystemExit('release_lane must be atlas, wnph, titus, noel, or shared')
          if target != 'zirqkouammpwxlqfbsvf':
              raise SystemExit('production_target does not match noel-core production')
          if not re.fullmatch(r'[0-9a-f]{40}', candidate_sha):
              raise SystemExit('candidate_sha must be an immutable 40-character commit SHA')

          title_lane = {'atlas': 'Atlas', 'wnph': 'WNPH', 'titus': 'Titus', 'noel': 'Noel', 'shared': 'Shared'}[lane]
          expected_title = f'Production schema validation request: {title_lane} {version}'
          if title != expected_title:
              raise SystemExit(f'issue title must be exactly: {expected_title}')

          output = Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a', encoding='utf-8') as handle:
              handle.write(f'migration_version={version}\n')
              handle.write(f'release_lane={lane}\n')
              handle.write(f'candidate_sha={candidate_sha}\n')
          PY

      - name: Checkout canonical main validator
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Verify custody and schema-validation contracts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-custody.sh
          bash scripts/check-production-release-contract.sh
          bash scripts/check-production-schema-validation-contract.sh

      - name: Install pinned Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/supabase/cli/releases/download/v2.116.0/supabase_linux_amd64.tar.gz -o /tmp/supabase.tgz
          tar -xzf /tmp/supabase.tgz -C /tmp supabase
          sudo install -m 0755 /tmp/supabase /usr/local/bin/supabase
          supabase --version
          supabase db dump --help >/dev/null
          supabase db start --help >/dev/null
          supabase db lint --help >/dev/null

      - name: Authenticate read-only GHCR image pulls
        shell: bash
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$GHCR_TOKEN"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin

      - name: Snapshot production user schemas read-only
        shell: bash
        env:
          NOEL_CORE_DATABASE_URL: ${{ secrets.NOEL_CORE_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${NOEL_CORE_DATABASE_URL:-}" ]]; then
            echo '::error::The protected production environment is missing NOEL_CORE_DATABASE_URL.'
            exit 1
          fi
          supabase db dump \
            --db-url "$NOEL_CORE_DATABASE_URL" \
            --role-only \
            --file "$RUNNER_TEMP/production-custom-roles.sql"
          supabase db dump \
            --db-url "$NOEL_CORE_DATABASE_URL" \
            --file "$RUNNER_TEMP/production-user-schema.sql"
          test -s "$RUNNER_TEMP/production-custom-roles.sql"
          test -s "$RUNNER_TEMP/production-user-schema.sql"
          sha256sum "$RUNNER_TEMP/production-custom-roles.sql"
          sha256sum "$RUNNER_TEMP/production-user-schema.sql"

      - name: Checkout immutable candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.candidate_sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve exact candidate migration package
        id: migration
        shell: bash
        env:
          MIGRATION_VERSION: ${{ steps.request.outputs.migration_version }}
          RELEASE_LANE: ${{ steps.request.outputs.release_lane }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_LANE" == "shared" && "$MIGRATION_VERSION" == "held-private-course-working-loop" ]]; then
            test "$(git -C candidate rev-parse HEAD)" = "0fd98326892e9ed4cf22c15e572882fe97d3e383"
            src="candidate/candidates/shared-private-course-working-loop-validation-v1/combined_candidate.sql"
            test "$(git hash-object "$src")" = 33aa73e850a22eeecabcb456dc67523c7d351370
            test "$(git hash-object scripts/private-course-working-loop-postconditions.sql)" = 43820e70118372c2974a747c4b86a149107e895d
            test "$(git hash-object scripts/validate-private-course-working-loop-signed-http.py)" = 5ee0d666be7bddacb91a4a362e1cb24823c4f5f8
            test "$(git hash-object scripts/validate-atlas-c1-signed-http.py)" = 1b82e698705e473280f1fc55b0e762bce243effb
            scratch="$(mktemp -d "$RUNNER_TEMP/private-course-working-loop.XXXXXX")"
            (cd "$scratch"; supabase init --force; supabase migration new shared_private_course_working_loop_clone_only_v1)
            mapfile -t scratch_files < <(find "$scratch/supabase/migrations" -maxdepth 1 -type f -name '*_shared_private_course_working_loop_clone_only_v1.sql')
            test "${#scratch_files[@]}" = 1
            candidate_migration="${scratch_files[0]}"
            version="$(basename "$candidate_migration" | cut -d_ -f1)"
            [[ "$version" =~ ^[0-9]{14}$ ]]
            cp "$src" "$candidate_migration"
            bash scripts/check-migration-release-lane.sh "$version" shared "$candidate_migration"
            sha256sum "$candidate_migration" scripts/private-course-working-loop-postconditions.sql
            {
              echo "path=$candidate_migration"
              echo "actual_version=$version"
              echo "validation_path=scripts/private-course-working-loop-postconditions.sql"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$RELEASE_LANE" == "atlas" && "$MIGRATION_VERSION" == "held-household-work" ]]; then
            # No candidate scripts run before the protected snapshot; no
            # production secret is available in this or subsequent steps.
            test "$(git -C candidate rev-parse HEAD)" = "fdbd73772b4760c9a97d743571705cfe29822a2f"
            src="candidate/candidates/atlas/household_work_subject_pair_repair_v1/candidate.sql"
            post="candidate/candidates/atlas/household_work_subject_pair_repair_v1/postconditions.sql"
            proof="candidate/candidates/atlas/household_work_subject_pair_repair_v1/validate_signed_household_work.py"
            fixture="candidates/atlas/household_work_subject_pair_repair_v1/clone_fixture.sql"
            test "$(git hash-object "$src")" = de88e16dc36ac052f2fb0e90b708c30253db06d1
            test "$(git hash-object "$post")" = 742f436f96149186a0c5c9d3b9d6d598b885667f
            test "$(git hash-object "$proof")" = a561ee3d34bad17837d02eed3908db3a7be6d61c
            test "$(git hash-object "$fixture")" = 737c8f98e4c0dcd4e9371a3bc99e123b05aae6c7
            # CLI-generated SCRATCH identity only, never a canonical migration.
            scratch="$(mktemp -d "$RUNNER_TEMP/household-clone.XXXXXX")"
            (cd "$scratch"; supabase init --force; supabase migration new atlas_household_work_subject_pair_repair_clone_only_v1)
            mapfile -t scratch_files < <(find "$scratch/supabase/migrations" -maxdepth 1 -type f -name '*_atlas_household_work_subject_pair_repair_clone_only_v1.sql')
            test "${#scratch_files[@]}" = 1
            candidate_migration="${scratch_files[0]}"
            version="$(basename "$candidate_migration" | cut -d_ -f1)"
            [[ "$version" =~ ^[0-9]{14}$ ]]
            cp "$src" "$candidate_migration"
            bash scripts/check-migration-release-lane.sh "$version" atlas "$candidate_migration"
            # Execute the pinned probe with the trusted MAIN helper modules.
            # The relative path is required by the existing local C1 loader.
            held_proof="candidates/atlas/household_work_subject_pair_repair_v1/validate_signed_household_work.py"
            mkdir -p "$(dirname "$held_proof")"
            cp "$proof" "$held_proof"
            sha256sum "$candidate_migration" "$fixture" "$post" "$held_proof"
            {
              echo "path=$candidate_migration"
              echo "actual_version=$version"
              echo "fixture_path=$fixture"
              echo "validation_path=$post"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$RELEASE_LANE" == "atlas" && "$MIGRATION_VERSION" == "held-laundry-lifecycle" ]]; then
            # No candidate scripts run before the protected snapshot; no
            # production secret is available in this or subsequent steps.
            test "$(git -C candidate rev-parse HEAD)" = "d865a4e510e26fdd9a154466ad9deb0af71a243f"
            src="candidate/candidates/atlas/household_laundry_process_reassessment_v1/candidate.sql"
            post="candidate/candidates/atlas/household_laundry_process_reassessment_v1/postconditions.sql"
