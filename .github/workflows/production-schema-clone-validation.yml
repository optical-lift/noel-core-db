name: Production Schema Clone Validation

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read

concurrency:
  group: noel-core-production-schema-clone-validation
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event.issue.state == 'open' &&
      github.event.issue.author_association == 'OWNER' &&
      startsWith(github.event.issue.title, 'Production schema validation request:')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Resolve governed validation request
        id: request
        shell: bash
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          title = os.environ.get('ISSUE_TITLE', '')
          body = os.environ.get('ISSUE_BODY', '')
          fields = {}
          for raw in body.splitlines():
              match = re.fullmatch(r'([a-z_]+):\s*([^\s]+)\s*', raw)
              if match:
                  key, value = match.groups()
                  if key in fields and fields[key] != value:
                      raise SystemExit(f'duplicate conflicting field: {key}')
                  fields[key] = value

          required = ('migration_version', 'release_lane', 'production_target', 'candidate_sha')
          missing = [key for key in required if key not in fields]
          if missing:
              raise SystemExit('missing required validation field(s): ' + ', '.join(missing))

          version = fields['migration_version']
          lane = fields['release_lane']
          target = fields['production_target']
          candidate_sha = fields['candidate_sha'].lower()

          if not re.fullmatch(r'\d{14}', version):
              raise SystemExit('migration_version must be exactly 14 digits')
          if lane not in {'atlas', 'wnph', 'shared'}:
              raise SystemExit('release_lane must be atlas, wnph, or shared')
          if target != 'zirqkouammpwxlqfbsvf':
              raise SystemExit('production_target does not match noel-core production')
          if not re.fullmatch(r'[0-9a-f]{40}', candidate_sha):
              raise SystemExit('candidate_sha must be an immutable 40-character commit SHA')

          title_lane = {'atlas': 'Atlas', 'wnph': 'WNPH', 'shared': 'Shared'}[lane]
          expected_title = f'Production schema validation request: {title_lane} {version}'
          if title != expected_title:
              raise SystemExit(f'issue title must be exactly: {expected_title}')

          output = Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a', encoding='utf-8') as handle:
              handle.write(f'migration_version={version}\n')
              handle.write(f'release_lane={lane}\n')
              handle.write(f'candidate_sha={candidate_sha}\n')
          PY

      - name: Checkout canonical main validator
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Verify custody and schema-validation contracts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-custody.sh
          bash scripts/check-production-release-contract.sh
          bash scripts/check-production-schema-validation-contract.sh

      - name: Install pinned Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/supabase/cli/releases/download/v2.116.0/supabase_linux_amd64.tar.gz -o /tmp/supabase.tgz
          tar -xzf /tmp/supabase.tgz -C /tmp supabase
          sudo install -m 0755 /tmp/supabase /usr/local/bin/supabase
          supabase --version
          supabase db dump --help >/dev/null
          supabase db start --help >/dev/null
          supabase db lint --help >/dev/null

      - name: Snapshot Atlas production schema read-only
        shell: bash
        env:
          NOEL_CORE_DATABASE_URL: ${{ secrets.NOEL_CORE_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${NOEL_CORE_DATABASE_URL:-}" ]]; then
            echo '::error::The protected production environment is missing NOEL_CORE_DATABASE_URL.'
            exit 1
          fi
          supabase db dump \
            --db-url "$NOEL_CORE_DATABASE_URL" \
            --schema atlas \
            --file "$RUNNER_TEMP/atlas-production-schema.sql"
          test -s "$RUNNER_TEMP/atlas-production-schema.sql"
          sha256sum "$RUNNER_TEMP/atlas-production-schema.sql"

      - name: Checkout immutable candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.candidate_sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve exact candidate migration
        id: migration
        shell: bash
        env:
          MIGRATION_VERSION: ${{ steps.request.outputs.migration_version }}
          RELEASE_LANE: ${{ steps.request.outputs.release_lane }}
        run: |
          set -euo pipefail
          mapfile -t matches < <(find candidate/supabase/migrations -maxdepth 1 -type f -name "${MIGRATION_VERSION}_*.sql" -print)
          if [[ "${#matches[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one candidate migration for ${MIGRATION_VERSION}; found ${#matches[@]}."
            exit 1
          fi
          candidate_migration="${matches[0]}"
          base="$(basename "$candidate_migration")"

          if compgen -G "supabase/migrations/${MIGRATION_VERSION}_*.sql" >/dev/null; then
            echo '::error::Candidate migration version already exists on canonical main.'
            exit 1
          fi

          cp "$candidate_migration" "supabase/migrations/$base"
          bash scripts/check-migration-release-lane.sh "$MIGRATION_VERSION" "$RELEASE_LANE"
          rm "supabase/migrations/$base"

          sha256sum "$candidate_migration"
          echo "path=$candidate_migration" >> "$GITHUB_OUTPUT"

      - name: Start disposable migration target
        shell: bash
        run: |
          set -euo pipefail
          mv supabase/migrations "$RUNNER_TEMP/canonical-main-migrations"
          mkdir -p supabase/migrations
          supabase init --force
          supabase db start

      - name: Restore production Atlas schema locally
        shell: bash
        run: |
          set -euo pipefail
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' \
            -v ON_ERROR_STOP=1 \
            -f "$RUNNER_TEMP/atlas-production-schema.sql"

      - name: Apply candidate migration only to local clone
        shell: bash
        env:
          CANDIDATE_MIGRATION: ${{ steps.migration.outputs.path }}
        run: |
          set -euo pipefail
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' \
            -v ON_ERROR_STOP=1 \
            -f "$CANDIDATE_MIGRATION"

      - name: Run canonical migration postconditions when defined
        shell: bash
        env:
          MIGRATION_VERSION: ${{ steps.request.outputs.migration_version }}
        run: |
          set -euo pipefail
          mapfile -t validations < <(find validation/migrations -maxdepth 1 -type f -name "${MIGRATION_VERSION}_*.sql" -print 2>/dev/null || true)
          if [[ "${#validations[@]}" -gt 1 ]]; then
            echo "::error::Expected at most one canonical postcondition file for ${MIGRATION_VERSION}; found ${#validations[@]}."
            exit 1
          fi
          if [[ "${#validations[@]}" -eq 1 ]]; then
            psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' \
              -v ON_ERROR_STOP=1 \
              -f "${validations[0]}"
          else
            echo "No canonical migration-specific postcondition file is defined for ${MIGRATION_VERSION}."
          fi

      - name: Lint migrated Atlas schema
        shell: bash
        run: |
          set -euo pipefail
          supabase db lint --local --schema atlas --level error --fail-on error

      - name: Run local database advisors when supported
        shell: bash
        run: |
          set -euo pipefail
          help="$(supabase db advisors --help 2>&1 || true)"
          printf '%s\n' "$help"
          if printf '%s\n' "$help" | grep -q -- '--local'; then
            supabase db advisors --local
          else
            echo 'Pinned Supabase CLI does not expose local db advisors; migration execution and plpgsql_check lint completed.'
          fi

      - name: Stop disposable local database
        if: always()
        shell: bash
        run: supabase stop --no-backup || true
