            candidate_migration="${matches[0]}"
          fi

          mapfile -t canonical_matches < <(find supabase/migrations -maxdepth 1 -type f -name "${MIGRATION_VERSION}_*.sql" -print)
          if [[ "${#canonical_matches[@]}" -gt 1 ]]; then
            echo "::error::Canonical main contains multiple migrations for ${MIGRATION_VERSION}."
            exit 1
          fi
          if [[ "${#canonical_matches[@]}" -eq 1 ]]; then
            if ! cmp -s "${canonical_matches[0]}" "$candidate_migration"; then
              echo '::error::Candidate migration version already exists on canonical main with different bytes.'
              exit 1
            fi
            echo 'Candidate preserves the exact migration bytes already staged on main and corrects only governed path ownership.'
          fi

          mapfile -t fixtures < <(find candidate/validation/fixtures -maxdepth 1 -type f -name "${MIGRATION_VERSION}_*.sql" -print 2>/dev/null || true)
          if [[ "${#fixtures[@]}" -gt 1 ]]; then
            echo "::error::Expected at most one candidate validation fixture for ${MIGRATION_VERSION}; found ${#fixtures[@]}."
            exit 1
          fi

          mapfile -t validations < <(find candidate/validation/migrations -maxdepth 1 -type f -name "${MIGRATION_VERSION}_*.sql" -print 2>/dev/null || true)
          if [[ "${#validations[@]}" -gt 1 ]]; then
            echo "::error::Expected at most one candidate postcondition file for ${MIGRATION_VERSION}; found ${#validations[@]}."
            exit 1
