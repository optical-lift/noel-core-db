name: Production Schema Clone Validation

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  packages: read

concurrency:
  group: noel-core-production-schema-clone-validation
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event.issue.state == 'open' &&
      github.event.issue.author_association == 'OWNER' &&
      startsWith(github.event.issue.title, 'Production schema validation request:')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    # Use pinned Supabase CLI's image-registry fallback when a registry throttles.
    # Read-only GHCR authentication remains in the protected workflow.
    steps:
      - name: Resolve governed validation request
        id: request
        shell: bash
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REQUEST_ACTOR: ${{ github.actor }}
          REPO_OWNER: ${{ github.repository_owner }}
