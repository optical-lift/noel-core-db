          if [[ "$RELEASE_LANE" == "atlas" && "$MIGRATION_VERSION" == "held-orphan-queue-backfill-retirement" ]]; then
            test "$(git -C candidate rev-parse HEAD)" = "833cbd7dbe2674fb747bc055878344b94be12c2b"
            src="candidate/candidates/atlas/atlas_legacy_queue_orphan_backfill_retirement_v1/candidate.sql"
            post="candidate/candidates/atlas/atlas_legacy_queue_orphan_backfill_retirement_v1/postconditions.sql"
            fixture="validation/fixtures/20261022182439_atlas_work_item_prerequisites_v1.sql"
            test "$(git hash-object "$src")" = 5956b80d02ff5e7d80553270b57d238e6fd2afd1
            test "$(git hash-object "$post")" = d771e05ef86b08997b4d7a4b78d143a58547738c
            test "$(git hash-object "$fixture")" = 766ab2b69c53796ca6aa892d57a1188fab799bc8
            test "$(git hash-object scripts/validate-atlas-access03c-pre1-local-row-integrity.py)" = a6dbf950b689505babe33811f421add9db2a742d
            test "$(git hash-object scripts/validate-atlas-work-prerequisite-signed-http.py)" = eb3bbfb45848a7fca90cc503e153f1451d8d7471
            test "$(git hash-object scripts/validate-atlas-c1-signed-http.py)" = 1b82e698705e473280f1fc55b0e762bce243effb
