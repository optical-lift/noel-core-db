name: Production Schema Clone Validation

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  packages: read

concurrency:
  group: noel-core-production-schema-clone-validation
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event.issue.state == 'open' &&
      github.event.issue.author_association == 'OWNER' &&
      startsWith(github.event.issue.title, 'Production schema validation request:')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    # Use pinned Supabase CLI's image-registry fallback when a registry throttles.
    # Read-only GHCR authentication remains in the protected workflow.
    steps:
      - name: Resolve governed validation request
        id: request
        shell: bash
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REQUEST_ACTOR: ${{ github.actor }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          title = os.environ.get('ISSUE_TITLE', '')
          body = os.environ.get('ISSUE_BODY', '')
          fields = {}
          for raw in body.splitlines():
              match = re.fullmatch(r'([a-z_]+):\s*([^\s]+)\s*', raw)
              if match:
                  key, value = match.groups()
                  if key in fields and fields[key] != value:
                      raise SystemExit(f'duplicate conflicting field: {key}')
                  fields[key] = value

          # Exact held Household package only. This branch is a disposable
          # validation request, NOT a migration identity or release request.
          if title == 'Production schema validation request: Atlas held Household Work':
              expected = {'diagnostic_scope':'atlas_household_work_subject_pair_repair_clone_only_v1',
                          'release_lane':'atlas','production_target':'zirqkouammpwxlqfbsvf',
                          'candidate_sha':'fdbd73772b4760c9a97d743571705cfe29822a2f'}
              if fields != expected or os.environ['REQUEST_ACTOR'] != os.environ['REPO_OWNER']:
                  raise SystemExit('Exact owner-held Household validation authorization required')
              with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
                  handle.write('migration_version=held-household-work\nrelease_lane=atlas\n')
                  handle.write('candidate_sha='+expected['candidate_sha']+'\n')
              raise SystemExit(0)

          # Exact held Laundry lifecycle package only. This branch is a disposable
          # validation request, NOT a migration identity or release request.
          if title == 'Production schema validation request: Atlas held Laundry lifecycle':
              expected = {'diagnostic_scope':'atlas_household_laundry_lifecycle_clone_only_v1',
                          'release_lane':'atlas','production_target':'zirqkouammpwxlqfbsvf',
                          'candidate_sha':'d865a4e510e26fdd9a154466ad9deb0af71a243f'}
              if fields != expected or os.environ['REQUEST_ACTOR'] != os.environ['REPO_OWNER']:
                  raise SystemExit('Exact owner-held Laundry lifecycle validation authorization required')
              with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
                  handle.write('migration_version=held-laundry-lifecycle\nrelease_lane=atlas\n')
                  handle.write('candidate_sha='+expected['candidate_sha']+'\n')
              raise SystemExit(0)

          # Exact held Laundry renewal initial package only. This branch is a disposable
          # validation request, NOT a migration identity or release request.
          if title == 'Production schema validation request: Atlas held Laundry renewal initial':
              expected = {'diagnostic_scope':'atlas_household_laundry_renewal_initial_clone_only_v1',
                          'release_lane':'atlas','production_target':'zirqkouammpwxlqfbsvf',
                          'candidate_sha':'862e54018648341d1d4ddd8b55c559984b3f8f7c'}
              if fields != expected or os.environ['REQUEST_ACTOR'] != os.environ['REPO_OWNER']:
                  raise SystemExit('Exact owner-held Laundry renewal initial validation authorization required')
              with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
                  handle.write('migration_version=held-laundry-renewal-initial\nrelease_lane=atlas\n')
                  handle.write('candidate_sha='+expected['candidate_sha']+'\n')
              raise SystemExit(0)

          # Exact held clean Need renewal initial package only. This branch is a disposable
          # validation request, NOT a migration identity or release request.
          if title == 'Production schema validation request: Atlas held clean Need renewal initial':
              expected = {'diagnostic_scope':'atlas_household_need_renewal_clean_initial_clone_only_v1',
                          'release_lane':'atlas','production_target':'zirqkouammpwxlqfbsvf',
                          'candidate_sha':'b5a64691e1e5f96741bde81469f636b8356198b4'}
              if fields != expected or os.environ['REQUEST_ACTOR'] != os.environ['REPO_OWNER']:
                  raise SystemExit('Exact owner-held clean Need renewal initial validation authorization required')
              with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
                  handle.write('migration_version=held-clean-renewal-initial\nrelease_lane=atlas\n')
                  handle.write('candidate_sha='+expected['candidate_sha']+'\n')
              raise SystemExit(0)

          # Exact held Laundry renewal due package only. This branch is a disposable
          # validation request, NOT a migration identity or release request.
          if title == 'Production schema validation request: Atlas held Laundry renewal due':
              expected = {'diagnostic_scope':'atlas_household_laundry_renewal_due_clone_only_v1',
                          'release_lane':'atlas','production_target':'zirqkouammpwxlqfbsvf',
                          'candidate_sha':'e3290c01631f9d28d16fbecd3085c904eaab5a6c'}
              if fields != expected or os.environ['REQUEST_ACTOR'] != os.environ['REPO_OWNER']:
                  raise SystemExit('Exact owner-held Laundry renewal due validation authorization required')
              with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
                  handle.write('migration_version=held-laundry-renewal-due\nrelease_lane=atlas\n')
                  handle.write('candidate_sha='+expected['candidate_sha']+'\n')
              raise SystemExit(0)

          # Exact held clean Need renewal due package only. This branch is a disposable
          # validation request, NOT a migration identity or release request.
          if title == 'Production schema validation request: Atlas held clean Need renewal due':
              expected = {'diagnostic_scope':'atlas_household_need_renewal_clean_due_clone_only_v1',
                          'release_lane':'atlas','production_target':'zirqkouammpwxlqfbsvf',
                          'candidate_sha':'b5a64691e1e5f96741bde81469f636b8356198b4'}
              if fields != expected or os.environ['REQUEST_ACTOR'] != os.environ['REPO_OWNER']:
                  raise SystemExit('Exact owner-held clean Need renewal due validation authorization required')
              with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
                  handle.write('migration_version=held-clean-renewal-due\nrelease_lane=atlas\n')
                  handle.write('candidate_sha='+expected['candidate_sha']+'\n')
              raise SystemExit(0)

          required = ('migration_version', 'release_lane', 'production_target', 'candidate_sha')
          missing = [key for key in required if key not in fields]
          if missing:
              raise SystemExit('missing required validation field(s): ' + ', '.join(missing))

          version = fields['migration_version']
          lane = fields['release_lane']
          target = fields['production_target']
          candidate_sha = fields['candidate_sha'].lower()

          if not re.fullmatch(r'\d{14}', version):
              raise SystemExit('migration_version must be exactly 14 digits')
          if lane not in {'atlas', 'wnph', 'titus', 'noel', 'shared'}:
              raise SystemExit('release_lane must be atlas, wnph, titus, noel, or shared')
          if target != 'zirqkouammpwxlqfbsvf':
              raise SystemExit('production_target does not match noel-core production')
          if not re.fullmatch(r'[0-9a-f]{40}', candidate_sha):
              raise SystemExit('candidate_sha must be an immutable 40-character commit SHA')

          title_lane = {'atlas': 'Atlas', 'wnph': 'WNPH', 'titus': 'Titus', 'noel': 'Noel', 'shared': 'Shared'}[lane]
          expected_title = f'Production schema validation request: {title_lane} {version}'
          if title != expected_title:
              raise SystemExit(f'issue title must be exactly: {expected_title}')

          output = Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a', encoding='utf-8') as handle:
              handle.write(f'migration_version={version}\n')
              handle.write(f'release_lane={lane}\n')
              handle.write(f'candidate_sha={candidate_sha}\n')
          PY

      - name: Checkout canonical main validator
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Verify custody and schema-validation contracts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-custody.sh
          bash scripts/check-production-release-contract.sh
          bash scripts/check-production-schema-validation-contract.sh

      - name: Install pinned Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/supabase/cli/releases/download/v2.116.0/supabase_linux_amd64.tar.gz -o /tmp/supabase.tgz
          tar -xzf /tmp/supabase.tgz -C /tmp supabase
          sudo install -m 0755 /tmp/supabase /usr/local/bin/supabase
          supabase --version
          supabase db dump --help >/dev/null
          supabase db start --help >/dev/null
          supabase db lint --help >/dev/null

      - name: Authenticate read-only GHCR image pulls
        shell: bash
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$GHCR_TOKEN"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin

      - name: Snapshot production user schemas read-only
        shell: bash
        env:
          NOEL_CORE_DATABASE_URL: ${{ secrets.NOEL_CORE_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${NOEL_CORE_DATABASE_URL:-}" ]]; then
            echo '::error::The protected production environment is missing NOEL_CORE_DATABASE_URL.'
            exit 1
          fi
          supabase db dump \
            --db-url "$NOEL_CORE_DATABASE_URL" \
            --role-only \
            --file "$RUNNER_TEMP/production-custom-roles.sql"
          supabase db dump \
            --db-url "$NOEL_CORE_DATABASE_URL" \
            --file "$RUNNER_TEMP/production-user-schema.sql"
          test -s "$RUNNER_TEMP/production-custom-roles.sql"
          test -s "$RUNNER_TEMP/production-user-schema.sql"
          sha256sum "$RUNNER_TEMP/production-custom-roles.sql"
          sha256sum "$RUNNER_TEMP/production-user-schema.sql"

      - name: Checkout immutable candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.candidate_sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve exact candidate migration package
        id: migration
        shell: bash
        env:
          MIGRATION_VERSION: ${{ steps.request.outputs.migration_version }}
          RELEASE_LANE: ${{ steps.request.outputs.release_lane }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_LANE" == "atlas" && "$MIGRATION_VERSION" == "held-household-work" ]]; then
            # No candidate scripts run before the protected snapshot; no
            # production secret is available in this or subsequent steps.
            test "$(git -C candidate rev-parse HEAD)" = "fdbd73772b4760c9a97d743571705cfe29822a2f"
            src="candidate/candidates/atlas/household_work_subject_pair_repair_v1/candidate.sql"
            post="candidate/candidates/atlas/household_work_subject_pair_repair_v1/postconditions.sql"
            proof="candidate/candidates/atlas/household_work_subject_pair_repair_v1/validate_signed_household_work.py"
            fixture="candidates/atlas/household_work_subject_pair_repair_v1/clone_fixture.sql"
            test "$(git hash-object "$src")" = de88e16dc36ac052f2fb0e90b708c30253db06d1
            test "$(git hash-object "$post")" = 742f436f96149186a0c5c9d3b9d6d598b885667f
            test "$(git hash-object "$proof")" = a561ee3d34bad17837d02eed3908db3a7be6d61c
            test "$(git hash-object "$fixture")" = 737c8f98e4c0dcd4e9371a3bc99e123b05aae6c7
            # CLI-generated SCRATCH identity only, never a canonical migration.
            scratch="$(mktemp -d "$RUNNER_TEMP/household-clone.XXXXXX")"
            (cd "$scratch"; supabase init --force; supabase migration new atlas_household_work_subject_pair_repair_clone_only_v1)
            mapfile -t scratch_files < <(find "$scratch/supabase/migrations" -maxdepth 1 -type f -name '*_atlas_household_work_subject_pair_repair_clone_only_v1.sql')
            test "${#scratch_files[@]}" = 1
            candidate_migration="${scratch_files[0]}"
            version="$(basename "$candidate_migration" | cut -d_ -f1)"
            [[ "$version" =~ ^[0-9]{14}$ ]]
            cp "$src" "$candidate_migration"
            bash scripts/check-migration-release-lane.sh "$version" atlas "$candidate_migration"
            # Execute the pinned probe with the trusted MAIN helper modules.
            # The relative path is required by the existing local C1 loader.
            held_proof="candidates/atlas/household_work_subject_pair_repair_v1/validate_signed_household_work.py"
            mkdir -p "$(dirname "$held_proof")"
            cp "$proof" "$held_proof"
            sha256sum "$candidate_migration" "$fixture" "$post" "$held_proof"
            {
              echo "path=$candidate_migration"
              echo "actual_version=$version"
              echo "fixture_path=$fixture"
              echo "validation_path=$post"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$RELEASE_LANE" == "atlas" && "$MIGRATION_VERSION" == "held-laundry-lifecycle" ]]; then
            # No candidate scripts run before the protected snapshot; no
            # production secret is available in this or subsequent steps.
            test "$(git -C candidate rev-parse HEAD)" = "d865a4e510e26fdd9a154466ad9deb0af71a243f"
            src="candidate/candidates/atlas/household_laundry_process_reassessment_v1/candidate.sql"
            post="candidate/candidates/atlas/household_laundry_process_reassessment_v1/postconditions.sql"
            proof="candidate/candidates/atlas/household_laundry_process_reassessment_v1/validate_signed_process_reassessment.py"
            fixture="candidates/atlas/household_work_subject_pair_repair_v1/clone_fixture.sql"
            test "$(git hash-object "$src")" = 058c6627e5c369ed9b83b0f972abc949739095e7
            test "$(git hash-object "$post")" = ce747e365321526757e2302f32572dfd45ca91e9
            test "$(git hash-object "$proof")" = 9f1ae62612df98ae0a8b2d73482ebbf58f11fa19
            test "$(git hash-object "$fixture")" = 737c8f98e4c0dcd4e9371a3bc99e123b05aae6c7
            # CLI-generated SCRATCH identity only, never a canonical migration.
            scratch="$(mktemp -d "$RUNNER_TEMP/household-clone.XXXXXX")"
            (cd "$scratch"; supabase init --force; supabase migration new atlas_household_laundry_lifecycle_clone_only_v1)
            mapfile -t scratch_files < <(find "$scratch/supabase/migrations" -maxdepth 1 -type f -name '*_atlas_household_laundry_lifecycle_clone_only_v1.sql')
            test "${#scratch_files[@]}" = 1
            candidate_migration="${scratch_files[0]}"
            version="$(basename "$candidate_migration" | cut -d_ -f1)"
            [[ "$version" =~ ^[0-9]{14}$ ]]
            cp "$src" "$candidate_migration"
            bash scripts/check-migration-release-lane.sh "$version" atlas "$candidate_migration"
            # Execute the pinned probe with the trusted MAIN helper modules.
            # The relative path is required by the existing local C1 loader.
            held_proof="candidates/atlas/household_laundry_process_reassessment_v1/validate_signed_process_reassessment.py"
            mkdir -p "$(dirname "$held_proof")"
            cp "$proof" "$held_proof"
            sha256sum "$candidate_migration" "$fixture" "$post" "$held_proof"
            {
              echo "path=$candidate_migration"
              echo "actual_version=$version"
              echo "fixture_path=$fixture"
              echo "validation_path=$post"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$RELEASE_LANE" == "atlas" && "$MIGRATION_VERSION" == "held-laundry-renewal-initial" ]]; then
            # No candidate scripts run before the protected snapshot; no
            # production secret is available in this or subsequent steps.
            test "$(git -C candidate rev-parse HEAD)" = "862e54018648341d1d4ddd8b55c559984b3f8f7c"
            src="candidate/candidates/atlas/household_laundry_renewal_attention_v1/candidate.sql"
            post="candidate/candidates/atlas/household_laundry_renewal_attention_v1/postconditions.sql"
            proof="candidate/candidates/atlas/household_laundry_renewal_attention_v1/validate_signed_renewal_initial.py"
            fixture="candidate/candidates/atlas/household_laundry_renewal_attention_v1/clone_fixture.sql"
            test "$(git hash-object "$src")" = 9cb29da5dfd9042224fcc1e1e08414a537c72fa0
            test "$(git hash-object "$post")" = 76728974daa1622c11f0c4a9d08e6b26b8c1af11
            test "$(git hash-object "$proof")" = 09af135127887ca34ed428ec7c4531ab6dc8dc9d
            renewal_probe="candidate/candidates/atlas/household_laundry_renewal_attention_v1/validate_signed_renewal_attention.py"
            test "$(git hash-object "$renewal_probe")" = 69426f1df315dafe528981b69dd50a84100ec78c
            test "$(git hash-object "$fixture")" = 0a6225004cdd8d693d2f243b770d1b8b7412f5cf
            # CLI-generated SCRATCH identity only, never a canonical migration.
            scratch="$(mktemp -d "$RUNNER_TEMP/household-clone.XXXXXX")"
            (cd "$scratch"; supabase init --force; supabase migration new atlas_household_laundry_renewal_initial_clone_only_v1)
            mapfile -t scratch_files < <(find "$scratch/supabase/migrations" -maxdepth 1 -type f -name '*_atlas_household_laundry_renewal_initial_clone_only_v1.sql')
            test "${#scratch_files[@]}" = 1
            candidate_migration="${scratch_files[0]}"
            version="$(basename "$candidate_migration" | cut -d_ -f1)"
            [[ "$version" =~ ^[0-9]{14}$ ]]
            cp "$src" "$candidate_migration"
            bash scripts/check-migration-release-lane.sh "$version" atlas "$candidate_migration"
            # Execute the pinned probe with the trusted MAIN helper modules.
            # The relative path is required by the existing local C1 loader.
            held_proof="candidates/atlas/household_laundry_renewal_attention_v1/validate_signed_renewal_initial.py"
            mkdir -p "$(dirname "$held_proof")"
            cp "$proof" "$held_proof"
            cp "$renewal_probe" "$(dirname "$held_proof")/validate_signed_renewal_attention.py"
            sha256sum "$candidate_migration" "$fixture" "$post" "$held_proof"
            {
              echo "path=$candidate_migration"
              echo "actual_version=$version"
              echo "fixture_path=$fixture"
              echo "validation_path=$post"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$RELEASE_LANE" == "atlas" && "$MIGRATION_VERSION" == "held-clean-renewal-initial" ]]; then
            # No candidate scripts run before the protected snapshot; no
            # production secret is available in this or subsequent steps.
            test "$(git -C candidate rev-parse HEAD)" = "b5a64691e1e5f96741bde81469f636b8356198b4"
            src="candidate/candidates/atlas/household_need_renewal_clean_cutover_v1/candidate.sql"
            post="candidate/candidates/atlas/household_need_renewal_clean_cutover_v1/postconditions.sql"
            proof="candidate/candidates/atlas/household_need_renewal_clean_cutover_v1/validate_signed_renewal_initial.py"
            fixture="candidate/candidates/atlas/household_need_renewal_clean_cutover_v1/clone_fixture.sql"
            test "$(git hash-object "$src")" = 27561382cbc33be1da2b1128481702b2d511001f
            test "$(git hash-object "$post")" = 23eaa37cd92a4e72ba954d5892e6b2bae0466aee
            test "$(git hash-object "$proof")" = 1251c8971f26518220f8e8851ce9b220b10e60af
            renewal_probe="candidate/candidates/atlas/household_need_renewal_clean_cutover_v1/validate_signed_renewal_attention.py"
            test "$(git hash-object "$renewal_probe")" = 9440ffcedd817b33e2736a969e40c523f75e18a3
            test "$(git hash-object "$fixture")" = d0c82b47f242b3ef4fe077f86fd1d20f378e359f
            # CLI-generated SCRATCH identity only, never a canonical migration.
            scratch="$(mktemp -d "$RUNNER_TEMP/household-clone.XXXXXX")"
            (cd "$scratch"; supabase init --force; supabase migration new atlas_household_need_renewal_clean_initial_clone_only_v1)
            mapfile -t scratch_files < <(find "$scratch/supabase/migrations" -maxdepth 1 -type f -name '*_atlas_household_need_renewal_clean_initial_clone_only_v1.sql')
            test "${#scratch_files[@]}" = 1
            candidate_migration="${scratch_files[0]}"
            version="$(basename "$candidate_migration" | cut -d_ -f1)"
            [[ "$version" =~ ^[0-9]{14}$ ]]
            cp "$src" "$candidate_migration"
            bash scripts/check-migration-release-lane.sh "$version" atlas "$candidate_migration"
            # Execute the pinned probe with the trusted MAIN helper modules.
            # The relative path is required by the existing local C1 loader.
            held_proof="candidates/atlas/household_need_renewal_clean_cutover_v1/validate_signed_renewal_initial.py"
            mkdir -p "$(dirname "$held_proof")"
            cp "$proof" "$held_proof"
            cp "$renewal_probe" "$(dirname "$held_proof")/validate_signed_renewal_attention.py"
            sha256sum "$candidate_migration" "$fixture" "$post" "$held_proof"
            {
              echo "path=$candidate_migration"
              echo "actual_version=$version"
              echo "fixture_path=$fixture"
              echo "validation_path=$post"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$RELEASE_LANE" == "atlas" && "$MIGRATION_VERSION" == "held-laundry-renewal-due" ]]; then
            # No candidate scripts run before the protected snapshot; no
            # production secret is available in this or subsequent steps.
            test "$(git -C candidate rev-parse HEAD)" = "e3290c01631f9d28d16fbecd3085c904eaab5a6c"
            src="candidate/candidates/atlas/household_laundry_renewal_attention_v1/candidate.sql"
            post="candidate/candidates/atlas/household_laundry_renewal_attention_v1/postconditions.sql"
            proof="candidate/candidates/atlas/household_laundry_renewal_attention_v1/validate_signed_renewal_historical.py"
            fixture="candidate/candidates/atlas/household_laundry_renewal_attention_v1/clone_fixture.sql"
            test "$(git hash-object "$src")" = 9cb29da5dfd9042224fcc1e1e08414a537c72fa0
            test "$(git hash-object "$post")" = 76728974daa1622c11f0c4a9d08e6b26b8c1af11
            test "$(git hash-object "$proof")" = cd244d0f961187bd022309c50790fe5334e92afc
            renewal_probe="candidate/candidates/atlas/household_laundry_renewal_attention_v1/validate_signed_renewal_due.py"
            test "$(git hash-object "$renewal_probe")" = dde6d83550b892ada267d68a99bde3d493860faa
            test "$(git hash-object "$fixture")" = 0a6225004cdd8d693d2f243b770d1b8b7412f5cf
            # CLI-generated SCRATCH identity only, never a canonical migration.
            scratch="$(mktemp -d "$RUNNER_TEMP/household-clone.XXXXXX")"
            (cd "$scratch"; supabase init --force; supabase migration new atlas_household_laundry_renewal_due_clone_only_v1)
            mapfile -t scratch_files < <(find "$scratch/supabase/migrations" -maxdepth 1 -type f -name '*_atlas_household_laundry_renewal_due_clone_only_v1.sql')
            test "${#scratch_files[@]}" = 1
            candidate_migration="${scratch_files[0]}"
            version="$(basename "$candidate_migration" | cut -d_ -f1)"
            [[ "$version" =~ ^[0-9]{14}$ ]]
            cp "$src" "$candidate_migration"
            bash scripts/check-migration-release-lane.sh "$version" atlas "$candidate_migration"
            # Execute the pinned probe with the trusted MAIN helper modules.
            # The relative path is required by the existing local C1 loader.
            held_proof="candidates/atlas/household_laundry_renewal_attention_v1/validate_signed_renewal_historical.py"
            mkdir -p "$(dirname "$held_proof")"
            cp "$proof" "$held_proof"
            cp "$renewal_probe" "$(dirname "$held_proof")/validate_signed_renewal_due.py"
            sha256sum "$candidate_migration" "$fixture" "$post" "$held_proof"
            {
              echo "path=$candidate_migration"
              echo "actual_version=$version"
              echo "fixture_path=$fixture"
              echo "validation_path=$post"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$RELEASE_LANE" == "atlas" && "$MIGRATION_VERSION" == "held-clean-renewal-due" ]]; then
            # No candidate scripts run before the protected snapshot; no
            # production secret is available in this or subsequent steps.
            test "$(git -C candidate rev-parse HEAD)" = "b5a64691e1e5f96741bde81469f636b8356198b4"
            src="candidate/candidates/atlas/household_need_renewal_clean_cutover_v1/candidate.sql"
            post="candidate/candidates/atlas/household_need_renewal_clean_cutover_v1/postconditions.sql"
            proof="candidate/candidates/atlas/household_need_renewal_clean_cutover_v1/validate_signed_renewal_historical.py"
            fixture="candidate/candidates/atlas/household_need_renewal_clean_cutover_v1/clone_fixture.sql"
            test "$(git hash-object "$src")" = 27561382cbc33be1da2b1128481702b2d511001f
            test "$(git hash-object "$post")" = 23eaa37cd92a4e72ba954d5892e6b2bae0466aee
            test "$(git hash-object "$proof")" = 6be4632c95c076e3a962a7b8e10967063cc14984
            renewal_probe="candidate/candidates/atlas/household_need_renewal_clean_cutover_v1/validate_signed_renewal_due.py"
            test "$(git hash-object "$renewal_probe")" = cbb87cb6cd0feadb459007bc6938f0f566454598
            test "$(git hash-object "$fixture")" = d0c82b47f242b3ef4fe077f86fd1d20f378e359f
            # CLI-generated SCRATCH identity only, never a canonical migration.
            scratch="$(mktemp -d "$RUNNER_TEMP/household-clone.XXXXXX")"
            (cd "$scratch"; supabase init --force; supabase migration new atlas_household_need_renewal_clean_due_clone_only_v1)
            mapfile -t scratch_files < <(find "$scratch/supabase/migrations" -maxdepth 1 -type f -name '*_atlas_household_need_renewal_clean_due_clone_only_v1.sql')
            test "${#scratch_files[@]}" = 1
            candidate_migration="${scratch_files[0]}"
            version="$(basename "$candidate_migration" | cut -d_ -f1)"
            [[ "$version" =~ ^[0-9]{14}$ ]]
            cp "$src" "$candidate_migration"
            bash scripts/check-migration-release-lane.sh "$version" atlas "$candidate_migration"
            # Execute the pinned probe with the trusted MAIN helper modules.
            # The relative path is required by the existing local C1 loader.
            held_proof="candidates/atlas/household_need_renewal_clean_cutover_v1/validate_signed_renewal_historical.py"
            mkdir -p "$(dirname "$held_proof")"
            cp "$proof" "$held_proof"
            cp "$renewal_probe" "$(dirname "$held_proof")/validate_signed_renewal_due.py"
            sha256sum "$candidate_migration" "$fixture" "$post" "$held_proof"
            {
              echo "path=$candidate_migration"
              echo "actual_version=$version"
              echo "fixture_path=$fixture"
              echo "validation_path=$post"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # One exact non-releasable TEST SOURCE path; never accepted by the
          # production release migration directory or arbitrary candidate.
          if [[ "$RELEASE_LANE" == "atlas" && "$MIGRATION_VERSION" == "20261028235811" ]]; then
            candidate_migration="candidate/candidates/atlas/20261028235811_atlas_care_single_done_signed_proof_v1.sql"
            if [[ ! -s "$candidate_migration" ]] ||
               [[ -e "candidate/supabase/migrations/20261028235811_atlas_care_single_done_signed_proof_v1.sql" ]]; then
              echo "::error::Care proof must be a held source candidate, NEVER a releasable migration."
              exit 1
            fi
          else
            mapfile -t matches < <(find candidate/supabase/migrations -maxdepth 1 -type f -name "${MIGRATION_VERSION}_*.sql" -print)
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "::error::Expected exactly one candidate migration for ${MIGRATION_VERSION}; found ${#matches[@]}."
              exit 1
            fi
            candidate_migration="${matches[0]}"
          fi

          mapfile -t canonical_matches < <(find supabase/migrations -maxdepth 1 -type f -name "${MIGRATION_VERSION}_*.sql" -print)
          if [[ "${#canonical_matches[@]}" -gt 1 ]]; then
            echo "::error::Canonical main contains multiple migrations for ${MIGRATION_VERSION}."
            exit 1
          fi
          if [[ "${#canonical_matches[@]}" -eq 1 ]]; then
            if ! cmp -s "${canonical_matches[0]}" "$candidate_migration"; then
              echo '::error::Candidate migration version already exists on canonical main with different bytes.'
              exit 1
            fi
            echo 'Candidate preserves the exact migration bytes already staged on main and corrects only governed path ownership.'
          fi

          mapfile -t fixtures < <(find candidate/validation/fixtures -maxdepth 1 -type f -name "${MIGRATION_VERSION}_*.sql" -print 2>/dev/null || true)
          if [[ "${#fixtures[@]}" -gt 1 ]]; then
            echo "::error::Expected at most one candidate validation fixture for ${MIGRATION_VERSION}; found ${#fixtures[@]}."
            exit 1
          fi

          mapfile -t validations < <(find candidate/validation/migrations -maxdepth 1 -type f -name "${MIGRATION_VERSION}_*.sql" -print 2>/dev/null || true)
          if [[ "${#validations[@]}" -gt 1 ]]; then
            echo "::error::Expected at most one candidate postcondition file for ${MIGRATION_VERSION}; found ${#validations[@]}."
            exit 1
          fi

          bash scripts/check-migration-release-lane.sh "$MIGRATION_VERSION" "$RELEASE_LANE" "$candidate_migration"

          sha256sum "$candidate_migration"
          echo "actual_version=$MIGRATION_VERSION" >> "$GITHUB_OUTPUT"
          echo "path=$candidate_migration" >> "$GITHUB_OUTPUT"
          if [[ "${#fixtures[@]}" -eq 1 ]]; then
            sha256sum "${fixtures[0]}"
            echo "fixture_path=${fixtures[0]}" >> "$GITHUB_OUTPUT"
          fi
          if [[ "${#validations[@]}" -eq 1 ]]; then
            sha256sum "${validations[0]}"
            echo "validation_path=${validations[0]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate candidate through canonical local harness
        id: validation
        shell: bash
        env:
          MIGRATION_VERSION: ${{ steps.migration.outputs.actual_version }}
          RELEASE_LANE: ${{ steps.request.outputs.release_lane }}
          CANDIDATE_MIGRATION: ${{ steps.migration.outputs.path }}
          CANDIDATE_FIXTURE: ${{ steps.migration.outputs.fixture_path }}
          CANDIDATE_VALIDATION: ${{ steps.migration.outputs.validation_path }}
        run: |
          set -euo pipefail
          args=(
            --migration-version "$MIGRATION_VERSION"
            --release-lane "$RELEASE_LANE"
            --candidate-migration "$CANDIDATE_MIGRATION"
            --roles-dump "$RUNNER_TEMP/production-custom-roles.sql"
            --schema-dump "$RUNNER_TEMP/production-user-schema.sql"
            --artifacts-dir "$RUNNER_TEMP/production-schema-validation-artifacts"
          )
          if [[ -n "${CANDIDATE_FIXTURE:-}" ]]; then
            args+=(--candidate-fixture "$CANDIDATE_FIXTURE")
          fi
          if [[ -n "${CANDIDATE_VALIDATION:-}" ]]; then
            args+=(--candidate-validation "$CANDIDATE_VALIDATION")
          fi
          bash scripts/validate-production-schema-clone.sh "${args[@]}"

      - name: Publish validation summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          summary="$RUNNER_TEMP/production-schema-validation-artifacts/summary.md"
          if [[ -s "$summary" ]]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::error::The validation harness did not produce its required summary artifact.'
            exit 1
          fi

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-schema-validation-${{ steps.request.outputs.migration_version }}
          path: ${{ runner.temp }}/production-schema-validation-artifacts
          if-no-files-found: error
          retention-days: 30

  report-result:
    name: Report clone outcome to request
    needs: [validate]
    if: >-
      always() &&
      github.event.issue.state == 'open' &&
      github.event.issue.author_association == 'OWNER' &&
      startsWith(github.event.issue.title, 'Production schema validation request:')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # This separate job has no protected environment and no database secrets.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Publish non-sensitive result and run link
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUEST_NUMBER: ${{ github.event.issue.number }}
          RESULT: ${{ needs.validate.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          case "$RESULT" in
            success|failure|cancelled|skipped) ;;
            *) echo 'Unexpected validation status; refusing report.' >&2; exit 1 ;;
          esac
          gh issue comment "$REQUEST_NUMBER" --body "Disposable production-schema clone validation result: **$RESULT**.

          [View the full GitHub Actions run]($RUN_URL) to inspect the validation summary, migration diagnostics, lint delta, and any failed steps.

          This status report does not authorize a database release or attest to untested two-person permission and concurrency requirements."
