name: Temporary Communication Endpoint authority migration generator

on:
  push:
    branches:
      - feat/communication-endpoint-exact-authority-v1
    paths:
      - .github/workflows/tmp-communication-endpoint-authority-migration-generator.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/communication-endpoint-exact-authority-v1
          fetch-depth: 0
      - name: Install repository-pinned Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/supabase/cli/releases/download/v2.116.0/supabase_linux_amd64.tar.gz -o /tmp/supabase.tgz
          tar -xzf /tmp/supabase.tgz -C /tmp supabase
          sudo install -m 0755 /tmp/supabase /usr/local/bin/supabase
          test "$(supabase --version | tail -n 1)" = "2.116.0"
      - name: Generate canonical migration identity
        shell: bash
        run: |
          set -euo pipefail
          supabase migration new atlas_communication_endpoint_exact_authority_v1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git commit -m "Generate Communication Endpoint exact-authority migration"
          git push origin HEAD:feat/communication-endpoint-exact-authority-v1
