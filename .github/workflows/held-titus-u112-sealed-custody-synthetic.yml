name: HELD Titus U1.12 sealed custody synthetic proof (no data access)

on:
  push:
    branches:
      - candidate/titus-u112-sealed-custody-transport-20261118
    paths:
      - 'scripts/titus-u112-sealed-custody-transport.py'
      - 'tests/test_titus_u112_sealed_custody_transport.py'
      - 'scripts/test-titus-u112-encrypted-pg17-restore.sh'
      - 'candidates/shared-teaching-course-clean-cutover-v1/U1_12_*'
      - '.github/workflows/held-titus-u112-sealed-custody-synthetic.yml'
  pull_request:
    paths:
      - 'scripts/titus-u112-sealed-custody-transport.py'
      - 'tests/test_titus_u112_sealed_custody_transport.py'
      - 'scripts/test-titus-u112-encrypted-pg17-restore.sh'
      - 'candidates/shared-teaching-course-clean-cutover-v1/U1_12_*'
      - '.github/workflows/held-titus-u112-sealed-custody-synthetic.yml'

permissions:
  contents: read

jobs:
  sealed-transport-fixtures:
    if: github.repository == 'optical-lift/noel-core-db'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check genuine AES-GCM CMS sealing and independent synthetic verification
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_titus_u112_sealed_custody_transport.py -v
          bash -n scripts/test-titus-u112-encrypted-pg17-restore.sh
          bash scripts/test-titus-u112-encrypted-pg17-restore.sh
          test ! -e supabase/migrations/20261118_titus_u112_historical_data.sql
          echo 'PASS fictional source-only sealed custody; no database access or real data'
