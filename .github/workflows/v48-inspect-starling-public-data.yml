name: V48 inspect public starling symbolic data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v48-inspect-starling-public-data.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve Zenodo file object through public text proxy
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 20 --max-time 120 \
            'https://r.jina.ai/http://zenodo.org/api/records/3775893' \
            -o zenodo-proxy.txt
          python - <<'PY'
          import re, pathlib
          s=pathlib.Path('zenodo-proxy.txt').read_text(errors='ignore')
          print('PROXY_BYTES',len(s))
          print('HAS_FILENAME','projections_comparison.zip' in s)
          # Print only matching metadata lines / object URLs, not the entire record.
          for line in s.splitlines():
              if ('projections_comparison.zip' in line or
                  '3286361174de5e6a2ca50986101df2fb' in line or
                  'api/files/' in line):
                  print(line[:2000])
          urls=re.findall(r'https?://zenodo\.org/api/files/[A-Za-z0-9-]+/projections_comparison\.zip',s)
          if urls:
              print('OBJECT_URL',urls[0])
          else:
              # Some renderers escape slashes or quote the bucket separately.
              uuids=re.findall(r'([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})',s,re.I)
              print('UUID_CANDIDATES',sorted(set(uuids))[:50])
          PY
