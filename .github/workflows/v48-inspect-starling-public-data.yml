name: V48 inspect public starling symbolic data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v48-inspect-starling-public-data.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve Zenodo object-store metadata only
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          url='https://zenodo.org/api/records/3775893'
          with urllib.request.urlopen(url, timeout=30) as r:
              rec=json.load(r)
          f=next(x for x in rec['files'] if x['key']=='projections_comparison.zip')
          print('KEY',f['key'])
          print('SIZE',f['size'])
          print('CHECKSUM',f['checksum'])
          print('BUCKET',f.get('bucket'))
          for k,v in sorted(f.get('links',{}).items()):
              print('LINK',k,v)
          print('RECORD_BUCKET',rec.get('links',{}).get('bucket'))
          PY
