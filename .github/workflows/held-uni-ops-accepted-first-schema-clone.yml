name: HELD UNI-OPS accepted-first authentic schema clone (free, owner-only)
on:
  issues:
    types: [opened, edited, reopened]
permissions:
  contents: read
  packages: read
  issues: read
concurrency:
  group: held-uni-ops-accepted-first-authentic-schema
  cancel-in-progress: false
jobs:
  validate-protected:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.state == 'open' &&
      github.event.issue.author_association == 'OWNER' &&
      github.actor == github.repository_owner &&
      github.event.issue.title == 'UNI-OPS-01 11-source accepted-first authentic schema test request'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 55
    steps:
      - name: Authorize exact held test scope, never release
        shell: bash
        env:
          OWNER_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          pairs={}
          expected={
              'diagnostic_scope':'uni_ops_accepted_first_disposable_schema_v1',
              'production_target':'zirqkouammpwxlqfbsvf',
              'harness_head':'5d28e2584736b8dd9cab928a34a6d5dc39ba38c1'}
          for line in os.environ.get('OWNER_BODY','').splitlines():
              match=re.fullmatch(r'([a-z_]+):\s*([a-z0-9_]+)\s*',line)
              if match and match[1] in expected:
                  if match[1] in pairs:raise SystemExit("Duplicate owner source selector")
                  pairs[match[1]]=match[2]
          if pairs!=expected:raise SystemExit("Unrecognized immutable owner test selection")
          print("PASS exact owner-controlled held integration, no production release")
          PY
      - name: Checkout existing main custody and zero-cost signed schema clone harness
        uses: actions/checkout@v4
        with:
          ref: main
          path: canonical
          persist-credentials: false
      - name: Verify trusted Noel migration custody
        shell: bash
        working-directory: canonical
        run: |
          set -euo pipefail
          bash scripts/check-custody.sh
          bash scripts/check-production-release-contract.sh
          bash scripts/check-production-schema-validation-contract.sh
          bash -n scripts/validate-production-schema-clone.sh
          python3 - <<'PY'
          import json
          d=json.load(open('custody/production-baseline-v1.json'))
          assert d['inheritedHistory']['migrationCount']==2022
          assert d['inheritedHistory']['throughVersion']=='20260825203448'
          print("PASS frozen inherited migration baseline; no history replays")
          PY
      - name: Install SHA256-pinned existing Supabase CLI 2.116.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/supabase-2.116.0.tar.gz"
          curl -fLsS --proto '=https' --tlsv1.2 --max-time 240 \
            https://github.com/supabase/cli/releases/download/v2.116.0/supabase_2.116.0_linux_amd64.tar.gz \
            -o "$archive"
          echo "5b3031cb297d51b25be4c284e4c852254460ec722ec221d3b81b07d55acfd158  $archive" | sha256sum -c --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" supabase
          sudo install -m 0755 "$RUNNER_TEMP/supabase" /usr/local/bin/supabase
          test "$(supabase --version | tail -1)" = 2.116.0
          command -v psql
          docker info >/dev/null
      - name: Authorize read-only GHCR image pulls
        shell: bash
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin >/dev/null
      - name: READ-ONLY snapshot exact production schema and roles, no data
        shell: bash
        env:
          NOEL_CORE_DATABASE_URL: ${{ secrets.NOEL_CORE_DATABASE_URL }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$NOEL_CORE_DATABASE_URL" || {
            echo 'BLOCKED existing protected read-only schema credential unavailable'
            exit 1
          }
          supabase db dump --db-url "$NOEL_CORE_DATABASE_URL" \
            --role-only --file "$RUNNER_TEMP/uniops-snapshot-roles.sql" >/dev/null
          supabase db dump --db-url "$NOEL_CORE_DATABASE_URL" \
            --file "$RUNNER_TEMP/uniops-snapshot-schema.sql" >/dev/null
          test -s "$RUNNER_TEMP/uniops-snapshot-roles.sql"
          test -s "$RUNNER_TEMP/uniops-snapshot-schema.sql"
          echo 'PASS existing production schema-only read; no table rows or mutations'
      - name: Pin six separate held revisions and one exact Noel assembler
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          pin_root="$(mktemp -d "$RUNNER_TEMP/uniops-full-clone.XXXXXXXX")"
          echo "UNI_OPS_PIN_ROOT=$pin_root" >> "$GITHUB_ENV"
          git init -q "$pin_root/repo"
          git -C "$pin_root/repo" remote add origin https://github.com/optical-lift/noel-core-db.git
          while read -r label sha; do
            test -n "$label" && [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            git -C "$pin_root/repo" -c credential.helper= fetch -q --depth=1 --no-tags origin "$sha"
            test "$(git -C "$pin_root/repo" rev-parse FETCH_HEAD)" = "$sha"
            git -C "$pin_root/repo" worktree add --quiet --detach "$pin_root/$label" "$sha"
            test "$(git -C "$pin_root/$label" rev-parse HEAD)" = "$sha"
          done <<'PINNED'
          lifecycle ddfb0bf5374798301fe076a61d2b944dfb52ff63
          r02 d48cd444fd261fd5f8c91655b789e50730c1b9f7
          u1a f9c372d3487ea6af4d29a4ee3b22579b9d94c5ae
          u1b 18be5996faaa0f7a0def1d07c262f53b39e73605
          u2 2be045d7fa51b83416a57c76b1a5508e815b8445
          u2c 1fd28856ff8d3fd99997fc0ae1fcf8714407a407
          harness 5d28e2584736b8dd9cab928a34a6d5dc39ba38c1
          PINNED
          path="candidates/atlas_uni_ops_c_u2c_single_rulebook_cutover_v1/tests/prepare_pinned_accepted_first_scratch.py"
          test "$(git -C "$pin_root/harness" hash-object "$path")" = f3a2de3a345d63cb51feba6f848ccb9a4ab74bb0
          echo 'PASS exact pinned source revisions and test-only assembler'
      - name: Assemble exactly 11 original SQL stages, scratch only
        shell: bash
        run: |
          set -euo pipefail
          script="$UNI_OPS_PIN_ROOT/harness/candidates/atlas_uni_ops_c_u2c_single_rulebook_cutover_v1/tests/prepare_pinned_accepted_first_scratch.py"
          scratch="$RUNNER_TEMP/UNI_OPS_ACCEPTED_FIRST_${GITHUB_RUN_ID}_TEST_ONLY.sql"
          python3 "$script" \
            --lifecycle "$UNI_OPS_PIN_ROOT/lifecycle" \
            --r02 "$UNI_OPS_PIN_ROOT/r02" \
            --u1a "$UNI_OPS_PIN_ROOT/u1a" \
            --u1b "$UNI_OPS_PIN_ROOT/u1b" \
            --u2 "$UNI_OPS_PIN_ROOT/u2" \
            --u2c "$UNI_OPS_PIN_ROOT/u2c" \
            --output "$scratch" > "$RUNNER_TEMP/uniops-manifest.json"
          python3 - "$RUNNER_TEMP/uniops-manifest.json" "$scratch" <<'PY'
          import hashlib,json,sys
          r=json.load(open(sys.argv[1]))
          assert r['success'] is True and r['kind']=='UNI_OPS_ACCEPTED_FIRST_DISPOSABLE_ONLY'
          assert len(r['stages'])==11
          assert hashlib.sha256(open(sys.argv[2],'rb').read()).hexdigest()==r['scratch_file_sha256']
          print('PASS exact 11 original SQL source blob hashes; no side effects')
          PY
          cp "$scratch" "$RUNNER_TEMP/20261107193000_atlas_uni_ops_accepted_first_DISPOSABLE_ONLY.sql"
      - name: Run canonical authentic-schema disposable clone, no release
        id: integration
        shell: bash
        working-directory: canonical
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/uniops-private-diagnostics"
          if bash scripts/validate-production-schema-clone.sh \
            --migration-version 20261107193000 \
            --release-lane atlas \
            --candidate-migration "$RUNNER_TEMP/20261107193000_atlas_uni_ops_accepted_first_DISPOSABLE_ONLY.sql" \
            --roles-dump "$RUNNER_TEMP/uniops-snapshot-roles.sql" \
            --schema-dump "$RUNNER_TEMP/uniops-snapshot-schema.sql" \
            --artifacts-dir "$RUNNER_TEMP/uniops-private-diagnostics" \
            > "$RUNNER_TEMP/uniops-private-clone.log" 2>&1; then
              echo 'PASS 11 held SQL sources on authentic-schema disposable clone'
              echo 'HOLD real signed First Work/worker acceptance remains a separate gate'
          else
              echo 'HELD authentic-schema clone SQL test; diagnostic classification follows'
              exit 1
          fi
      - name: Report only bounded failure class and source stage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/uniops-private-diagnostics" \
            "$RUNNER_TEMP/uniops-private-clone.log" \
            "$RUNNER_TEMP/20261107193000_atlas_uni_ops_accepted_first_DISPOSABLE_ONLY.sql" <<'PY'
          import pathlib,re,sys
          root=pathlib.Path(sys.argv[1]); summary=pathlib.Path(sys.argv[2])
          candidate=root/'candidate-migration.log'
          sql=pathlib.Path(sys.argv[3])
          class_map={'42P01':'missing_relation','42703':'missing_column','42883':'missing_function',
           '42710':'duplicate_object','42P07':'duplicate_relation','42601':'syntax',
           '42501':'privilege','23505':'uniqueness','23514':'check_constraint','3F000':'missing_schema'}
          stage='not_reached'; category='not_classified'
          if candidate.is_file() and sql.is_file():
              err=candidate.read_text(errors='replace')
              # Standard psql errors omit SQLSTATE; match the first error line
              # independently of whether VERBOSITY includes a five-character code.
              m=re.search(r'(?m)^psql:[^:\n]+:(\d+):\s*(?:ERROR|FATAL):\s*(?:([A-Z0-9]{5}):\s*)?',err)
              if m:
                  if m[2]:
                      category=class_map.get(m[2],'other_sqlstate')
                  else:
                      # Read only a private error line. Emit a fixed category,
                      # never the statement, relation name, or error message.
                      detail=err[m.end():].splitlines()[0].lower()
                      patterns=(
                          ('missing_schema',r'\bschema\b.*\bdoes not exist\b'),
                          ('missing_relation',r'\brelation\b.*\bdoes not exist\b'),
                          ('missing_column',r'\bcolumn\b.*\bdoes not exist\b'),
                          ('missing_function',r'\bfunction\b.*\bdoes not exist\b'),
                          ('syntax',r'\bsyntax error\b'),
                          ('privilege',r'\bpermission denied\b'),
                          ('uniqueness',r'\bduplicate key\b'),
                          ('check_constraint',r'\bcheck constraint\b'),
                          ('duplicate_object',r'\balready exists\b'))
                      category=next((name for name,pattern in patterns if re.search(pattern,detail)),
                                    'unclassified_sql_error')
                  for i,line in enumerate(sql.read_text(errors='replace').splitlines(),1):
                      marker=re.match(r'^-- BEGIN PINNED STAGE ([a-z0-9-]+) blob:[0-9a-f]{40}$',line)
                      if marker:stage=marker[1]
                      if i>=int(m[1]):break
          log=summary.read_text(errors='replace') if summary.is_file() else ''
          report=root/'summary.md'
          report_text=report.read_text(errors='replace') if report.is_file() else ''
          allowed=('release-lane custody check','validation fixture safety check',
                   'schema dump sanitation','disposable database startup',
                   'production custom-role restore','production user-schema restore',
                   'baseline domain schema lint','candidate validation fixture application',
                   'candidate migration application','candidate migration postconditions',
                   'candidate domain schema lint','candidate lint delta comparison','local database advisors')
          phase=next((x for x in allowed
                     if ('Validation command exited during ' + chr(96)+x+chr(96)) in report_text
                     or ('**FAILED during '+x+'.**') in report_text),'not_reported')
          print('UNI_OPS_FIRST_SOURCE='+stage)
          print('UNI_OPS_SQL_ERROR_CLASS='+category)
          print('UNI_OPS_LOCAL_PHASE='+phase)
          print('UNI_OPS_SIGNED_WORK_ACCEPTANCE=NOT_RUN')
          print('UNI_OPS_PRODUCTION_MUTATION=NONE')
          print('UNI_OPS_PAID_BRANCH=NONE')
          PY
      - name: Delete private test-only schema, role snapshot, source and logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- "$RUNNER_TEMP/uniops-snapshot-schema.sql" "$RUNNER_TEMP/uniops-snapshot-roles.sql"
          rm -f -- "$RUNNER_TEMP/uniops-private-clone.log" "$RUNNER_TEMP/uniops-manifest.json"
          rm -f -- "$RUNNER_TEMP/20261107193000_atlas_uni_ops_accepted_first_DISPOSABLE_ONLY.sql"
          rm -f -- "$RUNNER_TEMP/UNI_OPS_ACCEPTED_FIRST_${GITHUB_RUN_ID}_TEST_ONLY.sql"
          case "${UNI_OPS_PIN_ROOT:-}" in
            "$RUNNER_TEMP"/uniops-full-clone.*) rm -rf -- "$UNI_OPS_PIN_ROOT" ;;
          esac
          if [[ -d "$RUNNER_TEMP/uniops-private-diagnostics" && ! -L "$RUNNER_TEMP/uniops-private-diagnostics" ]]; then
            rm -rf -- "$RUNNER_TEMP/uniops-private-diagnostics"
          fi
          echo 'PASS no schema dump, role dump or diagnostic artifact retained/uploaded'
