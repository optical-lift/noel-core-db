name: Repair Work Sentence Context migration

on:
  push:
    branches:
      - repair/work-sentence-context-v1-post-tail

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite migration identity atomically
        shell: bash
        run: |
          set -euo pipefail

          BASE='a67d5b863d06f878331f384ceb2a03fbfcfebcf0'
          OLD_TS='20260914130000'
          NEW_TS='20260914203100'
          OLD_M="supabase/migrations/${OLD_TS}_atlas_work_sentence_context_v1.sql"
          NEW_M="supabase/migrations/${NEW_TS}_atlas_work_sentence_context_v1.sql"
          OLD_V="validation/migrations/${OLD_TS}_atlas_work_sentence_context_v1.sql"
          NEW_V="validation/migrations/${NEW_TS}_atlas_work_sentence_context_v1.sql"
          WF='.github/workflows/repair-work-sentence-context-v1.yml'

          test "$(git rev-parse HEAD^)" = "$BASE" || {
            echo 'unexpected branch base'
            exit 1
          }

          test -f "$OLD_M"
          test -f "$OLD_V"
          test ! -e "$NEW_M"
          test ! -e "$NEW_V"

          cp "$OLD_M" /tmp/old_migration.sql
          OLD_M_HASH="$(git hash-object "$OLD_M")"
          OLD_V_HASH="$(git hash-object "$OLD_V")"
          test "$OLD_V_HASH" = 'a01bb8c2c2dddcd8c59061bb887c696141067c49'

          {
            printf 'begin;\n\n'
            cat /tmp/old_migration.sql
            printf '\ncommit;\n'
          } > "$NEW_M"

          git mv "$OLD_V" "$NEW_V"
          rm "$OLD_M"

          python3 - "$NEW_M" /tmp/old_migration.sql <<'PY'
          from pathlib import Path
          import sys

          new = Path(sys.argv[1]).read_bytes()
          old = Path(sys.argv[2]).read_bytes()
          prefix = b"begin;\n\n"
          suffix = b"\ncommit;\n"
          assert new.startswith(prefix)
          assert new.endswith(suffix)
          assert new[len(prefix):-len(suffix)] == old
          PY

          test "$(git hash-object "$NEW_V")" = "$OLD_V_HASH"
          test ! -e "$OLD_M"
          test ! -e "$OLD_V"
          test -f "$NEW_M"
          test -f "$NEW_V"

          # Prove that removing only the wrapper reproduces the exact old migration blob.
          python3 - "$NEW_M" /tmp/old_migration.sql "$OLD_M_HASH" <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess
          import sys

          new_path, old_path, old_git_hash = sys.argv[1:]
          new = Path(new_path).read_bytes()
          old = Path(old_path).read_bytes()
          body = new[len(b"begin;\n\n"):-len(b"\ncommit;\n")]
          assert body == old
          computed = subprocess.check_output(['git', 'hash-object', old_path], text=True).strip()
          assert computed == old_git_hash
          PY

          git rm "$WF"
          git add -A -- supabase/migrations validation/migrations .github/workflows

          CHANGED="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n' "$WF" "$OLD_M" "$NEW_M" "$OLD_V" "$NEW_V" | sort)"
          test "$CHANGED" = "$EXPECTED"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: reissue Work Sentence Context migration after migration tail'
          git push origin HEAD:repair/work-sentence-context-v1-post-tail
