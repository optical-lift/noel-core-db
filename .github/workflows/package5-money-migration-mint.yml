name: Temporary Package 5 Money migration identity mint

on:
  push:
    branches:
      - package-5/money-collection-current-main-v1
    paths:
      - .github/workflows/package5-money-migration-mint.yml

permissions:
  contents: write

jobs:
  mint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: package-5/money-collection-current-main-v1

      - name: Install pinned Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/supabase/cli/releases/download/v2.116.0/supabase_linux_amd64.tar.gz -o /tmp/supabase.tgz
          tar -xzf /tmp/supabase.tgz -C /tmp supabase
          sudo install -m 0755 /tmp/supabase /usr/local/bin/supabase
          supabase --version
          supabase migration new --help >/dev/null

      - name: Mint canonical migration identity
        shell: bash
        run: |
          set -euo pipefail
          if find supabase/migrations -maxdepth 1 -type f -name '*_atlas_money_collection_current_main_v1.sql' | grep -q .; then
            echo 'Migration identity already exists; refusing to mint a second one.'
            exit 0
          fi
          supabase migration new atlas_money_collection_current_main_v1
          mapfile -t files < <(find supabase/migrations -maxdepth 1 -type f -name '*_atlas_money_collection_current_main_v1.sql' -print)
          test "${#files[@]}" -eq 1
          printf 'begin;\n\ncommit;\n' > "${files[0]}"
          echo "Minted ${files[0]}"

      - name: Commit minted identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- supabase/migrations)" ]]; then
            echo 'No migration file was created.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations
          git commit -m 'Mint Package 5 Money Collection migration identity'
          git push origin HEAD:package-5/money-collection-current-main-v1
