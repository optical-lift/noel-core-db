name: HELD UNI-OPS C2 Case Work signed fixture source review (no network)
on:
  pull_request:
    paths:
      - 'scripts/validate-atlas-c2-case-work-signed-http.py'
      - 'tests/uniops_c2_case_work_disposable_fixture_held.sql'
      - 'tests/test_uniops_c2_case_work_signed_source_held.py'
      - 'docs/review/uniops_c2_signed_case_work_fixture_held/**'
      - '.github/workflows/held-uniops-c2-signed-fixture-source.yml'
permissions:
  contents: read
jobs:
  source-review-only:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and check source contracts without executing SQL
        run: |
          python3 -m py_compile scripts/validate-atlas-c2-case-work-signed-http.py
          python3 tests/test_uniops_c2_case_work_signed_source_held.py
      - name: Deny protected execution and privilege escalation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          y=Path('.github/workflows/held-uniops-c2-signed-fixture-source.yml').read_text()
          assert 'pull_request:' in y
          assert 'github.event_name == \'pull_request\'' in y
          # Do not scan the literal prohibited list against itself.
          declared=y.split('      - name: Deny protected execution and privilege escalation',1)[0]
          import re
          assert re.findall(r'^  ([a-z0-9_-]+):',y.split('jobs:',1)[1],re.M) == ['source-review-only']
          for prohibited in ('environment: production','secrets.', 'workflow_dispatch:',
                             'issues:', 'self-hosted', 'NOEL_CORE_DATABASE_URL',
                             'supabase db dump','supabase db push','psql ',
                             'validate-atlas-c2-case-work-signed-http.py --db-url'):
              assert prohibited not in declared,prohibited
          print('PASS PR-only unprivileged source review; no protected test')
          PY
