name: Assemble Money Collection Migration

on:
  push:
    branches:
      - design/money-collection-kernel-v1

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: design/money-collection-kernel-v1

      - name: Assemble canonical migration from reviewed tranches
        shell: bash
        run: |
          set -euo pipefail
          target='supabase/migrations/20260901161304_atlas_money_collection_kernel_v1.sql'
          provenance='20260901161304_atlas_money_collection_kernel_v1'

          test -f "$target"
          if [[ -s "$target" ]]; then
            echo 'Canonical migration is already assembled; refusing to rewrite it.' >&2
            exit 1
          fi

          tmp="$(mktemp)"
          {
            printf '%s\n' 'BEGIN;'
            printf '%s\n' '' '-- Atlas Money Collection Kernel v1.'
            printf '%s\n' '-- Canonical migration identity generated by Supabase CLI v2.116.0.'
            printf '%s\n' "-- Release provenance: ${provenance}"
            printf '%s\n' ''

            cat architecture/atlas-money-collection-kernel-v1-cutover-fence.sql
            printf '%s\n' ''

            # The original foundation file is an executable proof wrapped in
            # BEGIN/ROLLBACK. Preserve its SQL byte-for-byte except those two
            # proof-only transaction sentinels; this migration owns the transaction.
            sed -e '/^BEGIN;$/d' -e '/^ROLLBACK;$/d' \
              architecture/atlas-money-collection-kernel-v1.sql
            printf '%s\n' ''

            cat architecture/atlas-money-collection-kernel-v1-coverage-obligation.sql
            printf '%s\n' ''
            cat architecture/atlas-money-collection-kernel-v1-collection.sql
            printf '%s\n' ''
            cat architecture/atlas-money-collection-kernel-v1-receipts.sql
            printf '%s\n' ''
            cat architecture/atlas-money-collection-kernel-v1-domain-adapters.sql
            printf '%s\n' ''
            cat architecture/atlas-money-collection-kernel-v1-flower-conversion-retry-fence.sql
            printf '%s\n' ''
            cat architecture/atlas-money-collection-kernel-v1-registration-fee-snapshot.sql
            printf '%s\n' ''
            cat architecture/atlas-money-collection-kernel-v1-source-consistency.sql
            printf '%s\n' ''
            cat architecture/atlas-money-collection-kernel-v1-source-write-fence.sql
            printf '%s\n' ''
            cat architecture/atlas-money-collection-kernel-v1-retire-obsolete-coverage-reader.sql
            printf '%s\n' ''

            cat <<'SQL'
-- Activate both globally installed source adapters only after every governed
-- writer replacement/fence above is installed. Use one actual post-lock wall
-- clock value so legacy writers that completed while this transaction waited
-- for the cutover locks are never misclassified as kernel-covered.
do $$
declare
  v_cutover_at timestamptz := clock_timestamp();
begin
  perform atlas.activate_money_source_adapter_coverage_core_v1(
    'community_registration',
    'registration',
    'participation_fee',
    'community_registration_money_v1',
    v_cutover_at,
    '20260901161304_atlas_money_collection_kernel_v1',
    null,
    '{"cleanCutover":true}'::jsonb
  );

  perform atlas.activate_money_source_adapter_coverage_core_v1(
    'flower_commerce',
    'flower_sale_order',
    'sale_total',
    'flower_sale_money_v1',
    v_cutover_at,
    '20260901161304_atlas_money_collection_kernel_v1',
    null,
    '{"historicalAbsenceMeans":"payment_truth_unknown_pre_kernel"}'::jsonb
  );
end;
$$;

COMMIT;
SQL
          } > "$tmp"

          mv "$tmp" "$target"

          [[ "$(grep -c '^BEGIN;$' "$target")" -eq 1 ]]
          [[ "$(grep -c '^COMMIT;$' "$target")" -eq 1 ]]
          [[ "$(grep -c '^ROLLBACK;$' "$target" || true)" -eq 0 ]]
          [[ "$(grep -c "'20260901161304_atlas_money_collection_kernel_v1'" "$target")" -eq 2 ]]
          grep -q '^lock table$' "$target"
          grep -q 'v_cutover_at timestamptz := clock_timestamp();' "$target"
          grep -q 'drop table atlas.community_registration_payments;' "$target"
          grep -q 'drop function atlas.money_source_coverage_state_core_v1(' "$target"

      - name: Verify repository and Atlas release contracts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-custody.sh
          bash scripts/check-migration-release-lane.sh 20260901161304 atlas
          bash scripts/check-production-release-contract.sh

      - name: Commit assembled canonical migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/20260901161304_atlas_money_collection_kernel_v1.sql
          git commit -m 'Assemble canonical Money Collection migration'
          git push origin HEAD:design/money-collection-kernel-v1
