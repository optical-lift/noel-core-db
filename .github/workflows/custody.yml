name: Database Custody CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  custody:
    runs-on: ubuntu-latest
    env:
      NOEL_CORE_SUPABASE_URL: https://zirqkouammpwxlqfbsvf.supabase.co
      NOEL_CORE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_3UCb5b3USJD24c2uX6B_4A_0XWDT6si
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify custody trigger contract
        run: bash scripts/check-custody-trigger.sh

      - name: Verify static custody boundaries
        run: bash scripts/check-custody.sh

      - name: Verify WNPH product schema membrane
        run: bash scripts/check-wnph-membrane.sh

      - name: Verify live production migration authority
        run: bash scripts/check-live-production-custody.sh

      - name: Probe live Company Work RPC
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$body" \
            --write-out '%{http_code}' \
            --request POST \
            --header "apikey: ${NOEL_CORE_SUPABASE_PUBLISHABLE_KEY}" \
            --header "Authorization: Bearer ${NOEL_CORE_SUPABASE_PUBLISHABLE_KEY}" \
            --header "Content-Type: application/json" \
            --header "Accept-Profile: atlas" \
            --header "Content-Profile: atlas" \
            --data '{"p_organization_id":"52afd94a-25e8-4532-a3c6-6aeeb2654297"}' \
            "${NOEL_CORE_SUPABASE_URL}/rest/v1/rpc/company_work_position_api_v1")"
          response="$(cat "$body")"
          rm -f "$body"
          echo "COMPANY_WORK_PROBE_STATUS=$status"
          echo "COMPANY_WORK_PROBE_BODY=$response"
          if [ "$status" = "404" ] || printf '%s' "$response" | grep -q 'PGRST202'; then
            echo "Company Work RPC is not live." >&2
            exit 1
          fi
          echo "COMPANY_WORK_RPC_LIVE"
