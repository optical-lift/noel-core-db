name: Database Custody CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  custody:
    runs-on: ubuntu-latest
    env:
      NOEL_CORE_SUPABASE_URL: https://zirqkouammpwxlqfbsvf.supabase.co
      NOEL_CORE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_3UCb5b3USJD24c2uX6B_4A_0XWDT6si
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify custody trigger contract
        run: bash scripts/check-custody-trigger.sh

      - name: Verify static custody boundaries
        run: bash scripts/check-custody.sh

      - name: Verify WNPH product schema membrane
        run: bash scripts/check-wnph-membrane.sh

      - name: Verify production release seam contract
        run: bash scripts/check-production-release-contract.sh

      - name: Verify production schema validation contract
        run: bash scripts/check-production-schema-validation-contract.sh

      - name: Reconcile and verify global live production custody
        env:
          LIVE_CUSTODY_MANIFEST_PATH: ${{ runner.temp }}/live-custody-reconciliation.json
        run: bash scripts/reconcile-live-production-custody.sh --enforce

      - name: Preserve live custody reconciliation manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-custody-reconciliation-${{ github.run_id }}
          path: ${{ runner.temp }}/live-custody-reconciliation.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify Atlas live release lane
        run: bash scripts/check-live-production-custody-lane.sh atlas

      - name: Verify WNPH live release lane
        run: bash scripts/check-live-production-custody-lane.sh wnph
