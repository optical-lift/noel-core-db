name: Database Custody CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  custody:
    runs-on: ubuntu-latest
    env:
      NOEL_CORE_SUPABASE_URL: https://zirqkouammpwxlqfbsvf.supabase.co
      NOEL_CORE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_3UCb5b3USJD24c2uX6B_4A_0XWDT6si
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify custody trigger contract
        run: bash scripts/check-custody-trigger.sh

      - name: Verify static custody boundaries
        run: bash scripts/check-custody.sh

      - name: Reject new employee/consultant Person admission paths
        run: |
          python3 -m unittest discover -s tests -p 'test_universal_person_authority.py'
          python3 scripts/check-universal-person-authority.py

      - name: Validate held Atlas original Work source candidates
        if: github.event_name == 'pull_request'
        run: python3 scripts/check-atlas-universal-original-work-candidates.py

      - name: Validate ordered Atlas universal Work scratch bundle
        if: github.event_name == 'pull_request'
        run: python3 scripts/assemble-atlas-universal-original-work-candidate.py

      - name: Parse Atlas Work PostgreSQL and PLpgSQL grammar
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pglast==8.7
          python3 scripts/parse-atlas-universal-original-work-candidates.py

      - name: Generate governed scratch migration identity
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/supabase/cli/releases/download/v2.116.0/supabase_linux_amd64.tar.gz -o "$RUNNER_TEMP/supabase-cli.tgz"
          tar -xzf "$RUNNER_TEMP/supabase-cli.tgz" -C "$RUNNER_TEMP" supabase
          chmod 755 "$RUNNER_TEMP/supabase"
          test "$("$RUNNER_TEMP/supabase" --version | tail -n1)" = '2.116.0'
          mkdir -p "$RUNNER_TEMP/universal-original-work-source"
          cd "$RUNNER_TEMP/universal-original-work-source"
          "$RUNNER_TEMP/supabase" init --force
          "$RUNNER_TEMP/supabase" migration new atlas_universal_original_work_integrated_v1
          mapfile -t migrations < <(find supabase/migrations -maxdepth 1 -name '*_atlas_universal_original_work_integrated_v1.sql' -type f)
          test "${#migrations[@]}" = 1
          candidate="$GITHUB_WORKSPACE/candidates/atlas/atlas_universal_original_work_integrated_v1/candidate.sql"
          cp "$candidate" "${migrations[0]}"
          version="$(basename "${migrations[0]}")"
          [[ "$version" =~ ^[0-9]{14}_atlas_universal_original_work_integrated_v1[.]sql$ ]]
          cd "$GITHUB_WORKSPACE"
          bash scripts/check-migration-release-lane.sh "${version:0:14}" atlas "$RUNNER_TEMP/universal-original-work-source/supabase/migrations/$version"
          echo "GOVERNED_CLI_SCRATCH_MIGRATION_NAME=$version"
          echo "This is an ephemeral CLI-generated test identity only; it is not committed or deployed."

      - name: Verify WNPH product schema membrane
        run: bash scripts/check-wnph-membrane.sh

      - name: Verify production release seam contract
        run: bash scripts/check-production-release-contract.sh

      - name: Verify production schema validation contract
        run: bash scripts/check-production-schema-validation-contract.sh

      # The global health report is always produced. A pull request is a proposed
      # source change, not the shared production state; only main/schedule/manual
      # enforce every foreign-domain tail as a global incident.
      - name: Report global live custody on pull requests
        if: github.event_name == 'pull_request'
        env:
          LIVE_CUSTODY_MANIFEST_PATH: ${{ runner.temp }}/live-custody-reconciliation.json
        run: bash scripts/reconcile-live-production-custody.sh --report-only

      - name: Reconcile and verify global live production custody
        if: github.event_name != 'pull_request'
        env:
          LIVE_CUSTODY_MANIFEST_PATH: ${{ runner.temp }}/live-custody-reconciliation.json
        run: bash scripts/reconcile-live-production-custody.sh --enforce

      - name: Preserve live custody reconciliation manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-custody-reconciliation-${{ github.run_id }}
          path: ${{ runner.temp }}/live-custody-reconciliation.json
          if-no-files-found: error
          retention-days: 30

      - name: Validate domain isolation regression assertions
        run: python3 validation/test-domain-isolation-policy.py

      - name: Verify Atlas live release lane
        run: bash scripts/check-live-production-custody-lane.sh atlas

      - name: Verify WNPH live release lane
        run: bash scripts/check-live-production-custody-lane.sh wnph
