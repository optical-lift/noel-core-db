name: HELD Titus T5 owner-protected signed study (no release)
on:
  pull_request:
    paths:
      - '.github/workflows/held-titus-t5-protected-signed-study-owner-clone.yml'
      - 'scripts/validate-production-schema-clone.sh'
      - 'scripts/validate-titus-t5-signed-study-http.py'
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  review-source-only:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check T5 carrier source and reject invalid execution scopes
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/validate-production-schema-clone.sh
          python3 -m py_compile scripts/validate-titus-t5-signed-study-http.py
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          touch "$tmp/roles.sql" "$tmp/schema.sql"
          printf 'SELECT 1;\n' > "$tmp/roles.sql"
          cp "$tmp/roles.sql" "$tmp/schema.sql"
          cp "$tmp/roles.sql" "$tmp/20261119100000_shared_titus_t5_teaching_TEST_ONLY.sql"
          if bash scripts/validate-production-schema-clone.sh --migration-version 20261119100000 --release-lane shared --t5-rollback-shape --candidate-migration "$tmp/20261119100000_shared_titus_t5_teaching_TEST_ONLY.sql" --roles-dump "$tmp/roles.sql" --schema-dump "$tmp/schema.sql" --artifacts-dir "$tmp/out" >"$tmp/refusal.log" 2>&1; then
            echo 'Unsafe scratch package unexpectedly accepted' >&2
            exit 1
          fi
          test ! -e "$tmp/out"
          if bash scripts/validate-production-schema-clone.sh --migration-version 20261119100000 --release-lane shared --t5-signed-study --candidate-migration "$tmp/20261119100000_shared_titus_t5_teaching_TEST_ONLY.sql" --roles-dump "$tmp/roles.sql" --schema-dump "$tmp/schema.sql" --artifacts-dir "$tmp/out" >"$tmp/refusal.log" 2>&1; then
            exit 1
          fi
          test ! -e "$tmp/out"
          python3 - <<'PY'
          from pathlib import Path
          w=Path('.github/workflows/held-titus-t5-protected-signed-study-owner-clone.yml').read_text()
          # Compile the exact diagnostic heredoc before any protected execution.
          diagnostics=w.split('            python3 - "$d/diagnostics" <<\'PY\'\n',1)[1].split('\n          PY\n',1)[0]
          code='\n'.join(line[10:] for line in diagnostics.splitlines())
          compile(code,'title-bounded-diagnostics','exec')
          assert "TITLE_PROOF_DENIAL_CODES=" in code
          protected=w.split('\n  validate-owner-protected:\n',1)[1].split('\n  validate-owner-release-shape:\n',1)[0]
          for required in (
            "github.event.issue.author_association == 'OWNER'",
            "github.actor == github.repository_owner",
            "environment: production",
            "fields['candidate_sha']",
            "fields['titus_sha']",
            "fields['test_scope']",
            "fields['production_target']",
            "e71fc75d37a047ec52ebbace72fb7698fec00284",
            "4150cf7b83ef6ed3a50b9a78502889dc818b2005",
            "Snapshot production schema/roles READ ONLY",
            "NOEL_CORE_DATABASE_URL",
            "--t5-rollback-shape --t5-signed-study",
            "titus_t5_protected_signed_study_test_only_v1",
          ):
            assert required in protected,required
          for forbidden in ('supabase db push','supabase migration up','db reset --linked','SUPABASE_SERVICE_ROLE_KEY','apply_migration','gh pr merge','upload-artifact'):
            assert forbidden not in protected,forbidden
          assert protected.count('secrets.NOEL_CORE_DATABASE_URL')==1
          assert protected.count('secrets.TITUS_PR_READ_TOKEN')==1
          titus=protected.split("      - name: Verify exact private Titus draft with existing read-only PR credential",1)[1].split("      - name: Install pinned CLI",1)[0]
          assert 'GH_TOKEN: ' in titus and 'secrets.TITUS_PR_READ_TOKEN' in titus
          assert 'repos/optical-lift/titus/pulls/72' in titus and '4150cf7b83ef6ed3a50b9a78502889dc818b2005' in titus
          assert 'NOEL_CORE_DATABASE_URL' not in titus
          assert 'secrets.TITUS_PR_READ_TOKEN' not in protected.split("      - name: Verify exact private Titus draft",1)[0]
          assert protected.index("Verify exact private Titus draft") < protected.index("Snapshot production schema/roles READ ONLY")
          assert protected.index("Verify exact frozen drafts") < protected.index("Snapshot production schema/roles READ ONLY") < protected.index("Assemble exact scratch source") < protected.index("Disposable rollback-only teaching schema check")
          s=Path('scripts/validate-production-schema-clone.sh').read_text()
          assert s.count('phase="T5 disposable rollback-only shape"')==1
          section=s.split('phase="T5 disposable rollback-only shape"',1)[1].split('run_lint() {',1)[0]
          assert 'docker exec -i "$local_container" psql' in section and 'rollback confirmed' in section and 'exit 0' in section
          assert s.index('phase="production user-schema restore"') < s.index('phase="T5 disposable rollback-only shape"') < s.index('phase="candidate migration application"')
          assert 'phase="T5 signed fictional HTTP proof"' in section
          assert 'validate-titus-t5-signed-study-http.py' in section
          assert section.index("rollback confirmed") < section.index('phase="T5 signed fictional HTTP proof"')
          probe=Path('scripts/validate-titus-t5-signed-study-http.py').read_text()
          for required in ('auth.sign_in','auth.sessions','schema-only empty clone required','42501','later private finding','teaching_enrollments'):
            assert required.lower() in probe.lower(),required
          assert 'request.jwt' not in probe
          release=w.split('\n  validate-owner-release-shape:\n',1)[1]
          assert release.count('secrets.NOEL_CORE_DATABASE_URL')==1
          assert 'github.actor == github.repository_owner' in release and "github.event.issue.author_association == 'OWNER'" in release
          assert 'environment: production' in release and 'c330c20ab9245d3c2e21c04447894929496915ac' in release
          assert 'b1f5e656afc5158bafe9353f813caa4449db3188' in release and 'ccbbfef0429a1c5c5ecba5b8516bf2c0fc75d23f' in release
          for forbidden in ('supabase db push','supabase migration up','db reset --linked','SUPABASE_SERVICE_ROLE_KEY','apply_migration','gh pr merge','upload-artifact','--t5-rollback-shape'):
            assert forbidden not in release,forbidden
          assert release.index('Verify exact staged migration') < release.index('Snapshot protected schema/roles READ ONLY') < release.index('Rehearse exact versioned transaction')
          assert '>"$d/run.log" 2>&1' in release and 'rm -rf "$RUNNER_TEMP/t5-release-private"' in release
          print("PASS signed T5 source-only gate; existing release paths retained")
          PY


  validate-owner-title-proof:
    concurrency:
      group: titus-original-title-protected-clone
      cancel-in-progress: false
    if: >-
      github.event_name == 'issues' &&
      github.repository == 'optical-lift/noel-core-db' &&
      github.ref == 'refs/heads/main' &&
      github.event.issue.state == 'open' &&
      github.event.issue.author_association == 'OWNER' &&
      github.actor == github.repository_owner &&
      github.event.issue.title == 'HELD Titus original title signed clone validation request'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 45
    steps:
      - name: Resolve exact owner-selected title proof
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          fields={}
          for raw in os.environ['ISSUE_BODY'].splitlines():
              if not raw.strip(): continue
              m=re.fullmatch(r'([a-z_]+):\s*([a-zA-Z0-9_-]+)\s*',raw)
              if not m or m.group(1) in fields: raise SystemExit('invalid request')
              fields[m.group(1)]=m.group(2)
          assert fields=={'candidate_sha':'bf61c987a3d0393ffeb50d81493a4991e505df1f','test_scope':'titus_original_title_signed_clone_only_v1','production_target':'zirqkouammpwxlqfbsvf'}
          print('PASS exact owner-selected schema-only title proof')
          PY
      - name: Checkout canonical validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: canonical
          persist-credentials: false
      - name: Checkout immutable held title candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: bf61c987a3d0393ffeb50d81493a4991e505df1f
          path: held-title
          persist-credentials: false
      - name: Verify exact reviewed package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/3035" --jq '[.state,(.draft|tostring),.head.ref,.head.sha]|join("|")')" = "open|true|candidate/shared-teaching-object-title-v1-20261119|bf61c987a3d0393ffeb50d81493a4991e505df1f"
          test "$(git -C held-title rev-parse HEAD)" = bf61c987a3d0393ffeb50d81493a4991e505df1f
          test "$(git -C held-title hash-object candidates/shared-teaching-object-title-v1/candidate.sql)" = 6c7f9387c9cda8014762f8c3f7678c87e993cf1a
          test "$(git -C held-title hash-object scripts/validate-titus-object-title-signed-http.py)" = 4d434ccd05689841290df26d10c41bd2c6e789cc
          cd canonical
          test "$(git hash-object scripts/validate-atlas-c1-signed-http.py)" = 1b82e698705e473280f1fc55b0e762bce243effb
          bash scripts/check-custody.sh
          bash scripts/check-production-release-contract.sh
          bash scripts/check-production-schema-validation-contract.sh
          bash -n scripts/validate-production-schema-clone.sh
      - name: Install existing pinned CLI
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/supabase/cli/releases/download/v2.116.0/supabase_linux_amd64.tar.gz -o "$RUNNER_TEMP/title-cli.tgz"
          tar -xzf "$RUNNER_TEMP/title-cli.tgz" -C "$RUNNER_TEMP" supabase
          sudo install -m 0755 "$RUNNER_TEMP/supabase" /usr/local/bin/supabase
          test "$(supabase --version | tail -n1)" = '2.116.0'
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin >/dev/null
      - name: Snapshot protected schema and roles READ ONLY
        shell: bash
        env:
          NOEL_CORE_DATABASE_URL: ${{ secrets.NOEL_CORE_DATABASE_URL }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/title-proof-private"
          mkdir "$d"
          test -n "$NOEL_CORE_DATABASE_URL"
          supabase db dump --db-url "$NOEL_CORE_DATABASE_URL" --role-only --file "$d/roles.sql" >"$d/roles.log" 2>&1
          supabase db dump --db-url "$NOEL_CORE_DATABASE_URL" --file "$d/schema.sql" >"$d/schema.log" 2>&1
          test -s "$d/roles.sql"
          test -s "$d/schema.sql"
          echo 'PASS read-only schema and roles; no records'
      - name: Run existing harness with exact pinned scratch-only title package
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/title-proof-private"
          mkdir "$d/scratch"
          (cd "$d/scratch"; supabase init --force; supabase migration new shared_teaching_object_title_clone_only_v1) >"$d/cli.log" 2>&1
          mapfile -t files < <(find "$d/scratch/supabase/migrations" -maxdepth 1 -type f -name '*_shared_teaching_object_title_clone_only_v1.sql')
          test "${#files[@]}" = 1
          migration="${files[0]}"
          version="$(basename "$migration" | cut -d_ -f1)"
          [[ "$version" =~ ^[0-9]{14}$ ]]
          cp held-title/candidates/shared-teaching-object-title-v1/candidate.sql "$migration"
          test "$(git hash-object "$migration")" = 6c7f9387c9cda8014762f8c3f7678c87e993cf1a
          cp held-title/scripts/validate-titus-object-title-signed-http.py canonical/scripts/validate-titus-object-title-signed-http.py
          cd canonical
          bash scripts/check-migration-release-lane.sh "$version" shared "$migration"
          if bash scripts/validate-production-schema-clone.sh --migration-version "$version" --release-lane shared --candidate-migration "$migration" --roles-dump "$d/roles.sql" --schema-dump "$d/schema.sql" --artifacts-dir "$d/diagnostics" >"$d/run.log" 2>&1; then
            test "$(cat "$d/diagnostics/title-signed-receipt.txt")" = 'PASS independent local signed title proof'
            echo 'PASS signed original title, concurrent edit and immutable edition proof'
          else
            # Emit only a closed set of fixed labels, never log/schema contents.
            python3 - "$d/diagnostics" <<'PY'
          import re,sys
          from pathlib import Path
          d=Path(sys.argv[1])
          summary=d/'summary.md'
          s=summary.read_text(errors='replace') if summary.is_file() else ''
          phases={
              'preflight':'preflight',
              'release-lane custody check':'release-lane',
              'schema dump sanitation':'schema-sanitation',
              'disposable database startup':'local-startup',
              'production custom-role restore':'role-restore',
              'production user-schema restore':'schema-restore',
              'baseline domain schema lint':'baseline-lint',
              'candidate migration application':'candidate-transaction',
              'candidate migration postconditions':'postconditions',
              'signed local original title changes and sealed edition custody':'signed-title',
              'candidate domain schema lint':'candidate-lint',
              'candidate lint delta comparison':'lint-delta',
              'local database advisors':'advisors',
          }
          names=re.findall(r'\*\*FAILED during ([^\n]+?)\.\*\*|Validation command exited during `([^`\n]+)`\.',s)
          phase=phases.get(next((a or b for a,b in reversed(names)),''),'unclassified')
          print('TITLE_PROOF_FAILURE_STAGE='+phase)
          logs={
              'local-startup':sorted(d.glob('disposable-database-startup-attempt-*.log')),
              'candidate-transaction':[d/'candidate-migration.log'],
              'signed-title':[d/'title-signed-local.log'],
          }.get(phase,[])
          raw='\n'.join(p.read_text(errors='replace')[-200000:] for p in logs if p.is_file())
          labels=(
              ('registry-throttle',r'(?i)toomanyrequests|rate limit|429 Too Many Requests'),
              ('container-health',r'(?i)unhealthy|health check failed|failed to start'),
              ('connection',r'(?i)connection refused|connection timed out'),
              ('signed-auth',r'Local GoTrue password sign-in failed|signed user mismatch|persisted separate session required'),
              ('signed-grant',r'AssertionError: (?:first author access|second author access|outsider no grant)'),
              ('issued-edition',r'AssertionError: (?:exact issued title and body before rename|sealed curriculum unchanged|issued Unit remains exact|concurrent title changes preserve edition)'),
              ('conflict',r'AssertionError: (?:one concurrent winner and one stale conflict|one concurrent revision)'),
              ('replay',r'AssertionError: (?:replay exact|old receipt plus current read|founding creation retry|founding Unit retry)'),
              ('authorization',r'AssertionError: (?:TITLE_DENIAL_V1|expected exact title source denial|private table/RPC ACL|no write on revoked grant)'),
              ('rpc',r'AssertionError: .*expected HTTP'),
              ('sql',r'(?i)\bERROR:'),
              ('assertion',r'AssertionError:'),
          )
          print('TITLE_PROOF_FAILURE_CLASS='+next((name for name,pat in labels if re.search(pat,raw)),'unclassified'))
          if phase=='signed-title':
              cases={133:'other-author-save',134:'outsider-read',135:'foreign-unit-read',136:'foreign-unit-save',137:'empty-title',138:'control-character-title',142:'changed-replay',143:'stale-revision',148:'cross-object-replay',170:'effective-rpc-table-acl',173:'revoked-author-save',174:'revoked-title-read'}
              lines=re.findall(r'File "[^"\n]*validate-titus-object-title-signed-http[.]py", line ([0-9]+), in main',raw)
              case=cases.get(int(lines[-1]),'unclassified') if lines else 'unclassified'
              print('TITLE_PROOF_FAILURE_CASE='+case)
              codes=r'(42501|22023|23505|40001|55000|PGRST202|PGRST203|PGRST301|PGRST302|PGRST204|PGRST205|other)'
              detail=re.findall(r'^AssertionError: TITLE_DENIAL_V1 expected='+codes+r' observed='+codes+r' http=([1-5][0-9]{2}|other)$',raw,re.M)
              if detail:
                  expected,observed,http=detail[-1]
                  print('TITLE_PROOF_DENIAL_CODES='+expected+'/'+observed+'/'+http)
          PY
            echo 'FAIL protected signed title proof; private diagnostics not published' >&2
            exit 1
          fi
      - name: Remove private scratch and record bounded outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/title-proof-private"
          echo 'Title proof is disposable schema-only; no hosted DDL/DML, real users, grant, release or publication.' >> "$GITHUB_STEP_SUMMARY"

  validate-owner-protected:
    concurrency:
      group: titus-t5-owner-protected-signed-study
      cancel-in-progress: false
    if: >-
      github.event_name == 'issues' &&
      github.repository == 'optical-lift/noel-core-db' &&
      github.ref == 'refs/heads/main' &&
      github.event.issue.state == 'open' &&
      github.event.issue.author_association == 'OWNER' &&
      github.actor == github.repository_owner &&
      github.event.issue.title == 'HELD Titus T5 protected signed study validation request'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 45
    steps:
      - name: Resolve exact owner-selected held scope
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          fields={}
          for raw in os.environ.get('ISSUE_BODY','').splitlines():
              if not raw.strip(): continue
              m=re.fullmatch(r'([a-z_]+):\s*([a-zA-Z0-9_-]+)\s*',raw)
              if not m: raise SystemExit('unexpected owner request content')
              k,v=m.groups()
              if k in fields: raise SystemExit('duplicate owner request field')
              fields[k]=v
          if set(fields)!=set(('candidate_sha','titus_sha','test_scope','production_target')):
              raise SystemExit('exact four-field T5 request required')
          if fields['candidate_sha']!='e71fc75d37a047ec52ebbace72fb7698fec00284' or fields['titus_sha']!='4150cf7b83ef6ed3a50b9a78502889dc818b2005':
              raise SystemExit('only reviewed immutable T5 heads allowed')
          if fields['test_scope']!='titus_t5_protected_signed_study_test_only_v1' or fields['production_target']!='zirqkouammpwxlqfbsvf':
              raise SystemExit('wrong read-only schema target or scope')
          print('PASS exact owner-selected T5 schema-only scope')
          PY
      - name: Checkout canonical validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: canonical
          persist-credentials: false
      - name: Verify exact frozen drafts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/2617" --jq '[.state,(.draft|tostring),.head.ref,.head.sha]|join("|")')" = "open|true|candidate/shared-course-unification-clean-cutover-v1-20261107|e71fc75d37a047ec52ebbace72fb7698fec00284"
          echo 'PASS exact frozen Noel draft'
          cd canonical
          bash scripts/check-custody.sh
          bash scripts/check-production-release-contract.sh
          bash scripts/check-production-schema-validation-contract.sh
          bash -n scripts/validate-production-schema-clone.sh
      - name: Verify exact private Titus draft with existing read-only PR credential
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TITUS_PR_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo 'BLOCKED: existing protected Titus read-only PR credential is not configured' >&2
            exit 1
          fi
          test "$(gh api "repos/optical-lift/titus/pulls/72" --jq '[.state,(.draft|tostring),.head.ref,.head.sha]|join("|")')" = "open|true|work/titus-unified-manuscript-surface-20261106|4150cf7b83ef6ed3a50b9a78502889dc818b2005"
          echo 'PASS exact frozen private Titus draft'
      - name: Install pinned CLI
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/supabase/cli/releases/download/v2.116.0/supabase_linux_amd64.tar.gz -o "$RUNNER_TEMP/t5-cli.tgz"
          tar -xzf "$RUNNER_TEMP/t5-cli.tgz" -C "$RUNNER_TEMP" supabase
          sudo install -m 0755 "$RUNNER_TEMP/supabase" /usr/local/bin/supabase
          test "$(supabase --version | tail -n1)" = '2.116.0'
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin >/dev/null
      - name: Snapshot production schema/roles READ ONLY
        shell: bash
        env:
          NOEL_CORE_DATABASE_URL: ${{ secrets.NOEL_CORE_DATABASE_URL }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$NOEL_CORE_DATABASE_URL"
          mkdir "$RUNNER_TEMP/t5-private"
          supabase db dump --db-url "$NOEL_CORE_DATABASE_URL" --role-only --file "$RUNNER_TEMP/t5-private/roles.sql" >"$RUNNER_TEMP/t5-private/roles.log" 2>&1
          supabase db dump --db-url "$NOEL_CORE_DATABASE_URL" --file "$RUNNER_TEMP/t5-private/schema.sql" >"$RUNNER_TEMP/t5-private/schema.log" 2>&1
          test -s "$RUNNER_TEMP/t5-private/roles.sql"
          test -s "$RUNNER_TEMP/t5-private/schema.sql"
          echo 'PASS read-only schema/role snapshot; no records'
      - name: Checkout exact reviewed teaching source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e71fc75d37a047ec52ebbace72fb7698fec00284
          path: held
          persist-credentials: false
      - name: Assemble exact scratch source
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git -C held rev-parse HEAD)" = 'e71fc75d37a047ec52ebbace72fb7698fec00284'
          test "$(git -C held hash-object scripts/prepare-titus-t5-protected-clone-source.py)" = '70e1c1ae842ff5a3768a29348a11b206d42b3e7c'
          python3 -m unittest discover -s held/tests -p test_titus_u1_protected_bundle_safety.py -v >"$RUNNER_TEMP/t5-private/source-check.log" 2>&1
          python3 held/scripts/prepare-titus-t5-protected-clone-source.py --source-root held --expected-sha 'e71fc75d37a047ec52ebbace72fb7698fec00284' --test-scope titus_t5_protected_source_shape_test_only_v1 --output "$RUNNER_TEMP/t5-private/20261119100000_shared_titus_t5_teaching_TEST_ONLY.sql" --manifest "$RUNNER_TEMP/t5-private/package.json"
      - name: Disposable rollback-only teaching schema check
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/t5-private"
          if bash canonical/scripts/validate-production-schema-clone.sh --migration-version 20261119100000 --release-lane shared --t5-rollback-shape --t5-signed-study --candidate-migration "$d/20261119100000_shared_titus_t5_teaching_TEST_ONLY.sql" --roles-dump "$d/roles.sql" --schema-dump "$d/schema.sql" --artifacts-dir "$d/diagnostics" >"$d/run.log" 2>&1; then
            echo 'PASS protected teaching schema and independent signed fictional study'
          else
            echo 'FAIL protected signed teaching proof; raw schema/diagnostics not published' >&2
            exit 1
          fi
      - name: Report bounded result and remove private scratch
        if: always()
        shell: bash
        run: |
