name: Titus Formation Custody

on:
  pull_request:
    paths:
      - 'supabase/migrations/*titus*.sql'
      - 'architecture/TITUS_FORMATION_*.md'
      - 'schemas/OWNERSHIP.md'
      - 'custody/executed-statement-body-reconciliations-titus-formation-v1.json'
      - 'custody/live-custody-reconciliation-policy-v1.json'
      - 'scripts/check-titus-formation-custody.sh'
      - '.github/workflows/titus-formation-custody.yml'
  push:
    branches:
      - 'titus-formation-*'
      - 'work/titus-*'
      - 'recovery/titus-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  custody:
    runs-on: ubuntu-latest
    env:
      NOEL_CORE_SUPABASE_URL: https://zirqkouammpwxlqfbsvf.supabase.co
      NOEL_CORE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_3UCb5b3USJD24c2uX6B_4A_0XWDT6si
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Titus Formation source and live custody
        run: bash scripts/check-titus-formation-custody.sh
