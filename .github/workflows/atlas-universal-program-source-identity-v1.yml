name: Universal Program author source identity proof
on:
  pull_request:
    paths:
      - "candidates/atlas-universal-program-source-identity-v1/**"
      - "validation/atlas-universal-program-source-identity-v1/**"
      - ".github/workflows/atlas-universal-program-source-identity-v1.yml"
permissions:
  contents: read
jobs:
  source-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        pg: ['16','17']
    services:
      postgres:
        image: postgres:${{ matrix.pg }}-alpine
        env:
          POSTGRES_PASSWORD: synthetic-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and test one-store Program source identity
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f validation/atlas-personal-training-author-v1/fixture-schema.sql
          psql -X -v ON_ERROR_STOP=1 -f candidates/atlas-personal-training-author-v1/candidate.sql
          psql -X -v ON_ERROR_STOP=1 -f candidates/atlas-universal-program-author-v2/candidate.sql
          psql -X -v ON_ERROR_STOP=1 -f candidates/atlas-universal-program-source-identity-v1/candidate.sql
          psql -X -v ON_ERROR_STOP=1 -f candidates/atlas-universal-program-source-identity-v1/postconditions.sql
          psql -X -v ON_ERROR_STOP=1 -f validation/atlas-universal-program-source-identity-v1/test-source-identity.sql
          psql -X -v ON_ERROR_STOP=1 -f validation/atlas-universal-program-source-identity-v1/test-negative-access.sql
      - name: Verify free signed clone bridge syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/validate-atlas-program-source-identity-signed-http.py
          bash -n scripts/validate-production-schema-clone.sh
          grep -q 'signed_program_source_identity_probe=true' scripts/validate-production-schema-clone.sh
          grep -q 'validate-atlas-program-source-identity-signed-http.py' scripts/validate-production-schema-clone.sh
