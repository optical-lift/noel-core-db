name: Generate Atlas correspondence identity migration

on:
  push:
    branches:
      - feature/atlas-correspondence-identity-v1
    paths:
      - .github/workflows/generate-atlas-correspondence-identity-migration.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Generate canonical migration identity with pinned Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.116.0 migration new atlas_correspondence_identity_v1
          git status --short supabase/migrations
      - name: Commit generated identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "optical-lift"
          git config user.email "gleamingbrook@gmail.com"
          git add supabase/migrations
          git commit -m "Generate Atlas correspondence identity migration identity"
          git push origin HEAD:${GITHUB_REF_NAME}
