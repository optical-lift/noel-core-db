name: Atlas personal task amendment protected premerge signed clone
on:
  issues:
    types: [opened, edited, reopened]
  pull_request:
    paths:
      - ".github/workflows/atlas-personal-task-amendment-premerge-clone.yml"
      - "scripts/validate-atlas-personal-task-amendment-signed-http.py"
permissions:
  contents: read
  packages: read
concurrency:
  group: atlas-personal-amendment-signed-premerge
  cancel-in-progress: false
jobs:
  source-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check local-only source
        run: |
          set -euo pipefail
          bash -n scripts/validate-production-schema-clone.sh
          # The trusted workflow-only PR must not be forced to merge an
          # unvalidated candidate script. The candidate PR executes both.
          if test -f scripts/validate-atlas-personal-task-amendment-signed-http.py; then
            python3 -m py_compile scripts/validate-atlas-personal-task-amendment-signed-http.py
            node --test tests/atlas-personal-task-text-date-amendment-source.test.mjs
          fi
          ruby -r yaml -e 'YAML.load_file(".github/workflows/atlas-personal-task-amendment-premerge-clone.yml")'
  validate:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.state == 'open' &&
      github.event.issue.author_association == 'OWNER' &&
      github.actor == github.repository_owner &&
      github.event.issue.title == 'Atlas personal Task amendment: protected premerge signed clone gate'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 50
    steps:
      - name: Capture immutable owner candidate
        id: source
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          found=re.findall(r'^candidate_sha:\s*([0-9a-f]{40})\s*$',os.environ.get('ISSUE_BODY',''),re.M)
          if len(found)!=1: raise SystemExit('Exactly one owner candidate_sha required')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('sha='+found[0]+'\n')
          PY
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify main custody
        run: |
          set -euo pipefail
          bash scripts/check-custody.sh
          bash scripts/check-production-release-contract.sh
          bash scripts/check-production-schema-validation-contract.sh
      - name: Install pinned Supabase CLI
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/supabase/cli/releases/download/v2.116.0/supabase_linux_amd64.tar.gz -o /tmp/supabase.tgz
          tar -xzf /tmp/supabase.tgz -C /tmp supabase
          sudo install -m 0755 /tmp/supabase /usr/local/bin/supabase
          test "$(supabase --version | tail -n1)" = "2.116.0"
      - name: Authenticate local container pulls
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
      - name: Snapshot production roles and schema READ ONLY
        env:
          NOEL_CORE_DATABASE_URL: ${{ secrets.NOEL_CORE_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$NOEL_CORE_DATABASE_URL"
          supabase db dump --db-url "$NOEL_CORE_DATABASE_URL" --role-only --file "$RUNNER_TEMP/amend-roles.sql"
          supabase db dump --db-url "$NOEL_CORE_DATABASE_URL" --file "$RUNNER_TEMP/amend-schema.sql"
          test -s "$RUNNER_TEMP/amend-roles.sql"
          test -s "$RUNNER_TEMP/amend-schema.sql"
      - name: Checkout immutable private-safe source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: candidate
          persist-credentials: false
      - name: Verify exact source, after no database secrets remain
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_SHA"
          for f in candidate/candidates/atlas_personal_task_text_date_amendment_v1/candidate.sql candidate/candidates/atlas_personal_task_text_date_amendment_v1/postconditions.sql candidate/validation/fixtures/atlas_personal_task_amendment_signed_clone_extra_v1.sql candidate/scripts/validate-atlas-personal-task-amendment-signed-http.py; do test -s "$f"; done
          bash -n candidate/scripts/validate-production-schema-clone.sh
          python3 -m py_compile candidate/scripts/validate-atlas-personal-task-amendment-signed-http.py
      - name: Generate disposable scratch migration with Supabase CLI
        id: scratch
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/personal-amend-scratch"
          mkdir -p "$scratch"
          (cd "$scratch"; supabase init --force; supabase migration new atlas_personal_task_amendment_signed_clone_only_v1)
          file="$(find "$scratch/supabase/migrations" -maxdepth 1 -name '*_atlas_personal_task_amendment_signed_clone_only_v1.sql' | head -n1)"
          test -n "$file"
          cp candidate/candidates/atlas_personal_task_text_date_amendment_v1/candidate.sql "$file"
          cat candidates/atlas_work_self_assignment_native_v1/fixture.sql candidate/validation/fixtures/atlas_personal_task_amendment_signed_clone_extra_v1.sql > "$scratch/fixture.sql"
          cp candidate/candidates/atlas_personal_task_text_date_amendment_v1/postconditions.sql "$scratch/postconditions.sql"
          echo "migration=$file" >> "$GITHUB_OUTPUT"
          echo "version=$(basename "$file" | cut -d_ -f1)" >> "$GITHUB_OUTPUT"
          echo "fixture=$scratch/fixture.sql" >> "$GITHUB_OUTPUT"
          echo "postconditions=$scratch/postconditions.sql" >> "$GITHUB_OUTPUT"
      - name: Run genuine local GoTrue and PostgREST on disposable clone
        run: |
          set -euo pipefail
          bash candidate/scripts/validate-production-schema-clone.sh \
            --migration-version "${{ steps.scratch.outputs.version }}" \
            --release-lane atlas \
            --candidate-migration "${{ steps.scratch.outputs.migration }}" \
            --candidate-fixture "${{ steps.scratch.outputs.fixture }}" \
            --candidate-validation "${{ steps.scratch.outputs.postconditions }}" \
            --roles-dump "$RUNNER_TEMP/amend-roles.sql" \
            --schema-dump "$RUNNER_TEMP/amend-schema.sql" \
            --artifacts-dir "$RUNNER_TEMP/amend-clone-artifacts"
          test -s "$RUNNER_TEMP/amend-clone-artifacts/signed-personal-task-amendment-summary.txt"
          grep -q '^PASS' "$RUNNER_TEMP/amend-clone-artifacts/signed-personal-task-amendment-summary.txt"
      - name: Record non-sensitive verdict
        if: always()
        run: |
          if test -s "$RUNNER_TEMP/amend-clone-artifacts/summary.md"; then
            cat "$RUNNER_TEMP/amend-clone-artifacts/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Local signed clone did not pass' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve diagnostic logs, never production snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-personal-amendment-signed-clone
          path: ${{ runner.temp }}/amend-clone-artifacts
          if-no-files-found: ignore
          retention-days: 14
