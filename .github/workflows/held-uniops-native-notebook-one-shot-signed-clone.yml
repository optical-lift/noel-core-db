              r'(?m)^ATLAS_CI_BROWSER_FAILURE_STAGE=(environment_contract|atlas_source_integrity|fictional_actor_fixture|accepted_work_selection|local_api_configuration|browser_source_contract|package_install|chromium_install|next_server_ready|governor_readback_or_browser_start|outsider_denial|browser_acceptance_marker|runner_contract|governor_signin|outsider_signin|chromium_launch|governor_page|governor_navigation|governor_banner|governor_headings|governor_organization|governor_ledger|governor_work|governor_submit|governor_hydration_readiness|governor_form_reset|governor_button_disabled|governor_submit_click|governor_done|governor_no_terminal_ui|governor_source_error|governor_work_unavailable|governor_work_without_verified_done|governor_work_without_done_indicator|governor_snapshot_without_work_state|outsider_page)$',
              '\n'.join(browser_lines))
          if browser_ok:
              browser_stage='none'
          elif len(browser_stages)==1:
              browser_stage=browser_stages[0]
          elif len(browser_stages)>1:
              browser_stage='ambiguous'
          else:
              browser_stage='not_reported'
          print('ATLAS_CI_BROWSER_READBACK='+('PASS' if browser_ok else 'NOT_VERIFIED'))
          print('ATLAS_CI_BROWSER_FAILURE_STAGE='+browser_stage)
          print('UNI_OPS_SIGNED_POST_RESULT_6A=NOT_RUN')
          print('UNI_OPS_PRODUCTION_MUTATION=NONE')
          print('UNI_OPS_PAID_BRANCH=NONE')
          PY
      - name: Delete private test-only schema, role snapshot, source and logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- "$RUNNER_TEMP/uniops-snapshot-schema.sql" "$RUNNER_TEMP/uniops-snapshot-roles.sql"
          rm -f -- "$RUNNER_TEMP/uniops-private-clone.log" "$RUNNER_TEMP/uniops-manifest.json"
          rm -f -- "$RUNNER_TEMP/validate-uniops-p3-historical-signed-local-only.py"
          rm -f -- "$RUNNER_TEMP/20261107211000_atlas_uni_ops_a_history_DISPOSABLE_ONLY.sql" "$RUNNER_TEMP/20261107211000_atlas_uni_ops_p3_6a_TEST_ONLY.sql"
          rm -f -- "$RUNNER_TEMP/UNI_OPS_A_FULL_HISTORY_${GITHUB_RUN_ID}_TEST_ONLY.sql"
          case "${UNI_OPS_PIN_ROOT:-}" in
            "$RUNNER_TEMP"/uniops-full-clone.*) rm -rf -- "$UNI_OPS_PIN_ROOT" ;;
          esac
          if [[ -d "$RUNNER_TEMP/uniops-private-diagnostics" && ! -L "$RUNNER_TEMP/uniops-private-diagnostics" ]]; then
            rm -rf -- "$RUNNER_TEMP/uniops-private-diagnostics"
          fi
          echo 'PASS no schema dump, role dump or diagnostic artifact retained/uploaded'
