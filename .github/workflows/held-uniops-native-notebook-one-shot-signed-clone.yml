          test "$(git hash-object tests/test_uniops_p3_history_signed_followon_held.py)" = 51db89390727e74fea0efe5a438c8d6a73fe9bbf
          test "$(git hash-object tests/uniops_p3_history_existing_membership_seed_held.py)" = 7bcd3719aeea3e150770fe4bb4172416a815a38c
          test "$(git hash-object tests/test_uniops_p3_history_existing_membership_seed_held.py)" = 8e2aab33ce2ebc69c36eee2abd8979881fdbce84
          python3 tests/test_uniops_p3_history_existing_membership_seed_held.py --companion history-source-contract/tests/validate-atlas-native-historical-retirement-signed-http.py
