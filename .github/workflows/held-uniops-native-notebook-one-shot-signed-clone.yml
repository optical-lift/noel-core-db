      - 'tests/test_correct_uniops_p3_6a_postcondition_deppath_held.py'
      - 'tests/prepare_uniops_p3_history_signed_followon_held.py'
      - 'tests/uniops_p3_historical_preservation_check_held.py'
      - 'tests/test_uniops_p3_history_signed_followon_held.py'
      - 'tests/uniops_p3_history_existing_membership_seed_held.py'
      - 'tests/test_uniops_p3_history_existing_membership_seed_held.py'
      - 'tests/uniops_p3_history_safe_python_failure_held.py'
      - 'tests/test_uniops_p3_history_safe_python_failure_held.py'
      - 'tests/uniops_historical_retirement_signed_bridge_held.py'
      - 'tests/test_uniops_historical_retirement_signed_bridge_held.py'
      - 'tests/prepare_uniops_historical_retirement_signed_followon_held.py'
      - 'tests/test_prepare_uniops_historical_retirement_signed_followon_held.py'
      - 'tests/append_uniops_history_http409_disposable_held.py'
      - 'tests/test_uniops_history_http409_overlay_source_only.py'
      - 'tests/test_uniops_history_stale_409_source_only.py'
