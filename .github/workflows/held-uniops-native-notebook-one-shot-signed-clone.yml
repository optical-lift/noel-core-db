    types: [edited]
  pull_request:
    paths:
      - '.github/workflows/held-uniops-native-notebook-one-shot-signed-clone.yml'
      - 'tests/uniops-option-a-first-mowing-signed-fixture.sql'
      - 'tests/validate-uniops-option-a-u2-accepted-first-signed.py'
      - 'tests/uniops_u2_namefree_guard_owner.py'
      - 'tests/test_uniops_u2_namefree_guard_owner.py'
      - 'tests/uniops_u2_local_stack_evidence.py'
      - 'tests/test_uniops_u2_local_stack_evidence.py'
      - 'tests/prepare_reviewed_uniops_u2c_context_scratch.py'
