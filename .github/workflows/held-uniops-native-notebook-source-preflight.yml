name: HELD UNI-OPS native Notebook Result allocation source preflight (no database)

on:
  pull_request:
    paths:
      - ".github/workflows/held-uniops-native-notebook-source-preflight.yml"
      - "candidates/atlas_uniops_governor_result_allocation_v1/**"
      - "tests/atlas_uniops_governor_result_allocation_source.test.mjs"
      - "tests/prepare_uniops_native_worker_actual_hook_held.py"
      - "tests/test_prepare_uniops_native_worker_actual_hook_source.py"
      - "tests/run-uniops-native-worker-actual-local.sh"

permissions:
  contents: read

jobs:
  source-only:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout original signed U4 test source for exact offline patch test
        uses: actions/checkout@v4
        with:
          ref: 075919564dc340ad86be8e969a2ad2d02ec19a15
          path: frozen-u4
          persist-credentials: false
      - name: Validate native worker browser replacement preserves U4 negatives and retry
        shell: bash
        env:
          FROZEN_U4_SOURCE: frozen-u4/tests/uniops_u2_qualified_actual_followon_held.py
        run: |
          set -euo pipefail
          test "$(git -C frozen-u4 rev-parse HEAD)" = 075919564dc340ad86be8e969a2ad2d02ec19a15
          test "$(git -C frozen-u4 hash-object tests/uniops_u2_qualified_actual_followon_held.py)" = 2e180aa2363201e75ca0d717eeeddd5a708193ab
          python3 -m py_compile tests/prepare_uniops_native_worker_actual_hook_held.py tests/test_prepare_uniops_native_worker_actual_hook_source.py
          python3 -m unittest discover -s tests -p 'test_prepare_uniops_native_worker_actual_hook_source.py' -v
          python3 tests/prepare_uniops_native_worker_actual_hook_held.py             --source "$FROZEN_U4_SOURCE"             --output "$RUNNER_TEMP/uniops_u2_qualified_actual_browser_local_only.py"
          python3 -m py_compile "$RUNNER_TEMP/uniops_u2_qualified_actual_browser_local_only.py"
          bash -n tests/run-uniops-native-worker-actual-local.sh
          echo 'PASS exact immutable U4 negatives, same-action replay and browser-only positive hook; NOT RUN'
      - name: Node synthetic exact Work/Result/reporter source negatives
        run: node --test tests/atlas_uniops_governor_result_allocation_source.test.mjs
      - name: PostgreSQL top-level SQL syntax only; never install
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pglast==8.7
          python3 - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          p=Path('candidates/atlas_uniops_governor_result_allocation_v1/candidate.sql')
          sql=p.read_text(encoding='utf-8')
          assert sql.count('CREATE OR REPLACE FUNCTION atlas.company_work_accountability_native_ledger_self_api_v1(')==1
          assert '302be9714957f5bf76d665092c9609b1' in sql
          assert 'company_work_native_ledger_owner_self_v1' in sql
          assert "'reportAllocation',CASE" in sql
          assert "'recordedReporterMatchesAllocation'," in sql
          assert "report_allocation.id=lr.responsible_allocation_id" in sql
          assert "report_allocation.work_item_id=w.id" in sql
          assert "report_allocation.organization_id=w.organization_id" in sql
          assert "lr.metadata->>'authenticatedReporterPersonId'" in sql
          assert "lr.reported_by_user_id IS NOT NULL" in sql
          assert 'CREATE POLICY' not in sql and 'GRANT EXECUTE' not in sql
          statements=parse_sql(sql)
          assert len(statements)==2, 'Guard DO and one CREATE OR REPLACE FUNCTION only'
          print('PASS held owner projection SQL top-level grammar and source custody')
          print('HELD_PLPGSQL_BODY_COMPILE=NOT_RUN')
          print('HELD_SIGNED_GOTRUE_BROWSER=NOT_RUN')
          print('HELD_PRODUCTION_CHANGE=NONE')
          PY
