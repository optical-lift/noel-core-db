name: Temporary Supabase migration identity generator

on:
  push:
    branches:
      - feat/provider-connection-activation-current-canon-v1

permissions:
  contents: write

jobs:
  generate:
    if: "!contains(github.event.head_commit.message, '[migration-generated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/provider-connection-activation-current-canon-v1
          fetch-depth: 0
      - name: Install repository-pinned Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/supabase/cli/releases/download/v2.116.0/supabase_linux_amd64.tar.gz -o /tmp/supabase.tgz
          tar -xzf /tmp/supabase.tgz -C /tmp supabase
          sudo install -m 0755 /tmp/supabase /usr/local/bin/supabase
          test "$(supabase --version | tail -n 1)" = "2.116.0"
      - name: Generate canonical migration identity
        shell: bash
        run: |
          set -euo pipefail
          supabase migration new atlas_provider_connection_activation_current_canon_v1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git commit -m "Generate provider connection activation migration [migration-generated]"
          git push origin HEAD:feat/provider-connection-activation-current-canon-v1
