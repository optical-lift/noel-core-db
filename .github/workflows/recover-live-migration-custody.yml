name: Recover Live Migration Custody

on:
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: noel-core-live-custody-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.event.issue.user.login == 'optical-lift' &&
      github.event.issue.title == 'Custody recovery: 20260907-v2 live post-fence rows' &&
      contains(github.event.issue.body, 'custody_recovery: 20260907-v2')
    runs-on: ubuntu-latest
    environment: production
    env:
      NOEL_CORE_DATABASE_URL: ${{ secrets.NOEL_CORE_DATABASE_URL }}
      NOEL_CORE_SUPABASE_URL: https://zirqkouammpwxlqfbsvf.supabase.co
      NOEL_CORE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_3UCb5b3USJD24c2uX6B_4A_0XWDT6si
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Confirm guarded recovery trigger
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NOEL_CORE_DATABASE_URL:-}"
          test "${GITHUB_REF}" = "refs/heads/main"

      - name: Recover and verify exact production bytes
        shell: bash
        run: bash scripts/recover-live-migration-custody-v2.sh

      - name: Publish exact-byte recovery branch
        shell: bash
        run: |
          set -euo pipefail
          branch='custody-recovery-20260907'
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::error::Recovery branch already exists; refusing to overwrite it."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add supabase/migrations custody/post-fence-migration-recoveries-v17.json scripts/check-custody.sh
          git diff --cached --check
          git commit -m 'Recover exact live post-fence migration custody'
          git push origin "HEAD:refs/heads/$branch"
