name: Validate Money Collection on Local Supabase

on:
  push:
    branches:
      - design/money-collection-kernel-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: design/money-collection-kernel-v1

      - name: Install pinned Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/supabase/cli/releases/download/v2.116.0/supabase_linux_amd64.tar.gz -o /tmp/supabase.tgz
          tar -xzf /tmp/supabase.tgz -C /tmp supabase
          sudo install -m 0755 /tmp/supabase /usr/local/bin/supabase
          supabase --version

      - name: Initialize disposable local project
        shell: bash
        run: |
          set -euo pipefail
          supabase init --force

      - name: Start disposable local database
        shell: bash
        run: |
          set -euo pipefail
          supabase db start

      - name: Replay complete canonical migration history
        shell: bash
        run: |
          set -euo pipefail
          supabase db reset --local --no-seed

      - name: Verify Money Collection postconditions
        shell: bash
        env:
          POSTCONDITION_SQL_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$POSTCONDITION_SQL_B64" | base64 --decode | psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1

      - name: Lint migrated Atlas schema
        shell: bash
        run: |
          set -euo pipefail
          supabase db lint --local --schema atlas --level error --fail-on error

      - name: Discover and run local advisors when supported
        shell: bash
        run: |
          set -euo pipefail
          help="$(supabase db advisors --help 2>&1 || true)"
          printf '%s\n' "$help"
          if printf '%s\n' "$help" | grep -q -- '--local'; then
            supabase db advisors --local
          else
            echo 'This pinned CLI does not expose local db advisors; local execution + plpgsql_check lint completed.'
          fi

      - name: Stop disposable local database
        if: always()
        shell: bash
        run: supabase stop --no-backup || true
