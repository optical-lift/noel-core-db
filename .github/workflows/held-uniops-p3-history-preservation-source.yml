name: HELD UNI-OPS P3 signed historical cancellation conservation (source-only)
on:
  pull_request:
    paths:
      - '.github/workflows/held-uniops-p3-history-preservation-source.yml'
      - 'tests/uniops_p3_historical_preservation_check_held.py'
      - 'tests/prepare_uniops_p3_history_signed_followon_held.py'
      - 'tests/test_uniops_p3_history_signed_followon_held.py'
      - 'tests/uniops_p3_history_existing_membership_seed_held.py'
      - 'tests/test_uniops_p3_history_existing_membership_seed_held.py'
      - 'tests/uniops_p3_history_safe_python_failure_held.py'
      - 'tests/test_uniops_p3_history_safe_python_failure_held.py'
permissions:
  contents: read
jobs:
  source-only:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout IMMUTABLE U2 driver with U4 opt-in, no execution
        uses: actions/checkout@v4
        with:
          ref: 075919564dc340ad86be8e969a2ad2d02ec19a15
          path: signed-u2-u4-source
          persist-credentials: false
      - name: Checkout IMMUTABLE governor history companion, no execution
        uses: actions/checkout@v4
        with:
          ref: ddfb0bf5374798301fe076a61d2b944dfb52ff63
          path: signed-history-source
          persist-credentials: false
      - name: Checkout IMMUTABLE passing P3 snapshot source, no execution
        uses: actions/checkout@v4
        with:
          ref: 7f4fc633c0d36daa005f0f7e2a85f0743f23ef1e
          path: signed-p3-source
          persist-credentials: false
      - name: Pin original actor sources, verify conservation and composition, NO signed runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C signed-u2-u4-source rev-parse HEAD)" = 075919564dc340ad86be8e969a2ad2d02ec19a15
          test "$(git -C signed-history-source rev-parse HEAD)" = ddfb0bf5374798301fe076a61d2b944dfb52ff63
          test "$(git -C signed-p3-source rev-parse HEAD)" = 7f4fc633c0d36daa005f0f7e2a85f0743f23ef1e
          test "$(git -C signed-u2-u4-source hash-object tests/validate-uniops-option-a-u2-accepted-first-signed.py)" = 09eeee925ebfa2cb64b1dea336688ba8076ef44d
          test "$(git hash-object tests/uniops_historical_retirement_signed_bridge_held.py)" = f1a4eadb4d0199e8b4d9c1f17738675c281e249d
          test "$(git hash-object tests/prepare_uniops_historical_retirement_signed_followon_held.py)" = 6ff245eb3c2c3ce007b0a0a59e1d382d7ae0d519
          test "$(git -C signed-history-source hash-object tests/validate-atlas-native-historical-retirement-signed-http.py)" = 79151f723e60b33410c760acef715155a53771f3
          test "$(git -C signed-p3-source hash-object candidates/uni_ops_p3_no_auto_successor_v1/23_signed_p3_snapshot_hook_held.py)" = 4efef70ea67209b04def420aade39b8a6fd44f38
          test "$(git hash-object tests/uniops_p3_historical_preservation_check_held.py)" = a0ab7523f10e9b79d3290871fd5faac777e6e733
          test "$(git hash-object tests/prepare_uniops_p3_history_signed_followon_held.py)" = 50995f14e619ed7f6c6e4a78c6a7e86489aa714f
          test "$(git hash-object tests/test_uniops_p3_history_signed_followon_held.py)" = ec216f446a251350e833d84909b4bcd8ba914490
          test "$(git hash-object tests/uniops_p3_history_existing_membership_seed_held.py)" = 2a5154d3cd8546f4f510dde4688a638d6cfc5ff1
          test "$(git hash-object tests/test_uniops_p3_history_existing_membership_seed_held.py)" = 980fec57212324e7cdf5db31662d3fcec784bc53
          python3 -m py_compile tests/uniops_p3_historical_preservation_check_held.py tests/prepare_uniops_p3_history_signed_followon_held.py tests/test_uniops_p3_history_signed_followon_held.py tests/uniops_p3_history_existing_membership_seed_held.py tests/test_uniops_p3_history_existing_membership_seed_held.py
          python3 tests/test_uniops_p3_history_existing_membership_seed_held.py --companion signed-history-source/tests/validate-atlas-native-historical-retirement-signed-http.py
          test "$(git hash-object tests/uniops_p3_history_safe_python_failure_held.py)" = e217dae8117d84fc3ce9d63105e17e51ef7cf11a
          test "$(git hash-object tests/test_uniops_p3_history_safe_python_failure_held.py)" = 5cdd60a80edf6c22cd598e630b452e73fa165e13
          python3 -m unittest discover -s tests -p 'test_uniops_p3_history_safe_python_failure_held.py' -v
          python3 tests/test_uniops_p3_history_signed_followon_held.py \
            --driver signed-u2-u4-source/tests/validate-uniops-option-a-u2-accepted-first-signed.py \
            --bridge tests/uniops_historical_retirement_signed_bridge_held.py \
            --companion signed-history-source/tests/validate-atlas-native-historical-retirement-signed-http.py \
            --p3-hook signed-p3-source/candidates/uni_ops_p3_no_auto_successor_v1/23_signed_p3_snapshot_hook_held.py
          echo 'PASS source-only P3 mowing conservation across distinct old Work cancellation; no historical actor executed'
