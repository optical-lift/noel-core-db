name: Titus first original Course material — isolated hosted PG17

on:
  push:
    branches:
      - candidate/titus-first-draft-material-20261104
    paths:
      - 'candidates/titus-first-draft-material-v1/**'
      - 'scripts/test-titus-first-material-riversong-pg17.sh'
      - 'scripts/test-titus-first-material-hosted-pg17.sh'
      - '.github/workflows/titus-first-draft-material-pg17-riversong.yml'

permissions:
  contents: read

concurrency:
  group: titus-first-draft-material-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'optical-lift/noel-core-db' && github.ref == 'refs/heads/candidate/titus-first-draft-material-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Exact revision into job-owned isolated directory
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REPOSITORY}" == "optical-lift/noel-core-db" ]]
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          workspace="$(mktemp -d "${RUNNER_TEMP:?}/titus-first-material.XXXXXXXX")"
          echo "TITUS_MATERIAL_WORKSPACE=$workspace" >> "$GITHUB_ENV"
          git -C "$workspace" init -q
          git -C "$workspace" remote add origin https://github.com/optical-lift/noel-core-db.git
          header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -C "$workspace" -c "http.extraHeader=AUTHORIZATION: basic $header" fetch -q --no-tags --depth=1 origin "$EXPECTED_SHA"
          unset header GH_TOKEN
          git -C "$workspace" checkout -q --detach FETCH_HEAD
          [[ "$(git -C "$workspace" rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          test -s "$workspace/supabase/migrations/20261104222535_titus_customer_workspace_first_course_v1.sql"
          test -s "$workspace/candidates/titus-first-draft-material-v1/candidate.sql"
          test -s "$workspace/candidates/titus-first-draft-material-v1/postconditions.sql"
          echo "Exact held source loaded: $EXPECTED_SHA; production migration unchanged"

      - name: Disposable network-isolated PostgreSQL 17, fictional identities only
        run: |
          set -euo pipefail
          cd "${TITUS_MATERIAL_WORKSPACE:?}"
          bash scripts/test-titus-first-material-hosted-pg17.sh

      - name: Clean only this job's checkout
        if: always()
        run: |
          set -euo pipefail
          case "${TITUS_MATERIAL_WORKSPACE:-}" in
            "${RUNNER_TEMP:?}"/titus-first-material.*)
              rm -rf -- "$TITUS_MATERIAL_WORKSPACE";;
          esac
